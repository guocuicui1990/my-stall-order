        // ==================== 辅助函数 ====================
        function formatDate(date) {
            const d = new Date(date);
            return d.toISOString().slice(0, 10);
        }

        function normalizeDate(input) {
            if (!input) return null;
            const str = input.trim();
            if (/^\d{4}-\d{2}-\d{2}$/.test(str)) return str;
            const digits = str.replace(/\D/g, '');
            if (digits.length === 8) {
                return `${digits.slice(0,4)}-${digits.slice(4,6)}-${digits.slice(6,8)}`;
            }
            return null;
        }

        function parseItemLine(line) {
            const normalized = line.trim();
            if (!normalized) return null;
            const match = normalized.match(/^(.+?)\s+(\d+(?:\.\d+)?)$/);
            if (match) {
                return { name: match[1].trim(), amount: parseFloat(match[2]) };
            }
            const multiMatch = normalized.match(/^(.+?)\s+(\d+(?:\.\d+)?)\s*[x×]\s*(\d+(?:\.\d+)?)(?:\s*=\s*(\d+(?:\.\d+)?))?$/);
            if (multiMatch) {
                const name = multiMatch[1].trim();
                const unit = parseFloat(multiMatch[2]);
                const qty = parseFloat(multiMatch[3]);
                let total = unit * qty;
                if (multiMatch[4]) total = parseFloat(multiMatch[4]);
                return { name: `${name}（${unit}×${qty}）`, amount: total };
            }
            return { name: normalized, amount: 0 };
        }

        function parseBackupText(text) {
            const lines = text.split(/\r?\n/);
            const records = [];
            let currentRecord = null;
            for (let line of lines) {
                line = line.trim();
                if (!line) continue;
                if (line.startsWith('日期：')) {
                    if (currentRecord && currentRecord.items.length) records.push(currentRecord);
                    const dateStr = line.replace('日期：', '').trim();
                    const normalized = normalizeDate(dateStr);
                    currentRecord = { service_date: normalized, mileage: null, items: [] };
                } else if (line.startsWith('里程：')) {
                    if (currentRecord) {
                        let mileStr = line.replace('里程：', '').trim();
                        mileStr = mileStr.replace(/[^0-9]/g, '');
                        if (mileStr) currentRecord.mileage = parseInt(mileStr, 10);
                    }
                } else if (line.startsWith('合计')) {
                    // 跳过
                } else {
                    if (currentRecord) {
                        const item = parseItemLine(line);
                        if (item && item.name) currentRecord.items.push(item);
                    }
                }
            }
            if (currentRecord && currentRecord.items.length) records.push(currentRecord);
            return records;
        }

        function exportRecordsToText(vehicle, records) {
            let lines = [];
            lines.push(`车辆：${vehicle.brand || ''} ${vehicle.model || ''}`.trim());
            lines.push(`车架号：${vehicle.vin || '未填写'}`);
            lines.push(`导出时间：${formatDate(new Date())}`);
            lines.push('===');
            for (let rec of records) {
                lines.push(`日期：${rec.service_date}`);
                lines.push(`里程：${rec.mileage !== null ? rec.mileage : '未填写'}`);
                for (let item of rec.items) {
                    lines.push(`${item.name} ${item.amount}`);
                }
                let total = rec.items.reduce((sum, i) => sum + i.amount, 0);
                lines.push(`合计 ${total.toFixed(2)}`);
                lines.push('---');
            }
            return lines.join('\n');
        }

                title.innerText = recordId ? '修改保养记录' : '新增保养记录';

            function addItemRow(container, name = '', amount = '') {
                const div = document.createElement('div');
                div.className = 'item-edit-row';
                div.innerHTML = `
                    <input type="text" name="item_name" placeholder="项目名称" value="${name}">
                    <input type="number" name="item_amount" placeholder="金额(元)" step="0.01" value="${amount}">
                `;
                container.appendChild(div);
            }

            function recognizeAndFill(text) {
                const lines = text.split(/\r?\n/);
                const items = [];
                for (let line of lines) {
                    const item = parseItemLine(line);
                    if (item && item.name) items.push(item);
                }
                if (items.length === 0) return false;
                const container = document.getElementById('itemsContainer');
                container.innerHTML = '';
                for (let item of items) {
                    addItemRow(container, item.name, item.amount);
                }
                return true;
            }

            async function saveRecord(form) {
                const service_date = normalizeDate(form.service_date.value);
                if (!service_date) { alert('保养时间格式无效'); return false; }
                const mileage = parseInt(form.mileage.value) || null;
                const itemRows = document.querySelectorAll('#itemsContainer .item-edit-row');
                const items = [];
                for (let row of itemRows) {
                    const name = row.querySelector('[name="item_name"]').value.trim();
                    const amount = parseFloat(row.querySelector('[name="item_amount"]').value);
                    if (name) items.push({ name, amount: isNaN(amount) ? 0 : amount });
                }
                if (items.length === 0) { alert('请至少填写一项保养内容'); return false; }
                const total_amount = items.reduce((sum, i) => sum + i.amount, 0);
                const details_json = items;
                if (editingRecordId) {
                    const { error } = await supabaseClient
                        .from('maintenance_records')
                        .update({ service_date, mileage, details_json, total_amount })
                        .eq('id', editingRecordId)
                        .eq('vehicle_id', vehicleId)
                        .eq('user_id', currentUserId);
                    if (error) { alert('更新失败: ' + error.message); return false; }
                } else {
                    const { error } = await supabaseClient
                        .from('maintenance_records')
                        .insert({ vehicle_id: vehicleId, user_id: currentUserId, service_date, mileage, details_json, total_amount });
                    if (error) { alert('新增失败: ' + error.message); return false; }
                }
                return true;
            }

            async function deleteRecord(recordId) {
                if (!confirm('确认删除这条保养记录吗？')) return;
                const { error } = await supabaseClient
                    .from('maintenance_records')
                    .delete()
                    .eq('id', recordId)
                    .eq('vehicle_id', vehicleId)
                    .eq('user_id', currentUserId);
                if (error) alert('删除失败: ' + error.message);
                else {
                    records = records.filter(r => r.id != recordId);
                    renderRecords();
                }
            }

            function exportRecords(range) {
                const now = new Date();
                let cutoff = null;
                if (range === '3m') cutoff = new Date(now.setMonth(now.getMonth() - 3));
                else if (range === '6m') cutoff = new Date(now.setMonth(now.getMonth() - 6));
                else if (range === '1y') cutoff = new Date(now.setFullYear(now.getFullYear() - 1));
                let filtered = records;
                if (cutoff) {
                    filtered = records.filter(r => new Date(r.service_date) >= cutoff);
                }
                const text = exportRecordsToText(vehicle, filtered);
                navigator.clipboard.writeText(text).then(() => {
                    alert(`已复制 ${filtered.length} 条记录到剪贴板`);
                }).catch(() => alert('复制失败，请手动复制'));
            }

            document.getElementById('addRecordBtn').onclick = () => openRecordModal();
            document.getElementById('closeRecordModal').onclick = () => document.getElementById('recordModal').classList.remove('show');
            document.getElementById('addItemBtn').onclick = () => addItemRow(document.getElementById('itemsContainer'));
            document.getElementById('recognizeBtn').onclick = () => {
                const text = document.getElementById('bulkText').value;
                if (text.trim()) recognizeAndFill(text);
                else alert('请粘贴文本');
            };
            document.getElementById('recordForm').onsubmit = async (e) => {
                e.preventDefault();
                if (await saveRecord(e.target)) {
                    document.getElementById('recordModal').classList.remove('show');
                    const { data: newRecs } = await supabaseClient
                        .from('maintenance_records')
                        .select('*')
                        .eq('vehicle_id', vehicleId)
                        .order('service_date', { ascending: false });
                    records = (newRecs || []).map(r => ({ ...r, items: r.details_json || [], total_amount: r.total_amount || 0 }));
                    renderRecords();
                }
            };
            document.getElementById('exportBtn').onclick = () => document.getElementById('exportModal').classList.add('show');
            document.getElementById('closeExportModal').onclick = () => document.getElementById('exportModal').classList.remove('show');
            document.getElementById('export3m').onclick = () => { exportRecords('3m'); document.getElementById('exportModal').classList.remove('show'); };
            document.getElementById('export6m').onclick = () => { exportRecords('6m'); document.getElementById('exportModal').classList.remove('show'); };
            document.getElementById('export1y').onclick = () => { exportRecords('1y'); document.getElementById('exportModal').classList.remove('show'); };
            document.getElementById('exportAll').onclick = () => { exportRecords('all'); document.getElementById('exportModal').classList.remove('show'); };

            renderRecords();
        }

        async function route() {
            const hash = window.location.hash.slice(1);
            if (hash === 'login') {
                await renderLogin();
            } else if (hash === 'vehicles') {
                await renderVehicles();
            } else if (hash.startsWith('vehicle/')) {
                const vehicleId = hash.split('/')[1];
                await renderVehicleDetail(vehicleId);
            } else {
                window.location.hash = '#login';
            }
        }

        window.addEventListener('hashchange', route);
        window.addEventListener('load', route);
    </script>
</body>
</html>
