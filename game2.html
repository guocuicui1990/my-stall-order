<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes, viewport-fit=cover">
    <title>🏎️ 碰碰车单词 · 60题闯关版</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: linear-gradient(145deg, #1a3a5c 0%, #2d5a7e 100%);
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            font-family: 'Quicksand', 'Segoe UI', sans-serif; padding: 12px; margin: 0;
            user-select: none; touch-action: manipulation; overflow-x: hidden;
        }
        .game-container {
            max-width: 550px; width: 100%; background: #0f2a44; border-radius: 48px 48px 32px 32px;
            box-shadow: 0 20px 0 #0a1a2b, 0 20px 30px rgba(0,0,0,0.5); border: 3px solid #ffd966;
            overflow: hidden; padding: 16px 12px 20px; position: relative;
        }
        .streak-bar-container {
            background: linear-gradient(145deg, #fbe4b0, #f5d69a); border-radius: 30px; padding: 8px 16px;
            margin-bottom: 12px; box-shadow: inset 0 2px 6px #fff3cf, 0 4px 0 #b4723a; border: 2px solid #ffbe5c;
            display: flex; align-items: center; justify-content: space-between; font-weight: bold; color: #412d1a;
        }
        .streak-label { font-size: 18px; display: flex; align-items: center; gap: 6px; }
        .streak-value { background: #2c5e2e; color: #f9e75c; padding: 4px 16px; border-radius: 40px; font-size: 22px; box-shadow: inset 0 1px 4px #a5d6a5; }
        .garage-btn {
            background: linear-gradient(145deg, #9b59b6, #8e44ad); border: none; color: white; font-weight: bold;
            font-size: 20px; padding: 6px 16px; border-radius: 40px; box-shadow: 0 5px 0 #6c3483; border: 2px solid #d2b4de;
            cursor: pointer; transition: 0.05s;
        }
        .garage-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #6c3483; }
        .game-header {
            display: flex; align-items: center; justify-content: space-between;
            background: linear-gradient(145deg, #ffc857, #ffb347); padding: 10px 16px;
            border-radius: 60px; margin-bottom: 12px; box-shadow: inset 0 2px 6px #fff3cf, 0 6px 0 #b47d2c;
            border: 2px solid #ffe39a; position: relative; overflow: hidden;
        }
        .game-header::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            animation: shine 3s infinite;
        }
        @keyframes shine { 0% { left: -100%; } 50%, 100% { left: 100%; } }
        .score-box {
            background: linear-gradient(145deg, #1e3a5f, #152a45); padding: 8px 20px;
            border-radius: 40px; color: #f9e75c; font-weight: 800; font-size: 24px;
            text-shadow: 2px 2px 0 #0f1e2c; box-shadow: inset 0 2px 5px #6d9ecc, 0 4px 0 #0a1925;
            border: 1px solid #ffd966; display: flex; align-items: center; gap: 8px;
            position: relative; overflow: hidden;
        }
        .score-box.bounce { animation: scoreBounce 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes scoreBounce { 0%,100% { transform: scale(1); } 50% { transform: scale(1.2); color: #fff; } }
        .combo-display {
            background: linear-gradient(145deg, #ff6b6b, #ee5a5a); color: white; padding: 4px 12px;
            border-radius: 20px; font-size: 14px; font-weight: bold; margin-left: 8px; opacity: 0;
            transform: scale(0); transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
        .combo-display.show { opacity: 1; transform: scale(1); }
        .combo-display.pulse { animation: comboPulse 0.5s ease-in-out; }
        @keyframes comboPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        .progress-bar {
            position: absolute; bottom: 0; left: 0; height: 4px;
            background: linear-gradient(90deg, #2ecc71, #f1c40f, #e74c3c); width: 0%;
            transition: width 0.1s linear; border-radius: 0 0 0 60px;
        }
        .header-buttons { display: flex; gap: 8px; }
        .finish-btn, .pause-btn {
            background: linear-gradient(145deg, #f1592b, #d94820); border: none; color: white;
            font-weight: bold; font-size: 18px; padding: 8px 16px; border-radius: 40px;
            box-shadow: 0 5px 0 #9f3015, 0 2px 8px rgba(0,0,0,0.2); border: 2px solid #ffb08e;
            cursor: pointer; transition: 0.05s linear; touch-action: manipulation; letter-spacing: 1px;
        }
        .pause-btn {
            background: linear-gradient(145deg, #3498db, #2980b9);
            box-shadow: 0 5px 0 #1a5276, 0 2px 8px rgba(0,0,0,0.2); border: 2px solid #85c1e9;
            font-size: 20px; padding: 8px 12px;
        }
        .finish-btn:active, .pause-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #9f3015, 0 2px 8px rgba(0,0,0,0.2); }
        .pause-btn:active { box-shadow: 0 2px 0 #1a5276, 0 2px 8px rgba(0,0,0,0.2); }
        .canvas-wrapper {
            position: relative; border-radius: 24px; overflow: hidden;
            box-shadow: inset 0 0 0 3px #fec165, 0 12px 0 #0a1a2b, 0 12px 20px rgba(0,0,0,0.4);
            border: 3px solid #ffdb8a; margin-bottom: 12px; background: #2a5a3a; transform-origin: center;
        }
        .canvas-wrapper.shake { animation: screenShake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both; }
        @keyframes screenShake {
            10%,90% { transform: translate3d(-2px, 0, 0) rotate(-0.5deg); }
            20%,80% { transform: translate3d(4px, 0, 0) rotate(0.5deg); }
            30%,50%,70% { transform: translate3d(-6px, 0, 0) rotate(-1deg); }
            40%,60% { transform: translate3d(6px, 0, 0) rotate(1deg); }
        }
        #gameCanvas { display: block; width: 100%; height: auto; background: #3a6e4a; cursor: pointer; touch-action: none; }
        .car-selector {
            background: linear-gradient(145deg, #fbe4b0, #f5d69a); border-radius: 40px 40px 20px 20px;
            padding: 20px 16px; margin: 8px 0 4px; box-shadow: inset 0 2px 10px #fff2d7, 0 8px 0 #b4723a;
            border: 2px solid #ffbe5c; transition: all 0.2s;
        }
        .selector-title {
            font-size: 24px; font-weight: 800; color: #412d1a; text-align: center; margin-bottom: 16px;
            text-shadow: 2px 2px 0 #ffd58c; position: relative;
        }
        .selector-title::after { content: '✨'; position: absolute; right: 20%; top: -5px; animation: float 2s ease-in-out infinite; }
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .car-list { display: flex; justify-content: space-around; gap: 12px; }
        .car-option {
            background: linear-gradient(145deg, #feeac2, #fce8b8); border-radius: 30px; padding: 16px 8px;
            flex: 1; text-align: center; box-shadow: 0 6px 0 #b4723a, 0 4px 8px rgba(0,0,0,0.1);
            border: 3px solid #ffbc6c; cursor: pointer; transition: all 0.1s; touch-action: manipulation;
            position: relative; overflow: hidden;
        }
        .car-option:hover { transform: translateY(-2px); }
        .car-option.selected {
            background: linear-gradient(145deg, #c7e9b0, #a8d990); border-color: #6da546;
            box-shadow: 0 6px 0 #5a8737, 0 4px 8px rgba(0,0,0,0.1), inset 0 0 20px rgba(255,255,255,0.5);
            transform: scale(0.98);
        }
        .car-option.selected::before {
            content: '✓'; position: absolute; top: 5px; right: 10px; background: #6da546;
            color: white; width: 20px; height: 20px; border-radius: 50%; font-size: 14px;
            line-height: 20px; font-weight: bold;
        }
        .car-emoji {
            font-size: 52px; line-height: 1.2; filter: drop-shadow(2px 4px 4px rgba(0,0,0,0.2));
            display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 5px;
        }
        .car-icon { font-size: 52px; }
        .car-option[data-car="green"] .car-icon { filter: hue-rotate(120deg) saturate(1.5) brightness(0.9); }
        .color-dot {
            width: 52px; height: 52px; border-radius: 50%; display: inline-block;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2); border: 2px solid rgba(255,255,255,0.5);
        }
        .dot-red { background: #e03a3a; } .dot-blue { background: #3a7bd5; } .dot-green { background: #2ecc71; }
        .car-option.selected .color-dot { box-shadow: 0 0 0 3px #f1c40f, 0 4px 6px rgba(0,0,0,0.2); }
        .car-name { font-size: 18px; font-weight: 700; color: #4b2e1a; }
        .start-btn {
            background: linear-gradient(145deg, #2ecc71, #27ae60); border: none; font-weight: 800;
            font-size: 32px; padding: 16px 20px; border-radius: 60px;
            box-shadow: 0 8px 0 #1f8f4b, 0 4px 8px rgba(0,0,0,0.1); border: 3px solid #a3e4b0;
            color: #1a3e1f; cursor: pointer; width: 100%; margin-top: 20px; text-shadow: 1px 1px 0 #d4ffcf;
            transition: all 0.1s; touch-action: manipulation; letter-spacing: 4px; position: relative; overflow: hidden;
        }
        .start-btn:active { transform: translateY(5px); box-shadow: 0 3px 0 #1f8f4b, 0 4px 8px rgba(0,0,0,0.1); }
        .result-panel {
            background: linear-gradient(145deg, #fbe4b0, #f5d69a); border-radius: 40px; padding: 20px;
            margin-top: 10px; text-align: center; box-shadow: inset 0 2px 8px #fff8e7, 0 8px 0 #b4723a;
            border: 2px solid #ffbe5c; position: relative; overflow: hidden;
        }
        .result-score {
            font-size: 64px; font-weight: 900; color: #2c5e2e; text-shadow: 3px 3px 0 #b0d37c, 6px 6px 0 rgba(0,0,0,0.1);
            margin: 10px 0; display: inline-block; animation: scorePop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes scorePop { 0% { transform: scale(0) rotate(-10deg); } 100% { transform: scale(1) rotate(0deg); } }
        .play-again-btn {
            background: linear-gradient(145deg, #ffaa33, #ff9500); border: none; font-size: 28px;
            padding: 14px 24px; border-radius: 50px; box-shadow: 0 6px 0 #b4731e, 0 4px 8px rgba(0,0,0,0.2);
            font-weight: bold; margin-top: 16px; cursor: pointer; border: 2px solid #ffdd99;
            color: #4b2e1a; transition: all 0.1s;
        }
        .play-again-btn:active { transform: translateY(2px); box-shadow: 0 4px 0 #b4731e, 0 2px 4px rgba(0,0,0,0.2); }
        .hidden { display: none !important; }
        .message-area {
            min-height: 40px; color: #f9e75c; font-weight: 700; font-size: 20px; text-align: center;
            margin: 6px 0; text-shadow: 2px 2px 0 #0f1e2c; display: flex; align-items: center;
            justify-content: center; gap: 10px;
        }
        .pause-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8);
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100;
            border-radius: 24px; backdrop-filter: blur(5px);
        }
        .pause-text { font-size: 48px; color: white; font-weight: bold; text-shadow: 0 4px 8px rgba(0,0,0,0.5); margin-bottom: 20px; }
        .resume-btn {
            background: linear-gradient(145deg, #2ecc71, #27ae60); border: none; color: white; font-size: 24px;
            padding: 12px 32px; border-radius: 40px; cursor: pointer; font-weight: bold; box-shadow: 0 6px 0 #1f8f4b;
            transition: all 0.1s;
        }
        .resume-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #1f8f4b; }
        .difficulty-indicator {
            position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.6); color: #f9e75c;
            padding: 4px 12px; border-radius: 20px; font-size: 14px; font-weight: bold; border: 1px solid #ffd966;
        }
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7);
            display: flex; justify-content: center; align-items: center; z-index: 200; backdrop-filter: blur(4px);
        }
        .modal-content {
            background: #fbe4b0; border-radius: 48px; padding: 24px; max-width: 500px; width: 95%;
            max-height: 80vh; overflow-y: auto; box-shadow: 0 16px 0 #b4723a; border: 3px solid #ffbe5c;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-title { font-size: 28px; font-weight: 800; color: #412d1a; text-shadow: 2px 2px 0 #ffd58c; }
        .close-modal {
            font-size: 32px; cursor: pointer; background: #e74c3c; color: white; width: 48px; height: 48px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 0 #b03a2e;
        }
        .skin-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .skin-item {
            background: white; border-radius: 20px; padding: 12px 4px; text-align: center;
            box-shadow: 0 4px 0 #aaa; border: 2px solid #ddd; cursor: pointer; transition: 0.1s; position: relative;
        }
        .skin-item.locked { opacity: 0.5; filter: grayscale(0.8); cursor: not-allowed; }
        .skin-item.selected { border: 4px solid #f1c40f; box-shadow: 0 0 0 2px #2ecc71, 0 4px 0 #aaa; transform: scale(0.98); }
        .skin-preview { font-size: 42px; margin-bottom: 5px; }
        .skin-name { font-size: 14px; font-weight: bold; }
        .lock-icon { position: absolute; top: 5px; right: 5px; font-size: 20px; }
        .report-container { background: #fff8e7; border-radius: 32px; padding: 24px; text-align: center; }
        .report-title { font-size: 32px; font-weight: 800; color: #2c3e50; margin-bottom: 16px; }
        .report-words { background: #e8f4f8; padding: 12px; border-radius: 24px; margin: 16px 0; }
        .word-badge {
            display: inline-block; background: #f1c40f; color: #2c3e50; padding: 6px 16px;
            margin: 4px; border-radius: 30px; font-weight: bold; font-size: 20px;
        }
        .report-stats { display: flex; justify-content: space-around; margin: 20px 0; }
        .stat-item { text-align: center; }
        .stat-value { font-size: 36px; font-weight: 900; color: #e67e22; }
        .stat-label { font-size: 16px; color: #7f8c8d; }
        .compare-badge { background: #2ecc71; color: white; padding: 8px; border-radius: 40px; margin: 16px 0; }
        .save-report-btn {
            background: #3498db; color: white; border: none; font-size: 24px; padding: 14px 24px;
            border-radius: 60px; box-shadow: 0 6px 0 #1f618d; font-weight: bold; cursor: pointer;
            margin-top: 16px; width: 100%;
        }
        .save-report-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 #1f618d; }
        .preview-container {
            display: flex; align-items: center; justify-content: center; gap: 20px; margin: 10px 0;
        }
        #carPreviewCanvas { background: transparent; }
        #currentCarColorDot {
            width: 52px; height: 52px; border-radius: 50%; box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        @media (max-width: 450px) {
            .car-icon { font-size: 42px; } .color-dot { width: 42px; height: 42px; }
            .car-name { font-size: 16px; } .finish-btn, .pause-btn { font-size: 16px; padding: 6px 12px; }
            .score-box { font-size: 20px; }
        }
    </style>
</head>
<body>
<div class="game-container" id="gameContainer">
    <div class="streak-bar-container">
        <div class="streak-label">🔥 连续学习 <span id="streakDays">0</span> 天</div>
        <div class="streak-value" id="nextUnlockHint">正确率≥90%解锁新皮肤</div>
        <button class="garage-btn" id="garageBtn">🎨 车库</button>
    </div>
    <div class="game-header">
        <div class="score-box" id="scoreBox">
            🏆 <span id="scoreValue">0</span>
            <span class="combo-display" id="comboDisplay">连击 x1</span>
        </div>
        <div class="header-buttons">
            <button class="pause-btn hidden" id="pauseBtn">⏸</button>
            <button class="finish-btn" id="finishGameBtn">🏁 完成</button>
        </div>
        <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="canvas-wrapper" id="canvasWrapper">
        <canvas id="gameCanvas" width="500" height="600"></canvas>
        <div class="difficulty-indicator hidden" id="difficultyIndicator">速度: 1.0x</div>
        <div class="pause-overlay hidden" id="pauseOverlay">
            <div class="pause-text">⏸ 游戏暂停</div>
            <button class="resume-btn" id="resumeBtn">▶ 继续游戏</button>
        </div>
    </div>
    <div class="message-area" id="gameMessage">✨ 选一辆赛车，开始冒险吧！</div>
    <div id="carSelectPanel" class="car-selector">
        <div class="selector-title">🚗 选你的战车 🚗</div>
        <div class="preview-container">
            <canvas id="carPreviewCanvas" width="80" height="60"></canvas>
            <div id="currentCarColorDot" class="dot-red"></div>
            <span id="currentCarNameDisplay" style="font-weight:bold;">闪电红·跑车</span>
        </div>
        <div class="car-list">
            <div class="car-option" data-car="red">
                <div class="car-emoji"><span class="car-icon">🏎️</span><span class="color-dot dot-red"></span></div>
                <div class="car-name">闪电红 · 跑车</div>
            </div>
            <div class="car-option" data-car="blue">
                <div class="car-emoji"><span class="car-icon">🚙</span><span class="color-dot dot-blue"></span></div>
                <div class="car-name">旋风蓝 · SUV</div>
            </div>
            <div class="car-option" data-car="green">
                <div class="car-emoji"><span class="car-icon">🚗</span><span class="color-dot dot-green"></span></div>
                <div class="car-name">丛林绿 · 轿车</div>
            </div>
        </div>
        <button class="start-btn" id="startGameBtn">🚦 出发！</button>
    </div>
    <div id="resultPanel" class="result-panel hidden">
        <div style="font-size:28px; font-weight:800;">🎉 闯关成功 🎉</div>
        <div class="result-score" id="finalScore">0</div>
        <div id="resultComment" style="font-size:20px; margin: 8px 0; color: #5d4037; font-weight: 600;">⭐ 你真棒 ⭐</div>
        <div style="font-size:16px; color: #7f8c8d; margin-top: 8px;">
            最高连击: <span id="maxCombo" style="color: #e74c3c; font-weight: bold;">0</span> | 
            正确率: <span id="accuracy" style="color: #3498db; font-weight: bold;">0%</span>
        </div>
        <button class="play-again-btn" id="viewReportBtn" style="background: #3498db; box-shadow: 0 6px 0 #1f618d; margin-right: 8px;">📊 学习报告</button>
        <button class="play-again-btn" id="playAgainBtn">🔄 再玩一次</button>
    </div>
</div>
<!-- 车库模态框 -->
<div id="garageModal" class="modal-overlay hidden">
    <div class="modal-content">
        <div class="modal-header"><div class="modal-title" id="modalTitle">🚗 赛车皮肤</div><div class="close-modal" id="closeModalBtn">✕</div></div>
        <div style="display: flex; gap: 20px; margin-bottom: 20px;">
            <button id="showCarSkinsBtn" class="garage-btn" style="background:#e67e22;">赛车</button>
            <button id="showTrackSkinsBtn" class="garage-btn" style="background:#2ecc71;">赛道</button>
        </div>
        <div id="skinGrid" class="skin-grid"></div>
    </div>
</div>
<!-- 学习报告模态框 -->
<div id="reportModal" class="modal-overlay hidden">
    <div class="modal-content report-container">
        <div class="modal-header"><div class="modal-title">📚 学习报告</div><div class="close-modal" id="closeReportBtn">✕</div></div>
        <div id="reportContent"></div>
        <button class="save-report-btn" id="saveReportBtn">📸 保存报告并分享</button>
    </div>
</div>
<script>
    (function(){
        "use strict";

        // ---------- 词库：人教版一年级词汇 ----------
        const WORDS = [
            { word: 'cat', emoji: '🐱' }, { word: 'dog', emoji: '🐶' }, { word: 'pig', emoji: '🐷' },

            { word: 'bird', emoji: '🐦' }, { word: 'rabbit', emoji: '🐰' }, { word: 'monkey', emoji: '🐵' },
            { word: 'duck', emoji: '🦆' }, { word: 'bear', emoji: '🐻' }, { word: 'tiger', emoji: '🐯' },
            { word: 'lion', emoji: '🦁' }, { word: 'elephant', emoji: '🐘' }, { word: 'panda', emoji: '🐼' },
            { word: 'frog', emoji: '🐸' }, { word: 'mouse', emoji: '🐭' }, { word: 'horse', emoji: '🐴' },
            { word: 'sheep', emoji: '🐑' }, { word: 'chicken', emoji: '🐔' },
            { word: 'book', emoji: '📚' }, { word: 'teacher', emoji: '👩‍🏫' }, { word: 'ruler', emoji: '📏' },
            { word: 'pencil', emoji: '✏️' }, { word: 'schoolbag', emoji: '🎒' }, { word: 'face', emoji: '😊' },
            { word: 'mouth', emoji: '👄' }, { word: 'ear', emoji: '👂' }, { word: 'eye', emoji: '👁️' },
            { word: 'nose', emoji: '👃' }, { word: 'hand', emoji: '✋' }, { word: 'leg', emoji: '🦵' },

        // ========== 音频系统 ==========
        let audioCtx = null;
        function initAudio() {
            if (audioCtx) return true;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                return true;
            } catch(e) { console.warn('Web Audio 不支持'); return false; }
        }
        function activateAudio() {
            if (!audioCtx) initAudio();
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume().then(() => {
                    const buffer = audioCtx.createBuffer(1, 1, 22050);
                    const source = audioCtx.createBufferSource();
                    source.buffer = buffer;
                    source.connect(audioCtx.destination);
                    source.start(0);
                }).catch(e => console.warn('音频激活失败', e));
            }
        }
        function playExplosionSound() {
            if (!audioCtx) { initAudio(); if (!audioCtx) return; }
            if (audioCtx.state === 'suspended') { audioCtx.resume().then(() => playExplosionSoundNow()); return; }
            playExplosionSoundNow();
        }
        function playExplosionSoundNow() {
            if (!audioCtx || audioCtx.state !== 'running') return;
            const now = audioCtx.currentTime;
            for (let i=0; i<3; i++) {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(150 - i*30, now + i*0.06);
                osc.frequency.exponentialRampToValueAtTime(40, now + i*0.06 + 0.1);
                gain.gain.setValueAtTime(0.25, now + i*0.06);
                gain.gain.exponentialRampToValueAtTime(0.001, now + i*0.06 + 0.15);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now + i*0.06); osc.stop(now + i*0.06 + 0.2);
            }
            const bufferSize = audioCtx.sampleRate * 0.2;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.2));
            const noise = audioCtx.createBufferSource(); noise.buffer = buffer;
            const noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(0.3, now); noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            noise.connect(noiseGain); noiseGain.connect(audioCtx.destination);
            noise.start(now);
        }
        function playWrongSound() {
            if (!audioCtx) { initAudio(); if (!audioCtx) return; }
            if (audioCtx.state === 'suspended') { audioCtx.resume().then(() => playWrongSoundNow()); return; }
            playWrongSoundNow();
        }
        function playWrongSoundNow() {
            if (!audioCtx || audioCtx.state !== 'running') return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.linearRampToValueAtTime(100, now + 0.2);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now); osc.stop(now + 0.3);
        }
        function playComboSound(comboCount) {
            if (!audioCtx) { initAudio(); if (!audioCtx) return; }
            if (audioCtx.state === 'suspended') { audioCtx.resume().then(() => playComboSoundNow(comboCount)); return; }
            playComboSoundNow(comboCount);
        }
        function playComboSoundNow(comboCount) {
            if (!audioCtx || audioCtx.state !== 'running') return;
            const now = audioCtx.currentTime;
            const baseFreq = 440 + Math.min(comboCount * 50, 500);
            for (let i = 0; i < 3; i++) {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = baseFreq + i * 100;
                gain.gain.setValueAtTime(0.1, now + i * 0.05);
                gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.05 + 0.1);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now + i * 0.05); osc.stop(now + i * 0.05 + 0.1);
            }
        }

        // 绘制车辆
        function drawCarGeneric(ctx, skin, x, y, crashOffset = 0) {
            const color = skin.color;
            y += crashOffset;
            ctx.save();
            ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(x, y+42, 28, 12, 0, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = color;
            if (skin.type.includes('sports') || skin.type === 'race') {
                ctx.beginPath(); ctx.moveTo(x-28, y+12); ctx.lineTo(x-30, y-8); ctx.quadraticCurveTo(x-32, y-22, x-20, y-28);
                ctx.lineTo(x+20, y-28); ctx.quadraticCurveTo(x+32, y-22, x+30, y-8); ctx.lineTo(x+28, y+12); ctx.fill();
                ctx.fillStyle = '#1e2f4b'; ctx.fillRect(x-14, y-28, 28, 5);
            } else if (skin.type === 'suv' || skin.type === 'truck') {
                ctx.fillRect(x-26, y-30, 52, 60);
                ctx.fillStyle = '#1e2f4b'; ctx.fillRect(x-18, y-22, 14, 18); ctx.fillRect(x+4, y-22, 14, 18);
            } else {
                ctx.beginPath(); ctx.ellipse(x, y-5, 28, 20, 0, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#1e2f4b'; ctx.fillRect(x-16, y-22, 32, 10);
            }
            ctx.fillStyle = '#1a1a1a';
            [[-30,6],[30,6],[-30,-12],[30,-12]].forEach(p => { ctx.beginPath(); ctx.arc(x+p[0], y+p[1], 9, 0, 2*Math.PI); ctx.fill(); });
            ctx.fillStyle = '#bdc3c7';
            [[-30,6],[30,6],[-30,-12],[30,-12]].forEach(p => { ctx.beginPath(); ctx.arc(x+p[0], y+p[1], 5, 0, 2*Math.PI); ctx.fill(); });
            ctx.restore();
        }

            drawCarGeneric(ctx, carSkins[currentCarSkinId], carX, carY + offsetY, 0);

            [120, 250, 380].forEach(x => { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, CH); ctx.stroke(); });

            if (gameActive && !gamePaused) roadOffset = (roadOffset + 6 * gameSpeed) % 100;

        // 绘制物品
        function drawItems() {
            items.forEach(item => {

                ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(x, y + 50, 40, 10, 0, 0, Math.PI*2); ctx.fill();
                ctx.save(); ctx.translate(x, y + floatY);
                ctx.strokeStyle = '#FFD700'; ctx.lineWidth = 3; ctx.setLineDash([15, 10]); 
                ctx.beginPath(); ctx.arc(0, 0, 68, 0, Math.PI*2); ctx.stroke();
                ctx.setLineDash([]);
                ctx.strokeStyle = 'rgba(255,215,0,0.5)'; ctx.lineWidth = 2; 
                ctx.beginPath(); ctx.arc(0, 0, 75, 0, Math.PI*2); ctx.stroke();
                ctx.font = '110px "Segoe UI Emoji", "Apple Color Emoji", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.shadowColor = 'rgba(0,0,0,0.3)'; ctx.shadowBlur = 15; ctx.shadowOffsetY = 10;
                ctx.fillText(item.wordObj.emoji, 0, 0);
                ctx.restore();
                ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.beginPath(); 
                ctx.ellipse(x, y+floatY+55, 50, 20, 0, 0, Math.PI*2); ctx.fill();
                ctx.font = 'bold 26px "Quicksand", sans-serif'; ctx.fillStyle = '#FFD966'; ctx.textAlign = 'center';

        }

        function resetGame() {
            gameActive = true; gamePaused = false; score = 0; combo = 0; maxCombo = 0; correctCount = 0; wrongCount = 0;
            gameSpeed = 1.0; difficultyLevel = 1; items = []; carX = CW/2; roadOffset = 0; gameStartTime = performance.now();
            lastSpawnTime = performance.now(); learnedWords.clear();
            updateScoreUI(); updateComboUI(); progressBar.style.width = '0%';
            difficultyIndicator.classList.remove('hidden'); gameMessage.textContent = '🔊 听单词，点击正确的图片！';
            updateSpeedDisplay();
            spawnItems();
        }

        function finishGame() {
            if (!gameActive) return;
            gameActive = false; gamePaused = false;
            if (animationFrame) { cancelAnimationFrame(animationFrame); animationFrame = null; }
            items.filter(i => i.isTarget && i.y > 600).forEach(i => learnedWords.add(i.wordObj.word));
            incrementStreak();
            const total = correctCount + wrongCount;
            const acc = total > 0 ? Math.round(correctCount / total * 100) : 0;
            finalScoreSpan.textContent = score; maxComboSpan.textContent = maxCombo; accuracySpan.textContent = acc+'%';
            resultComment.textContent = acc >= 90 ? '🏆 完美表现！' : acc >= 60 ? '👍 做得不错！' : '⭐ 继续加油';
            resultPanel.classList.remove('hidden'); carSelectPanel.classList.add('hidden');
            pauseBtn.classList.add('hidden'); difficultyIndicator.classList.add('hidden');
            if (window.speechSynthesis) window.speechSynthesis.cancel();
            if (acc >= 90) unlockNextSkins();
        }

        function updateScoreUI() { scoreSpan.textContent = score; }
        function updateComboUI() { comboDisplay.textContent = `连击 x${combo}`; comboDisplay.classList.toggle('show', combo>1); }

        // 速度逻辑：基于总答题数(正确+错误)相对于目标题数60，每完成4题增加0.1，上限2.5
        function updateGameSpeed() {
            const totalAttempts = correctCount + wrongCount;
            const targetTotal = TOTAL_QUESTIONS;
            const maxSpeed = 2.5;
            const minSpeed = 1.0;
            const steps = 15;
            const attemptsPerStep = targetTotal / steps;
            
            let step = Math.floor(totalAttempts / attemptsPerStep);
            let newSpeed = Math.min(maxSpeed, minSpeed + step * 0.1);
            gameSpeed = Math.round(newSpeed * 10) / 10;
            difficultyLevel = 1 + Math.floor((gameSpeed - 1.0) * 5);
            
            updateSpeedDisplay();
            updateProgressBar();
            
            // 检查是否完成所有题目
            if (totalAttempts >= targetTotal) {
                finishGame();
            }
        }

        function updateSpeedDisplay() {
            difficultyIndicator.textContent = `速度: ${gameSpeed.toFixed(1)}x (${correctCount+wrongCount}/${TOTAL_QUESTIONS})`;
        }

        function updateProgressBar() {
            const totalAttempts = correctCount + wrongCount;
            const percent = Math.min(100, (totalAttempts / TOTAL_QUESTIONS) * 100);
            progressBar.style.width = percent + '%';
        }

        function createExplosion() {
            canvasWrapper.classList.add('shake');
            setTimeout(() => canvasWrapper.classList.remove('shake'), 400);
        }

        function handleCanvasClick(e) {
            if (!gameActive || gamePaused || isMovingForCollision) return;
            const rect = canvas.getBoundingClientRect();
            const cx = (e.clientX - rect.left) * (CW/rect.width), cy = (e.clientY - rect.top) * (CH/rect.height);
            for (let item of items) {
                if (Math.hypot(cx - item.x, cy - item.y) < 80) {
                    if (item.isTarget) {
                        targetItem = item; isMovingForCollision = true; collisionHappened = false;
                        gameMessage.textContent = `🚗 撞击准备！`; speakWord(item.wordObj.word);
                    } else {
                        wrongCount++; combo = 0; updateComboUI();
                        gameMessage.textContent = `❌ 错了！是 ${item.wordObj.word}`;
                        score = Math.max(0, score-5); updateScoreUI();
                        playWrongSound(); speakWrong();
                        updateGameSpeed();
                    }
                    break;
                }
            }
        }

        function gameLoop(now) {
            if (!gameActive) return;
            if (!gamePaused) {
                if (now - lastSpawnTime >= SPAWN_INTERVAL / gameSpeed) { spawnItems(); lastSpawnTime = now; }
                updateItems();
                if (isMovingForCollision && targetItem) {
                    const dx = targetItem.x - carX, dy = carY - targetItem.y;
                    carX += dx * 0.1;
                    if (Math.abs(dx) < 5 && dy < 30 && !collisionHappened) {
                        collisionHappened = true; crashAnim = 1.0;
                        combo++; if(combo>maxCombo) maxCombo=combo; correctCount++;
                        score += 10 + (combo>1?combo*2:0); updateScoreUI(); updateComboUI();
                        playExplosionSound(); if (combo > 1) playComboSound(combo);
                        speakChinesePraise();
                        gameMessage.textContent = `✅ 正确！${targetItem.wordObj.word}`;
                        createExplosion();
                        updateGameSpeed();
                        items = items.filter(i => i !== targetItem);
                        isMovingForCollision = false; targetItem = null;
                    }
                } else { carX = carX * 0.9 + (CW/2) * 0.1; }
            }
            drawRoad(); drawItems(); drawCar();
            requestAnimationFrame(gameLoop);
        }

        function renderSkinGrid(type) {
            const skins = type==='car'?carSkins:trackSkins;
            const cur = type==='car'?currentCarSkinId:currentTrackSkinId;
            document.getElementById('modalTitle').textContent = type==='car'?'🚗 赛车皮肤':'🛣️ 赛道皮肤';
            const grid = document.getElementById('skinGrid');
            grid.innerHTML = '';
            skins.forEach(s => {
                const div = document.createElement('div');
                div.className = `skin-item ${s.unlocked?'':'locked'} ${s.id===cur?'selected':''}`;
                div.innerHTML = `<div class="skin-preview">${type==='car'?'🚗':'🛣️'}</div><div class="skin-name">${s.name}</div>${s.unlocked?'':'<div class="lock-icon">🔒</div>'}`;
                if (s.unlocked) div.onclick = () => {
                    if (type==='car') { 
                        currentCarSkinId = s.id; 
                        updatePreview();
                        if (s.id < 3) {
                            selectedCar = s.id===0?'red':(s.id===1?'blue':'green');
                            carOptions.forEach(opt => opt.classList.remove('selected'));
                            document.querySelector(`.car-option[data-car="${selectedCar}"]`).classList.add('selected');
                        } else carOptions.forEach(opt => opt.classList.remove('selected'));
                    } else currentTrackSkinId = s.id;
                    renderSkinGrid(type);
                };
                grid.appendChild(div);
            });
        }

        window.onload = () => {
            loadStreak(); loadUnlocks(); updatePreview();
            carOptions.forEach(opt => opt.addEventListener('click', () => {
                carOptions.forEach(o => o.classList.remove('selected'));
                opt.classList.add('selected');
                selectedCar = opt.dataset.car;
                const map = { red:0, blue:1, green:2 };
                currentCarSkinId = map[selectedCar];
                updatePreview();
            }));
            document.querySelector('[data-car="red"]').classList.add('selected');

            document.getElementById('garageBtn').onclick = () => {
                document.getElementById('garageModal').classList.remove('hidden');
                renderSkinGrid('car');
            };
            document.getElementById('closeModalBtn').onclick = () => document.getElementById('garageModal').classList.add('hidden');
            document.getElementById('showCarSkinsBtn').onclick = () => renderSkinGrid('car');
            document.getElementById('showTrackSkinsBtn').onclick = () => renderSkinGrid('track');

            startBtn.onclick = () => {
                activateAudio(); enableSpeech(); initAudio();
                carSelectPanel.classList.add('hidden'); resultPanel.classList.add('hidden'); pauseBtn.classList.remove('hidden');
                resetGame(); animationFrame = requestAnimationFrame(gameLoop);
            };
            finishBtn.onclick = () => { if(gameActive) finishGame(); };
            playAgainBtn.onclick = () => { resultPanel.classList.add('hidden'); carSelectPanel.classList.remove('hidden'); };
            pauseBtn.onclick = () => { gamePaused=!gamePaused; pauseOverlay.classList.toggle('hidden', !gamePaused); };
            document.getElementById('resumeBtn').onclick = () => { gamePaused=false; pauseOverlay.classList.add('hidden'); };
            canvas.onclick = handleCanvasClick;
            canvas.ontouchstart = (e) => { e.preventDefault(); const t = e.touches[0]; handleCanvasClick({ clientX: t.clientX, clientY: t.clientY }); };

            document.getElementById('viewReportBtn').onclick = () => {
                const words = Array.from(learnedWords).slice(0,8);
                const acc = accuracySpan.textContent;
                const last = localStorage.getItem('bbCar_lastScore_v9')||0;
                localStorage.setItem('bbCar_lastScore_v9', score);
                document.getElementById('reportContent').innerHTML = `
                    <div class="report-title">🎓 宝宝真棒！</div>
                    <div class="report-words">${words.map(w=>`<span class="word-badge">${w}</span>`).join('')}</div>
                    <div class="report-stats"><div class="stat-item"><div class="stat-value">${score}</div><div class="stat-label">总分</div></div><div class="stat-item"><div class="stat-value">${acc}</div><div class="stat-label">正确率</div></div><div class="stat-item"><div class="stat-value">${maxCombo}</div><div class="stat-label">最高连击</div></div></div>
                    <div class="compare-badge">${score>last?'🎉 比上次进步了 '+(score-last)+' 分！':'💪 保持状态！'}</div>
                    <p>连续学习 ${streakData.days} 天 🔥</p>`;
                document.getElementById('reportModal').classList.remove('hidden');
            };
            document.getElementById('closeReportBtn').onclick = () => document.getElementById('reportModal').classList.add('hidden');
            document.getElementById('saveReportBtn').onclick = () => alert('长按屏幕截图即可保存分享！');
        };
    })();
</script>
</body>
</html>
