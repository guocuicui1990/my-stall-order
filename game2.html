<!DOCTYPE html>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: linear-gradient(145deg, #1a3a5c 0%, #2d5a7e 100%);
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            font-family: 'Quicksand', 'Segoe UI', sans-serif; padding: 12px; margin: 0;
            user-select: none; touch-action: manipulation; overflow-x: hidden;
        }
        .game-container {
            max-width: 550px; width: 100%; background: #0f2a44; border-radius: 48px 48px 32px 32px;
            box-shadow: 0 20px 0 #0a1a2b, 0 20px 30px rgba(0,0,0,0.5); border: 3px solid #ffd966;
            overflow: hidden; padding: 16px 12px 20px; position: relative;
        }
        .game-header {
            display: flex; align-items: center; justify-content: space-between;
            background: linear-gradient(145deg, #ffc857, #ffb347); padding: 10px 16px;
            border-radius: 60px; margin-bottom: 12px; box-shadow: inset 0 2px 6px #fff3cf, 0 6px 0 #b47d2c;
            border: 2px solid #ffe39a; position: relative; overflow: hidden;
        }
        .game-header::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            animation: shine 3s infinite;

            background: linear-gradient(145deg, #1e3a5f, #152a45); padding: 8px 20px;
            border-radius: 40px; color: #f9e75c; font-weight: 800; font-size: 24px;
            text-shadow: 2px 2px 0 #0f1e2c; box-shadow: inset 0 2px 5px #6d9ecc, 0 4px 0 #0a1925;
            border: 1px solid #ffd966; display: flex; align-items: center; gap: 8px;
            position: relative; overflow: hidden;

        .score-box.bounce { animation: scoreBounce 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes scoreBounce { 0%,100% { transform: scale(1); } 50% { transform: scale(1.2); color: #fff; } }
        .combo-display {
            background: linear-gradient(145deg, #ff6b6b, #ee5a5a); color: white; padding: 4px 12px;
            border-radius: 20px; font-size: 14px; font-weight: bold; margin-left: 8px; opacity: 0;
            transform: scale(0); transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
        .combo-display.show { opacity: 1; transform: scale(1); }
        .combo-display.pulse { animation: comboPulse 0.5s ease-in-out; }
        @keyframes comboPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        .timer-bar {
            position: absolute; bottom: 0; left: 0; height: 4px;
            background: linear-gradient(90deg, #2ecc71, #f1c40f, #e74c3c); width: 100%;

        .header-buttons { display: flex; gap: 8px; }

            box-shadow: 0 5px 0 #9f3015, 0 2px 8px rgba(0,0,0,0.2); border: 2px solid #ffb08e;

            background: linear-gradient(145deg, #3498db, #2980b9);

        .car-name { font-size: 18px; font-weight: 700; color: #4b2e1a; }

            transition: all 0.1s; touch-action: manipulation; letter-spacing: 4px; position: relative; overflow: hidden;
        }
        .start-btn::after {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.3), transparent);
            transform: rotate(45deg); transition: all 0.5s;
        }
        .start-btn:hover::after { left: 100%; }
        .start-btn:active { transform: translateY(5px); box-shadow: 0 3px 0 #1f8f4b, 0 4px 8px rgba(0,0,0,0.1); }
        .result-panel {
            background: linear-gradient(145deg, #fbe4b0, #f5d69a); border-radius: 40px; padding: 20px;
            margin-top: 10px; text-align: center; box-shadow: inset 0 2px 8px #fff8e7, 0 8px 0 #b4723a;
            border: 2px solid #ffbe5c; position: relative; overflow: hidden;
        }
        .result-panel::before {
            content: '🎉'; position: absolute; font-size: 100px; opacity: 0.1; top: -20px; left: -20px;
            animation: rotate 10s linear infinite;
        }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .result-score {

        .play-again-btn {

            min-height: 40px; color: #f9e75c; font-weight: 700; font-size: 20px; text-align: center;
            margin: 6px 0; text-shadow: 2px 2px 0 #0f1e2c; display: flex; align-items: center;
            justify-content: center; gap: 10px;
        }
        .message-area.correct { color: #2ecc71; animation: messagePulse 0.5s; }
        .message-area.wrong { color: #e74c3c; animation: shake 0.5s; }
        @keyframes messagePulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
        .pause-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8);
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100;
            border-radius: 24px; backdrop-filter: blur(5px);

        .resume-btn {
            background: linear-gradient(145deg, #2ecc71, #27ae60); border: none; color: white; font-size: 24px;
            padding: 12px 32px; border-radius: 40px; cursor: pointer; font-weight: bold; box-shadow: 0 6px 0 #1f8f4b;
            transition: all 0.1s;
        }
        .resume-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #1f8f4b; }
        .difficulty-indicator {
            position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.6); color: #f9e75c;
            padding: 4px 12px; border-radius: 20px; font-size: 14px; font-weight: bold; border: 1px solid #ffd966;

            .car-icon { font-size: 42px; } .color-dot { width: 42px; height: 42px; }
            .car-name { font-size: 16px; } .finish-btn, .pause-btn { font-size: 16px; padding: 6px 12px; }
            .score-box { font-size: 20px; }
        }
    </style>

            if (!audioCtx) { initAudio(); if (!audioCtx) return; }
            // 如果未激活，尝试激活 (但通常已在开始游戏时激活)

                return;

        }

        function playExplosionSoundNow() {
            if (!audioCtx || audioCtx.state !== 'running') return;
            const now = audioCtx.currentTime;
            // 三个短促方波
            for (let i=0; i<3; i++) {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(150 - i * 30, now + i * 0.06);
                osc.frequency.exponentialRampToValueAtTime(40, now + i * 0.06 + 0.1);
                gain.gain.setValueAtTime(0.25, now + i * 0.06);
                gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.15);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now + i * 0.06);
                osc.stop(now + i * 0.06 + 0.2);
            }
            // 白噪声尾音
            const bufferSize = audioCtx.sampleRate * 0.2;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.2));
            }
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            const noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(0.3, now);
            noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            noise.connect(noiseGain);
            noiseGain.connect(audioCtx.destination);
            noise.start(now);
        }

            }
        }

        function updateParticlesAndTexts() {
            particles.forEach((p, i) => { p.update(); p.draw(ctx); if (p.life <= 0) particles.splice(i, 1); });
            floatingTexts.forEach((ft, i) => { ft.update(); ft.draw(ctx); if (ft.life <= 0) floatingTexts.splice(i, 1); });
        }

        function updateCollisionMovement() {
            if (!isMovingForCollision || !targetItem || gamePaused) return;
            const idx = items.indexOf(targetItem);
            if (idx === -1) { isMovingForCollision = false; targetItem = null; carX = defaultCarX; return; }
            const distanceY = carY - targetItem.y - 10;
            if (distanceY <= 0) { isMovingForCollision = false; targetItem = null; carX = defaultCarX; return; }
            const frames = distanceY / targetItem.speed, dx = targetItem.x - carX;
            moveSpeedX = Math.abs(dx) > 1 ? dx / frames : 0;
            carX += moveSpeedX;
            if (Math.hypot(carX - targetItem.x, carY - targetItem.y) < 70 && !collisionHappened) {
                collisionHappened = true; crashAnim = 1.0; canvasWrapper.classList.add('shake');
                setTimeout(() => canvasWrapper.classList.remove('shake'), 400);
                createExplosion(targetItem.x, targetItem.y);
                combo++; if (combo > maxCombo) maxCombo = combo; correctCount++;
                if (combo % 5 === 0) { difficultyLevel = Math.min(5, 1 + Math.floor(combo / 5)); gameSpeed = 1 + (difficultyLevel - 1) * 0.2; difficultyIndicator.textContent = `速度: ${gameSpeed.toFixed(1)}x`; floatingTexts.push(new FloatingText(CW/2, CH/2, `速度提升!`, '#e74c3c', 36)); }
                const points = 10 + (combo > 1 ? combo * 2 : 0); score += points; updateScoreUI(); updateComboUI();
                playExplosionSound();
                if (combo > 1) playComboSound(combo);
                floatingTexts.push(new FloatingText(targetItem.x, targetItem.y - 50, combo > 1 ? `+${points} 连击x${combo}!` : `+${points}`, combo > 2 ? '#e74c3c' : '#2ecc71', 28));
                gameMessage.textContent = `✅ 正确！${targetItem.wordObj.word}`; gameMessage.className = 'message-area correct';
                speakChinesePraise();
                items.splice(idx, 1); isMovingForCollision = false; targetItem = null;
                const intv = setInterval(() => { if (!gameActive || isMovingForCollision || gamePaused) clearInterval(intv); else { const diff = defaultCarX - carX; if (Math.abs(diff) < 3) { carX = defaultCarX; clearInterval(intv); } else carX += diff * 0.08; } }, 20);
            }
        }

        function checkSpawn(now) { if (gameActive && !gamePaused && now - lastSpawnTime >= SPAWN_INTERVAL / gameSpeed) { spawnItems(); lastSpawnTime = now; } }
        function updateTimer(now) { if (gameActive && !gamePaused) { const rem = Math.max(0, 120000 - (now - gameStartTime)); timerBar.style.width = (rem / 120000) * 100 + '%'; if (rem <= 0) finishGame(); } }

        function gameLoop(now) {
            if (!gameActive) return;
            checkSpawn(now); updateItems(); updateCollisionMovement(); updateTimer(now);
            drawRoad(); drawTireMarks(); drawItems(); drawCar(); updateParticlesAndTexts();
            if (!gamePaused) animationFrame = requestAnimationFrame(gameLoop);
        }

        function startGame() {
            // 激活音频和语音
            activateAudio();
            enableSpeech();
            // 初始化音频上下文（如果尚未创建）
            initAudio();
            carSelectPanel.classList.add('hidden'); resultPanel.classList.add('hidden'); pauseBtn.classList.remove('hidden');
            resetGame();
            animationFrame = requestAnimationFrame(gameLoop);
        }

        function handleCanvasClick(e) {
            if (!gameActive || gamePaused || isMovingForCollision) return;
            const rect = canvas.getBoundingClientRect(), sx = canvas.width / rect.width, sy = canvas.height / rect.height;
            const cx = (e.clientX - rect.left) * sx, cy = (e.clientY - rect.top) * sy;
            for (let item of items) {
                if (Math.hypot(cx - item.x, cy - item.y) < 80) {
                    if (item.isTarget) { targetItem = item; isMovingForCollision = true; collisionHappened = false; gameMessage.textContent = `🚗 撞击准备！`; speakWord(item.wordObj.word); createExplosion(cx, cy, '#3498db'); }
                    else { wrongCount++; combo = 0; updateComboUI(); gameMessage.textContent = `❌ 错了！是 ${item.wordObj.word}`; gameMessage.className = 'message-area wrong'; playWrongSound(); speakWrong(); floatingTexts.push(new FloatingText(item.x, item.y - 30, '-5', '#e74c3c', 24)); score = Math.max(0, score - 5); updateScoreUI(); }
                    break;
                }
            }
        }

        function handleCanvasTouch(e) { e.preventDefault(); const t = e.touches[0]; if (t) handleCanvasClick({ clientX: t.clientX, clientY: t.clientY }); }

        carOptions.forEach(opt => opt.addEventListener('click', () => {
            carOptions.forEach(o => o.classList.remove('selected'));
            opt.classList.add('selected');
            selectedCar = opt.dataset.car;
        }));
        document.querySelector('[data-car="red"]').classList.add('selected');

        startBtn.addEventListener('click', startGame);
        finishBtn.addEventListener('click', () => { if (gameActive) finishGame(); });
        pauseBtn.addEventListener('click', togglePause);
        resumeBtn.addEventListener('click', togglePause);
        playAgainBtn.addEventListener('click', () => {
            resultPanel.classList.add('hidden'); carSelectPanel.classList.remove('hidden'); pauseBtn.classList.add('hidden');
            difficultyIndicator.classList.add('hidden'); gameMessage.textContent = '✨ 选一辆赛车，开始冒险吧！';
            score = 0; combo = 0; updateScoreUI(); updateComboUI(); carX = defaultCarX;
            if (praiseTimer) clearTimeout(praiseTimer);
        });
        canvas.addEventListener('click', handleCanvasClick);
        canvas.addEventListener('touchstart', handleCanvasTouch, { passive: false });
        canvas.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
        document.addEventListener('keydown', e => { if (e.code === 'Space' && gameActive) { e.preventDefault(); togglePause(); } });

        updateScoreUI(); updateComboUI();
        if (!window.speechSynthesis) gameMessage.textContent = '⚠️ 浏览器不支持朗读';
    })();
</script>
</body>
</html>
