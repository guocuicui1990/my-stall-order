<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>🔊 会说话的单词小怪兽 · 儿童英语启蒙</title>
    <!-- 可爱圆润的字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(145deg, #f9e7b2 0%, #f5d0b8 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Quicksand', sans-serif;
            padding: 16px;
            margin: 0;
            user-select: none;
        }

        .game-box {
            max-width: 700px;
            width: 100%;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 64px 64px 48px 48px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15), 0 8px 20px rgba(0, 0, 0, 0.1), inset 0 2px 4px rgba(255,255,255,0.8);
            border: 3px solid #fff9e6;
            padding: 28px 24px 36px;
            transition: all 0.2s ease;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #ffd89c;
            padding: 12px 24px;
            border-radius: 120px;
            margin-bottom: 24px;
            box-shadow: inset 0 2px 6px rgba(255,255,240,0.8), 0 6px 0 #b45f2b;
            border: 2px solid #febf5e;
        }

        .monster-icon {
            font-size: 42px;
            line-height: 1;
            filter: drop-shadow(2px 4px 4px rgba(0,0,0,0.15));
            background: #ffb882;
            padding: 8px 14px;
            border-radius: 60px;
            box-shadow: inset 0 -2px 0 #b45f2b, 0 4px 0 #9e5e2c;
            transform: rotate(-4deg);
        }

        .score-area {
            background: #fef9e3;
            border-radius: 50px;
            padding: 10px 22px;
            box-shadow: inset 0 1px 5px #ffe3a4, 0 5px 0 #b45f2b;
            border: 2px solid #ffbe5c;
            text-align: center;
        }

        .score-label {
            font-size: 16px;
            font-weight: 700;
            color: #7b3f00;
            letter-spacing: 1px;
        }

        .score-value {
            font-size: 34px;
            font-weight: 800;
            color: #4b2e1a;
            line-height: 1.2;
            text-shadow: 2px 2px 0 #ffd58c;
        }

        .best-score {
            font-size: 16px;
            font-weight: 600;
            color: #633d14;
        }

        .question-card {
            background: #fff2d7;
            border-radius: 80px 80px 50px 50px;
            padding: 30px 20px 20px;
            margin-bottom: 24px;
            box-shadow: inset 0 -6px 0 #d49b6a, 0 16px 0 #9f6e42, 0 8px 20px rgba(0,0,0,0.1);
            border: 3px solid #fdcb6e;
            text-align: center;
        }

        .big-emoji {
            font-size: 140px;
            line-height: 1.2;
            filter: drop-shadow(8px 12px 0 rgba(160, 100, 40, 0.2));
            margin: 5px 0 5px;
            transform: scale(1);
            transition: transform 0.2s ease;
        }

        .question-hint {
            font-size: 28px;
            font-weight: 700;
            color: #633d14;
            background: #ffefc0;
            display: inline-block;
            padding: 10px 28px;
            border-radius: 60px;
            box-shadow: inset 0 2px 6px #fff3cf, 0 4px 0 #bb7a3e;
            border: 2px solid #ffc576;
            margin-top: 6px;
            letter-spacing: 1px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin: 28px 0 18px;
        }

        .word-btn {
            background: #feeac2;
            border: 4px solid #ffbc6c;
            color: #412d1a;
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            font-size: 32px;
            padding: 24px 8px;
            border-radius: 48px;
            box-shadow: 0 8px 0 #b4723a, 0 6px 12px rgba(0,0,0,0.1);
            cursor: pointer;
            text-transform: capitalize;
            letter-spacing: 2px;
            transition: all 0.05s ease-in;
            text-shadow: 1px 1px 0 #ffe1a4;
            line-height: 1.2;
            touch-action: manipulation;
            word-break: break-word;
        }

        .word-btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #b4723a, 0 4px 8px rgba(0,0,0,0.1);
        }

        .word-btn:disabled {
            opacity: 0.7;
            filter: grayscale(0.3);
            transform: translateY(4px);
            box-shadow: 0 4px 0 #8b5a2e, 0 4px 8px rgba(0,0,0,0.1);
            cursor: not-allowed;
        }

        @keyframes shakeNope {
            0%,100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-5px); }
            80% { transform: translateX(4px); }
        }
        .word-btn-error {
            animation: shakeNope 0.3s ease-in-out;
            background: #ffc2b0 !important;
            border-color: #e07c5e !important;
        }

        .word-btn-correct-flash {
            background: #c7e9b0 !important;
            border-color: #6da546 !important;
            box-shadow: 0 8px 0 #5a8737, 0 6px 12px rgba(0,0,0,0.1) !important;
        }

        .feedback-area {
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 8px 0 18px;
        }

        .message-bubble {
            background: #fff6d5;
            padding: 14px 28px;
            border-radius: 60px;
            font-size: 26px;
            font-weight: 700;
            color: #52371c;
            box-shadow: inset 0 2px 8px #fff3cf, 0 5px 0 #be8b54;
            border: 2px solid #fec165;
            display: inline-block;
            text-align: center;
        }

        .action-bar {
            display: flex;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
        }

        .action-btn {
            background: #ffd89c;
            border: none;
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            font-size: 28px;
            padding: 16px 32px;
            border-radius: 60px;
            box-shadow: 0 8px 0 #a76f38, 0 4px 8px rgba(0,0,0,0.1);
            border: 3px solid #ffc576;
            color: #412d1a;
            cursor: pointer;
            text-shadow: 1px 1px 0 #ffebc0;
            transition: all 0.08s;
            flex: 0 1 auto;
            min-width: 160px;
            letter-spacing: 2px;
            touch-action: manipulation;
        }

        .action-btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #a76f38, 0 4px 8px rgba(0,0,0,0.1);
        }

        .action-btn:disabled {
            opacity: 0.5;
            transform: translateY(4px);
            box-shadow: 0 4px 0 #7a532b, 0 4px 8px rgba(0,0,0,0.1);
            pointer-events: none;
            cursor: default;
        }

        .confetti-emoji {
            position: fixed;
            font-size: 40px;
            pointer-events: none;
            z-index: 999;
            animation: floatUp 1.5s ease-out forwards;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) rotate(0deg); }
            100% { opacity: 0; transform: translateY(-120px) rotate(25deg); }
        }

        @media (max-width: 500px) {
            .game-box { padding: 20px 16px 28px; }
            .big-emoji { font-size: 110px; }
            .word-btn { font-size: 26px; padding: 18px 4px; }
            .action-btn { font-size: 22px; padding: 14px 18px; min-width: 130px; }
            .question-hint { font-size: 22px; }
        }

        .footer-note {
            margin-top: 16px;
            color: #a5581c;
            font-weight: 600;
            text-align: center;
            font-size: 18px;
        }
    </style>
</head>
<body>

<div class="game-box">
    <!-- 头部：小怪兽 + 分数 -->
    <div class="header">
        <div class="monster-icon">
            <span>🐣📚</span>
        </div>
        <div class="score-area">
            <div class="score-label">⭐ 得分</div>
            <div class="score-value" id="scoreDisplay">0</div>
            <div class="best-score" id="bestDisplay">🏆 最高 0</div>
        </div>
        <div class="monster-icon" style="transform: rotate(2deg);">
            <span>🦊✨</span>
        </div>
    </div>

    <!-- 问题卡片 -->
    <div class="question-card">
        <div class="big-emoji" id="emojiPicture">🐶</div>
        <div class="question-hint">🤔 这是什么？</div>
    </div>

    <!-- 三个单词选项 -->
    <div class="options-grid" id="optionsContainer">
        <button class="word-btn" data-option="0">Cat</button>
        <button class="word-btn" data-option="1">Dog</button>
        <button class="word-btn" data-option="2">Pig</button>
    </div>

    <!-- 反馈消息区域 -->
    <div class="feedback-area">
        <div class="message-bubble" id="messageBox">🐾 选一选！</div>
    </div>

    <!-- 操作按钮 -->
    <div class="action-bar">
        <button class="action-btn" id="nextBtn" disabled>➡️ 下一题</button>
        <button class="action-btn" id="newGameBtn">🔄 新游戏</button>
    </div>
    <div class="footer-note">
        🔊 答对就会读单词哟 ✨
    </div>
</div>

<script>
    (function(){
        "use strict";

        // ---------- 🌟 趣味单词库 (适合6-8岁) ----------
        const WORDS = [
            { word: 'cat', emoji: '🐱', display: 'Cat' },
            { word: 'dog', emoji: '🐶', display: 'Dog' },
            { word: 'pig', emoji: '🐷', display: 'Pig' },
            { word: 'cow', emoji: '🐮', display: 'Cow' },
            { word: 'bee', emoji: '🐝', display: 'Bee' },
            { word: 'fish', emoji: '🐟', display: 'Fish' },
            { word: 'bird', emoji: '🐦', display: 'Bird' },
            { word: 'apple', emoji: '🍎', display: 'Apple' },
            { word: 'banana', emoji: '🍌', display: 'Banana' },
            { word: 'car', emoji: '🚗', display: 'Car' },
            { word: 'sun', emoji: '☀️', display: 'Sun' },
            { word: 'hat', emoji: '🧢', display: 'Hat' }
        ];

        // ---------- DOM 元素 ----------
        const emojiPicture = document.getElementById('emojiPicture');
        const optionsBtns = document.querySelectorAll('.word-btn');
        const messageBox = document.getElementById('messageBox');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const bestDisplay = document.getElementById('bestDisplay');
        const nextBtn = document.getElementById('nextBtn');
        const newGameBtn = document.getElementById('newGameBtn');

        // ---------- 游戏状态 ----------
        let currentWord = null;             
        let options = [];                   
        let correctAnswerWord = '';         
        let answered = false;              
        let score = 0;
        let bestScore = 0;

        // ---------- 🔊 语音朗读功能 (Web Speech API) ----------
        function speakWord(wordToSay) {
            // 如果浏览器不支持语音合成，静默失败
            if (!window.speechSynthesis) {
                console.log("当前浏览器不支持语音朗读");
                return;
            }
            
            // 取消任何正在播放的语音，避免重叠
            try {
                window.speechSynthesis.cancel();
            } catch(e) {}
            
            const utterance = new SpeechSynthesisUtterance(wordToSay);
            utterance.lang = 'en-US';            // 美式英语，清晰易懂
            utterance.rate = 0.9;                // 稍慢语速，适合儿童
            utterance.pitch = 1.2;               // 音调略高，更亲切
            utterance.volume = 1;
            
            // 可选：选择更偏儿童友好的语音（如果可用）
            // 但默认语音通常也足够清晰
            
            window.speechSynthesis.speak(utterance);
        }

        // 尝试预加载语音权限 (某些浏览器需要用户手势触发，但点击选项已经是手势)
        // 我们可以在游戏初始化时悄悄预热一下，但不需要

        // ---------- 本地存储读取最高分 ----------
        try {
            const saved = localStorage.getItem('kidEnglishBest_v2');
            if (saved) bestScore = parseInt(saved, 10) || 0;
        } catch(e) { /* 忽略 */ }
        updateScoreUI();

        // ---------- 打乱数组 ----------
        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // ---------- 生成随机选项 ----------
        function generateOptions(correctWordObj) {
            const correctDisplay = correctWordObj.display;
            const correctRaw = correctWordObj.word;
            
            const otherWords = WORDS.filter(item => item.word !== correctRaw);
            const shuffledOthers = shuffleArray([...otherWords]);
            const distractor1 = shuffledOthers[0].display;
            let distractor2 = shuffledOthers[1].display;
            if (distractor1 === distractor2 && shuffledOthers.length > 2) {
                distractor2 = shuffledOthers[2].display;
            }
            
            let optArray = [correctDisplay, distractor1, distractor2];
            return shuffleArray(optArray);
        }

        // ---------- 加载新题目 ----------
        function loadNewQuestion() {
            let newIndex = Math.floor(Math.random() * WORDS.length);
            if (WORDS.length > 1 && currentWord) {
                while (WORDS[newIndex].word === currentWord.word) {
                    newIndex = Math.floor(Math.random() * WORDS.length);
                }
            }
            currentWord = WORDS[newIndex];
            correctAnswerWord = currentWord.word;
            
            emojiPicture.textContent = currentWord.emoji;
            
            options = generateOptions(currentWord);
            for (let i = 0; i < optionsBtns.length; i++) {
                optionsBtns[i].textContent = options[i];
                optionsBtns[i].disabled = false;
                optionsBtns[i].classList.remove('word-btn-correct-flash', 'word-btn-error');
            }
            
            answered = false;
            nextBtn.disabled = true;
            messageBox.textContent = '🐣 选一个单词吧！';
        }

        // ---------- 刷新得分显示 ----------
        function updateScoreUI() {
            scoreDisplay.textContent = score;
            bestDisplay.textContent = `🏆 最高 ${bestScore}`;
        }

        function updateBestScore() {
            if (score > bestScore) {
                bestScore = score;
                try {
                    localStorage.setItem('kidEnglishBest_v2', bestScore);
                } catch(e) {}
                bestDisplay.textContent = `🏆 最高 ${bestScore}`;
                messageBox.textContent = '🎉 新纪录! 好棒! 🎉';
            }
        }

        // ---------- 简单撒花效果 ----------
        function popConfetti() {
            for (let i = 0; i < 12; i++) {
                const confetti = document.createElement('div');
                confetti.textContent = ['🎈','✨','⭐','🌟','🍭','🧸','🎉','🎊','🪅','🌸','🐾','🦄'][Math.floor(Math.random()*12)];
                confetti.className = 'confetti-emoji';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.top = (70 + Math.random() * 20) + '%';
                confetti.style.fontSize = (24 + Math.floor(Math.random() * 36)) + 'px';
                confetti.style.position = 'fixed';
                confetti.style.pointerEvents = 'none';
                confetti.style.zIndex = '999';
                document.body.appendChild(confetti);
                setTimeout(() => { confetti.remove(); }, 1400);
            }
        }

        function shakeButton(btn) {
            btn.classList.add('word-btn-error');
            setTimeout(() => {
                btn.classList.remove('word-btn-error');
            }, 350);
        }

        // ---------- 处理选项点击 ----------
        function handleOptionClick(e) {
            const btn = e.currentTarget;
            if (answered || btn.disabled) return;
            
            const selectedWordDisplay = btn.textContent;
            const isCorrect = (selectedWordDisplay === currentWord.display);
            
            if (isCorrect) {
                // ---------- 回答正确！----------
                answered = true;
                
                // 得分
                score += 10;
                updateScoreUI();
                updateBestScore();
                
                // 视觉反馈
                btn.classList.add('word-btn-correct-flash');
                optionsBtns.forEach(btn => { btn.disabled = true; });
                
                // 🎤 朗读单词！ (这里朗读原始单词，如 'cat')
                speakWord(currentWord.word);
                
                // 显示成功消息（包含单词）
                messageBox.textContent = `✅ 太棒啦！ +10  (${currentWord.word}) 🎈`;
                
                popConfetti();
                
                nextBtn.disabled = false;
                
                emojiPicture.style.transform = 'scale(1.08)';
                setTimeout(() => emojiPicture.style.transform = 'scale(1)', 120);
            } else {
                // 回答错误
                shakeButton(btn);
                
                const wrongMessages = ['😕 再试试看!', '🤔 差一点点', '🐢 加油～', '💪 你可以的', '🌟 再选一次'];
                messageBox.textContent = wrongMessages[Math.floor(Math.random() * wrongMessages.length)];
            }
        }

        // ---------- 下一题 ----------
        function goToNextQuestion() {
            if (!answered) return;
            
            // 加载新题目前，可以取消任何正在播放的语音（避免上一题朗读延续）
            if (window.speechSynthesis) {
                window.speechSynthesis.cancel();
            }
            
            loadNewQuestion();
            emojiPicture.style.transform = 'scale(1)';
            messageBox.textContent = '✨ 新单词来咯 ✨';
        }

        // ---------- 新游戏 ----------
        function resetNewGame() {
            // 取消语音
            if (window.speechSynthesis) {
                window.speechSynthesis.cancel();
            }
            
            score = 0;
            updateScoreUI();
            
            const randomIndex = Math.floor(Math.random() * WORDS.length);
            currentWord = WORDS[randomIndex];
            correctAnswerWord = currentWord.word;
            
            emojiPicture.textContent = currentWord.emoji;
            options = generateOptions(currentWord);
            for (let i = 0; i < optionsBtns.length; i++) {
                optionsBtns[i].textContent = options[i];
                optionsBtns[i].disabled = false;
                optionsBtns[i].classList.remove('word-btn-correct-flash', 'word-btn-error');
            }
            
            answered = false;
            nextBtn.disabled = true;
            messageBox.textContent = '🐣 新游戏！加油～';
            emojiPicture.style.transform = 'scale(1)';
        }

        // ---------- 绑定事件 ----------
        optionsBtns.forEach(btn => {
            btn.addEventListener('click', handleOptionClick);
        });

        nextBtn.addEventListener('click', goToNextQuestion);

        newGameBtn.addEventListener('click', () => {
            resetNewGame();
            // 小庆祝效果
            for (let i=0;i<5;i++) {
                setTimeout(() => {
                    const mini = document.createElement('div');
                    mini.textContent = '✨';
                    mini.style.position = 'fixed';
                    mini.style.left = Math.random()*100+'%';
                    mini.style.top = '50%';
                    mini.style.fontSize = '30px';
                    mini.style.pointerEvents = 'none';
                    mini.style.zIndex = '99';
                    document.body.appendChild(mini);
                    setTimeout(()=> mini.remove(), 600);
                }, i*50);
            }
        });

        // ---------- 初始化游戏 ----------
        function initGame() {
            const firstIndex = Math.floor(Math.random() * WORDS.length);
            currentWord = WORDS[firstIndex];
            correctAnswerWord = currentWord.word;
            emojiPicture.textContent = currentWord.emoji;
            
            options = generateOptions(currentWord);
            for (let i = 0; i < optionsBtns.length; i++) {
                optionsBtns[i].textContent = options[i];
                optionsBtns[i].disabled = false;
                optionsBtns[i].classList.remove('word-btn-correct-flash', 'word-btn-error');
            }
            
            answered = false;
            nextBtn.disabled = true;
            messageBox.textContent = '🐾 选对单词，我会读出来哟！';
            score = 0;
            updateScoreUI();
            bestDisplay.textContent = `🏆 最高 ${bestScore}`;
        }

        initGame();

        // 防止按钮触摸时灰色背景
        optionsBtns.forEach(b => {
            b.addEventListener('touchstart', ()=>{}, {passive: true});
        });

        // 额外小优化：如果浏览器不支持语音，在底部提示（不打断游戏）
        if (!window.speechSynthesis) {
            const footer = document.querySelector('.footer-note');
            if (footer) footer.innerHTML = '✨ 点一点，学单词 ✨ (你的浏览器暂不支持朗读)';
        }

    })();
</script>
</body>
</html>
