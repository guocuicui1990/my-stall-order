name: Update Config from Issue

on:
  issues:
    types: [opened, labeled]

jobs:
  update-config:
    # 只有当Issue包含config-update标签时才运行
    if: contains(github.event.issue.labels.*.name, 'config-update')
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GH_TOKEN }}
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Debug - Show event info
      run: |
        echo "🎯 工作流被触发"
        echo "事件名称: ${{ github.event_name }}"
        echo "仓库: ${{ github.repository }}"
        echo "Issue编号: ${{ github.event.issue.number }}"
        echo "Issue标题: ${{ github.event.issue.title }}"
        echo "Issue标签: ${{ toJson(github.event.issue.labels) }}"
        echo "Issue内容预览:"
        echo "${{ github.event.issue.body }}" | head -20

    - name: Extract config from issue
      id: extract-config
      run: |
        echo "🔍 开始从Issue中提取JSON配置..."
        
        # 获取Issue内容
        ISSUE_BODY='${{ github.event.issue.body }}'
        echo "Issue内容长度: ${#ISSUE_BODY} 字符"
        
        # 保存Issue内容到文件，便于调试
        echo "$ISSUE_BODY" > issue_content.txt
        echo "📄 Issue内容已保存到 issue_content.txt"
        
        # 显示Issue内容前300字符用于调试
        echo "=== Issue内容前300字符 ==="
        echo "$ISSUE_BODY" | head -c 300
        echo -e "\n=== 结束 ==="
        
        # 方法1: 提取 ```json 和 ``` 之间的内容
        echo "尝试方法1: 提取代码块中的JSON..."
        CONFIG_CONTENT=$(echo "$ISSUE_BODY" | sed -n '/```json/,/```/p' | sed '/```/d')
        
        if [ -n "$CONFIG_CONTENT" ]; then
          echo "✅ 使用方法1提取到JSON配置"
          echo "提取的内容长度: ${#CONFIG_CONTENT}"
          echo "提取的内容前200字符:"
          echo "$CONFIG_CONTENT" | head -c 200
        else
          # 方法2: 提取第一个完整的JSON对象
          echo "尝试方法2: 提取第一个JSON对象..."
          
          # 安装Python3（如果还没有）
          python3 -c "
import sys, json, re

content = '''$ISSUE_BODY'''

# 首先尝试提取json代码块
import re
json_match = re.search(r'```json\\s*(.*?)\\s*```', content, re.DOTALL)
if json_match:
    json_str = json_match.group(1).strip()
    print(json_str)
else:
    # 尝试提取第一个{...}结构（可能是多行）
    pattern = r'\\{(?:[^{}]|\\{(?:[^{}]|\\{[^{}]*\\})*\\})*\\}'
    matches = re.findall(pattern, content, re.DOTALL)
    
    if matches:
        for match in matches:
            # 清理可能的Markdown格式
            clean_match = match.replace('```', '').replace('json', '').strip()
            if clean_match.startswith('{') and clean_match.endswith('}'):
                # 验证是否为有效JSON
                try:
                    json.loads(clean_match)
                    print(clean_match)
                    break
                except:
                    continue
    else:
        print('')
" > extracted_json.txt
          
          CONFIG_CONTENT=$(cat extracted_json.txt)
        fi
        
        if [ -z "$CONFIG_CONTENT" ]; then
          echo "❌ 错误: 未找到JSON配置"
          echo "Issue内容预览:"
          cat issue_content.txt | head -50
          exit 1
        fi
        
        echo "✅ 提取到的JSON配置:"
        echo "$CONFIG_CONTENT"
        
        # 保存配置到文件
        echo "$CONFIG_CONTENT" > new_config.json
        echo "配置已保存到 new_config.json"
        
        # 验证JSON格式
        if ! python3 -c "import json; json.load(open('new_config.json'))" 2>/dev/null; then
          echo "⚠️ JSON格式验证失败，尝试修复..."
          
          # 尝试修复单引号问题
          sed -i "s/'/\"/g" new_config.json
          
          # 尝试修复未加引号的属性名
          python3 -c "
import re
with open('new_config.json', 'r') as f:
    content = f.read()
# 匹配属性名: 值 的模式，给属性名加双引号
pattern = r'([a-zA-Z_][a-zA-Z0-9_]*)\\s*:'
def replace(match):
    return '\"' + match.group(1) + '\":'
content = re.sub(pattern, replace, content)
with open('new_config.json', 'w') as f:
    f.write(content)
"
          
          # 再次验证
          if ! python3 -c "import json; json.load(open('new_config.json'))" 2>/dev/null; then
            echo "❌ 无法修复JSON格式"
            exit 1
          fi
        fi
        
        echo "✅ JSON格式验证通过"
        
        # 使用Python提取商家ID
        SHOP_ID=$(python3 << EOF
import json, sys
try:
    with open('new_config.json', 'r') as f:
        data = json.load(f)
    # 获取第一个键
    shop_id = list(data.keys())[0]
    print(shop_id)
except Exception as e:
    print(f"Error: {e}")
    sys.exit(1)
EOF
        )
        
        if [ -z "$SHOP_ID" ] || [ "$SHOP_ID" = "Error:"* ]; then
          # 从Issue标题中提取商家ID
          ISSUE_TITLE='${{ github.event.issue.title }}'
          SHOP_ID=$(echo "$ISSUE_TITLE" | grep -o 'l_ml[a-z0-9_]*' | head -1)
          
          if [ -z "$SHOP_ID" ]; then
            echo "⚠️ 警告: 无法提取商家ID，使用默认格式"
            SHOP_ID="shop_${{ github.event.issue.number }}_$(date +%s)"
          fi
        fi
        
        echo "✅ 商家ID: $SHOP_ID"
        echo "shop_id=$SHOP_ID" >> $GITHUB_OUTPUT

    - name: Check config.js file
      run: |
        echo "📄 检查config.js文件..."
        
        if [ -f "config.js" ]; then
          echo "✅ config.js文件存在"
          echo "文件大小: $(wc -l < config.js) 行"
          echo "文件前5行:"
          head -5 config.js
        else
          echo "❌ 错误: config.js文件不存在"
          exit 1
        fi

    - name: Update config.js with extracted config
      run: |
        CONFIG_FILE="config.js"
        NEW_CONFIG_FILE="new_config.json"
        SHOP_ID="${{ steps.extract-config.outputs.shop_id }}"
        
        echo "🔄 开始更新config.js，商家ID: $SHOP_ID"
        echo "新配置文件: $NEW_CONFIG_FILE"
        
        # 创建更新脚本
        cat > update_script.js << 'JAVASCRIPT'
const fs = require('fs');
const path = require('path');

console.log('开始更新config.js...');

try {
  // 读取新配置
  const newConfigPath = path.join(__dirname, 'new_config.json');
  let newConfigData = fs.readFileSync(newConfigPath, 'utf8');
  
  console.log('新配置数据长度:', newConfigData.length);
  console.log('新配置数据前200字符:', newConfigData.substring(0, 200));
  
  // 尝试解析JSON
  let newConfig;
  try {
    newConfig = JSON.parse(newConfigData);
  } catch (parseError) {
    console.log('JSON解析失败，尝试清理格式...');
    
    // 清理可能的Markdown格式
    let cleanedData = newConfigData
      .replace(/```json/gi, '')
      .replace(/```/g, '')
      .trim();
    
    // 尝试修复常见的JSON问题
    // 1. 单引号转双引号
    cleanedData = cleanedData.replace(/'/g, '"');
    
    // 2. 修复未加引号的属性名
    cleanedData = cleanedData.replace(/([{,]\s*)([a-zA-Z_][a-zA-Z0-9_]*)(\s*:)/g, '$1"$2"$3');
    
    console.log('清理后数据前200字符:', cleanedData.substring(0, 200));
    
    try {
      newConfig = JSON.parse(cleanedData);
      console.log('✅ 清理后解析成功');
    } catch (secondError) {
      console.error('❌ 二次解析失败:', secondError.message);
      
      // 尝试提取有效的JSON对象
      const startIndex = cleanedData.indexOf('{');
      const endIndex = cleanedData.lastIndexOf('}');
      
      if (startIndex !== -1 && endIndex !== -1 && endIndex > startIndex) {
        const jsonStr = cleanedData.substring(startIndex, endIndex + 1);
        try {
          newConfig = JSON.parse(jsonStr);
          console.log('✅ 提取部分JSON成功');
        } catch (error) {
          throw new Error('无法从数据中提取有效的JSON');
        }
      } else {
        throw new Error('无法从数据中提取有效的JSON');
      }
    }
  }
  
  // 获取商家ID和配置
  const shopIds = Object.keys(newConfig);
  const shopId = shopIds[0];
  const shopConfig = newConfig[shopId];
  
  console.log('商家ID:', shopId);
  console.log('商家名称:', shopConfig.name);
  console.log('主题颜色:', shopConfig.themeColor);
  console.log('菜品数量:', shopConfig.dishes ? shopConfig.dishes.length : 0);
  
  // 读取现有的config.js
  const configFile = path.join(__dirname, 'config.js');
  let content = fs.readFileSync(configFile, 'utf8');
  
  console.log('config.js文件大小:', content.length, '字符');
  console.log('config.js前100字符:', content.substring(0, 100));
  
  // 检查是否为有效的JavaScript文件
  if (!content.includes('window.shopConfigs')) {
    throw new Error('config.js文件格式不正确：找不到window.shopConfigs');
  }
  
  // 准备新的商家配置字符串 - 使用与现有配置相同的格式
  const dishesStr = JSON.stringify(shopConfig.dishes || [], null, 4)
    .replace(/\n/g, '\n        ');
  
  // 构建新的商家配置，注意使用双引号（与现有格式一致）
  const newShopConfigStr = `'${shopId}': {
    "name": "${shopConfig.name.replace(/"/g, '\\"')}",
    "themeColor": "${shopConfig.themeColor || '#E63946'}",
    "logo": "${shopConfig.logo || 'images/logo.png'}",
    "qrcode": "${shopConfig.qrcode || 'images/qrcode.jpg'}",
    "dishes": ${dishesStr}
}`;
  
  console.log('新商家配置字符串预览:');
  console.log(newShopConfigStr.substring(0, 200) + '...');
  
  // 查找 window.shopConfigs 对象的位置
  const configStart = content.indexOf('window.shopConfigs = {');
  if (configStart === -1) {
    throw new Error('找不到 window.shopConfigs 对象');
  }
  
  // 找到配置对象的结束位置
  let braceCount = 0;
  let inString = false;
  let stringChar = '';
  let escapeNext = false;
  let configEnd = -1;
  
  for (let i = configStart; i < content.length; i++) {
    const char = content[i];
    
    // 处理转义字符
    if (escapeNext) {
      escapeNext = false;
      continue;
    }
    
    if (char === '\\') {
      escapeNext = true;
      continue;
    }
    
    // 处理字符串
    if (!inString && (char === '"' || char === "'" || char === '`')) {
      inString = true;
      stringChar = char;
    } else if (inString && char === stringChar) {
      inString = false;
      stringChar = '';
    }
    
    // 统计大括号（不在字符串中时）
    if (!inString) {
      if (char === '{') {
        braceCount++;
      } else if (char === '}') {
        braceCount--;
        if (braceCount === 0) {
          configEnd = i;
          break;
        }
      }
    }
  }
  
  if (configEnd === -1) {
    throw new Error('无法确定 window.shopConfigs 对象的结束位置');
  }
  
  // 提取配置对象内容
  const beforeConfig = content.substring(0, configStart);
  const configContent = content.substring(configStart, configEnd + 1);
  const afterConfig = content.substring(configEnd + 1);
  
  console.log('配置对象长度:', configContent.length);
  
  // 检查是否已存在该商家
  if (configContent.includes(`'${shopId}':`)) {
    console.log(`🔄 更新现有商家: ${shopId}`);
    
    // 查找现有商家的配置
    const shopKey = `'${shopId}':`;
    const shopKeyIndex = configContent.indexOf(shopKey);
    
    if (shopKeyIndex !== -1) {
      // 找到商家配置的开始
      let shopConfigStart = shopKeyIndex;
      let shopConfigEnd = -1;
      let shopBraceCount = 0;
      let inShopString = false;
      let shopStringChar = '';
      let shopEscapeNext = false;
      
      // 找到这个商家配置的结束
      for (let i = shopKeyIndex; i < configContent.length; i++) {
        const char = configContent[i];
        
        // 处理转义字符
        if (shopEscapeNext) {
          shopEscapeNext = false;
          continue;
        }
        
        if (char === '\\') {
          shopEscapeNext = true;
          continue;
        }
        
        // 处理字符串
        if (!inShopString && (char === '"' || char === "'" || char === '`')) {
          inShopString = true;
          shopStringChar = char;
        } else if (inShopString && char === shopStringChar) {
          inShopString = false;
          shopStringChar = '';
        }
        
        // 统计大括号（不在字符串中时）
        if (!inShopString) {
          if (char === '{') {
            shopBraceCount++;
          } else if (char === '}') {
            shopBraceCount--;
            if (shopBraceCount === 0) {
              shopConfigEnd = i;
              break;
            }
          }
        }
      }
      
      if (shopConfigEnd !== -1) {
        const beforeShop = configContent.substring(0, shopConfigStart);
        const afterShop = configContent.substring(shopConfigEnd + 1);
        const newConfigContent = beforeShop + newShopConfigStr + afterShop;
        content = beforeConfig + newConfigContent + afterConfig;
        console.log(`✅ 已更新商家 ${shopId} 的配置`);
      } else {
        throw new Error(`无法找到商家 ${shopId} 配置的结束位置`);
      }
    } else {
      throw new Error(`找不到商家 ${shopId} 的配置`);
    }
  } else {
    console.log(`➕ 添加新商家: ${shopId}`);
    
    // 在最后一个商家后添加新配置
    // 查找最后一个配置项的结束位置
    const lastEntryPattern = /,?\s*'([^']+)':\s*\{[^}]+\}\s*(?=,?\s*\})/gs;
    const matches = [...configContent.matchAll(lastEntryPattern)];
    
    if (matches.length > 0) {
      // 获取最后一个匹配
      const lastMatch = matches[matches.length - 1];
      const matchEnd = lastMatch.index + lastMatch[0].length;
      
      // 在最后一个配置后添加新配置
      const beforeInsert = configContent.substring(0, matchEnd);
      const afterInsert = configContent.substring(matchEnd);
      
      // 确保有逗号分隔
      let separator = ',';
      if (beforeInsert.trim().endsWith('{')) {
        separator = '';
      }
      
      const newConfigContent = beforeInsert + 
        (separator ? separator + '\n    ' : '') +
        newShopConfigStr + 
        afterInsert;
      
      content = beforeConfig + newConfigContent + afterConfig;
      console.log(`✅ 已添加新商家 ${shopId} 到 config.js`);
    } else {
      // 如果没有找到现有配置，直接在对象中添加
      const insertPosition = configContent.lastIndexOf('}');
      const beforeInsert = configContent.substring(0, insertPosition);
      const afterInsert = configContent.substring(insertPosition);
      
      // 确定是否需要添加逗号
      let separator = '';
      const trimmedBefore = beforeInsert.trim();
      if (trimmedBefore.length > 0 && !trimmedBefore.endsWith('{') && !trimmedBefore.endsWith(',')) {
        separator = ',';
      }
      
      const newConfigContent = beforeInsert + 
        (separator ? separator + '\n    ' : '\n    ') +
        newShopConfigStr + 
        afterInsert;
      
      content = beforeConfig + newConfigContent + afterConfig;
      console.log(`✅ 已添加新商家 ${shopId} 到 config.js`);
    }
  }
  
  // 保存更新
  fs.writeFileSync(configFile, content);
  console.log('✅ config.js 已成功更新！');
  
  // 验证更新
  const updatedContent = fs.readFileSync(configFile, 'utf8');
  if (updatedContent.includes(`'${shopId}':`)) {
    console.log(`✅ 验证通过: 商家 ${shopId} 已添加到 config.js`);
  } else {
    console.log(`⚠️ 警告: 商家 ${shopId} 可能未正确添加`);
  }
  
} catch (error) {
  console.error('❌ 更新config.js失败:', error.message);
  console.error('错误堆栈:', error.stack);
  process.exit(1);
}
JAVASCRIPT
        
        # 运行更新脚本
        node update_script.js
        echo "✅ config.js更新完成"

    - name: Commit and push changes
      run: |
        echo "📝 提交更改..."
        
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        
        # 检查是否有更改
        if git diff --quiet config.js; then
          echo "⚠️ 没有检测到config.js的更改"
          echo "可能的原因:"
          echo "1. 商家配置已存在且内容相同"
          echo "2. 更新过程中出现错误"
          echo "3. config.js文件格式不匹配"
          
          # 显示diff以帮助调试
          echo "显示差异:"
          git diff config.js || true
        else
          echo "✅ 检测到config.js的更改"
          git add config.js
          git commit -m "更新商家配置: ${{ steps.extract-config.outputs.shop_id }} [自动更新]"
          git push
          echo "✅ 更改已提交并推送"
        fi

    - name: Comment on issue
      if: success()
      uses: actions/github-script@v6
      with:
        script: |
          const issueNumber = context.issue.number;
          const shopId = '${{ steps.extract-config.outputs.shop_id }}';
          
          console.log(`在Issue #${issueNumber}上添加评论，商家ID: ${shopId}`);
          
          try {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `✅ 配置已自动更新！\n\n商家 **${shopId}** 的配置已成功添加到config.js文件中。\n\n您可以立即访问：\n- 顾客端: index.html?shop=${shopId}\n- 管理端: admin.html?shop=${shopId}\n\n此Issue将在10秒后自动关闭。`
            });
            
            console.log('评论已添加');
            
            // 关闭Issue
            setTimeout(async () => {
              try {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  state: 'closed'
                });
                console.log(`Issue #${issueNumber} 已关闭`);
              } catch (closeError) {
                console.error(`关闭Issue失败: ${closeError.message}`);
              }
            }, 10000);
            
          } catch (error) {
            console.error(`添加评论失败: ${error.message}`);
          }

    - name: Update issue labels
      if: success()
      uses: actions/github-script@v6
      with:
        script: |
          const issueNumber = context.issue.number;
          
          console.log(`更新Issue #${issueNumber}的标签`);
          
          try {
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['auto-updated', 'config-complete']
            });
            console.log('标签已更新');
          } catch (error) {
            console.error(`更新标签失败: ${error.message}`);
          }

    - name: Success message
      if: success()
      run: |
        echo "🎉 工作流执行成功！"
        echo "商家ID: ${{ steps.extract-config.outputs.shop_id }}"
        echo "配置已成功更新到config.js文件"
        echo "您可以在仓库中查看更新后的config.js文件"

    - name: Failure message
      if: failure()
      run: |
        echo "❌ 工作流执行失败"
        echo "请检查以下可能的问题:"
        echo "1. Issue中是否包含有效的JSON配置"
        echo "2. config.js文件是否存在"
        echo "3. JSON格式是否正确"
        echo "4. Git推送权限是否足够"
        echo ""
        echo "详细错误信息请查看上面的步骤日志"
