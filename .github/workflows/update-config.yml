name: Update Config from Issue

on:
  issues:
    types: [opened, labeled]

jobs:
  update-config:
    # 只有当Issue包含config-update标签时才运行
    if: contains(github.event.issue.labels.*.name, 'config-update')
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GH_TOKEN }}
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Debug - Show event info
      run: |
        echo "🎯 工作流被触发"
        echo "事件名称: ${{ github.event_name }}"
        echo "仓库: ${{ github.repository }}"
        echo "Issue编号: ${{ github.event.issue.number }}"
        echo "Issue标题: ${{ github.event.issue.title }}"
        echo "Issue标签: ${{ toJson(github.event.issue.labels) }}"
        echo "Issue内容预览:"
        echo "${{ github.event.issue.body }}" | head -20

    - name: Extract config from issue
      id: extract-config
      run: |
        echo "🔍 开始从Issue中提取JSON配置..."
        
        # 获取Issue内容
        ISSUE_BODY='${{ github.event.issue.body }}'
        echo "Issue内容长度: ${#ISSUE_BODY} 字符"
        
        # 保存Issue内容到文件，便于调试
        echo "$ISSUE_BODY" > issue_content.txt
        echo "📄 Issue内容已保存到 issue_content.txt"
        
        # 显示Issue内容前200字符用于调试
        echo "Issue内容前200字符:"
        echo "$ISSUE_BODY" | head -c 200
        echo ""
        
        # 方法1: 提取 ```json 代码块
        echo "尝试方法1: 提取代码块中的JSON..."
        CONFIG_CONTENT=$(echo "$ISSUE_BODY" | sed -n '/```json/,/```/p' | sed '/```/d')
        
        if [ -n "$CONFIG_CONTENT" ]; then
          echo "✅ 使用方法1提取到JSON配置"
        else
          # 方法2: 使用sed提取{和}之间的内容
          echo "尝试方法2: 使用sed提取..."
          CONFIG_CONTENT=$(echo "$ISSUE_BODY" | sed -n '/{/,/}/p' | sed ':a;N;$!ba;s/\n/ /g')
        fi
        
        if [ -z "$CONFIG_CONTENT" ]; then
          echo "❌ 错误: 未找到JSON配置"
          echo "Issue内容预览:"
          cat issue_content.txt | head -50
          exit 1
        fi
        
        echo "✅ 提取到的JSON配置:"
        echo "$CONFIG_CONTENT"
        
        # 保存配置到文件
        echo "$CONFIG_CONTENT" > new_config.json
        echo "配置已保存到 new_config.json"
        
        # 验证JSON格式
        if ! python3 -c "import json; json.load(open('new_config.json'))" 2>/dev/null; then
          echo "⚠️ JSON格式需要修复..."
          
          # 尝试修复常见的JSON问题
          # 1. 替换单引号为双引号
          sed -i "s/'/\"/g" new_config.json
          
          # 2. 修复未加引号的属性名
          python3 -c "
import re
with open('new_config.json', 'r') as f:
    content = f.read()
# 匹配属性名: 值 的模式，给属性名加双引号
pattern = r'([a-zA-Z_][a-zA-Z0-9_]*)\s*:'
def replace(match):
    return '\"' + match.group(1) + '\":'
content = re.sub(pattern, replace, content)
with open('new_config.json', 'w') as f:
    f.write(content)
"
          
          # 再次验证
          if ! python3 -c "import json; json.load(open('new_config.json'))" 2>/dev/null; then
            echo "❌ 无法修复JSON格式"
            exit 1
          fi
        fi
        
        echo "✅ JSON格式验证通过"
        
        # 使用Python提取商家ID
        SHOP_ID=$(python3 << EOF
import json, sys
try:
    with open('new_config.json', 'r') as f:
        data = json.load(f)
    # 获取第一个键
    shop_id = list(data.keys())[0]
    print(shop_id)
except Exception as e:
    print(f"Error: {e}")
    sys.exit(1)
EOF
        )
        
        if [ -z "$SHOP_ID" ] || [ "$SHOP_ID" = "Error:"* ]; then
          # 从Issue标题中提取商家ID
          ISSUE_TITLE='${{ github.event.issue.title }}'
          SHOP_ID=$(echo "$ISSUE_TITLE" | grep -o 'l_ml[a-z0-9_]*' | head -1)
        fi
        
        if [ -z "$SHOP_ID" ]; then
          SHOP_ID="shop_${{ github.event.issue.number }}"
        fi
        
        echo "✅ 商家ID: $SHOP_ID"
        echo "shop_id=$SHOP_ID" >> $GITHUB_OUTPUT

    - name: Check config.js file
      run: |
        echo "📄 检查config.js文件..."
        
        if [ -f "config.js" ]; then
          echo "✅ config.js文件存在"
          echo "文件大小: $(wc -l < config.js) 行"
          echo "文件前5行:"
          head -5 config.js
        else
          echo "❌ 错误: config.js文件不存在"
          exit 1
        fi

    - name: Update config.js with extracted config
      run: |
        CONFIG_FILE="config.js"
        NEW_CONFIG_FILE="new_config.json"
        SHOP_ID="${{ steps.extract-config.outputs.shop_id }}"
        
        echo "🔄 开始更新config.js，商家ID: $SHOP_ID"
        
        # 创建更新脚本 - 修复JSON解析问题
        cat > update_script.js << "JAVASCRIPT"
const fs = require('fs');
const path = require('path');

console.log('开始更新config.js...');

try {
  // 读取新配置
  const newConfigPath = path.join(__dirname, 'new_config.json');
  let newConfigData = fs.readFileSync(newConfigPath, 'utf8');
  
  console.log('新配置数据长度:', newConfigData.length);
  
  // 尝试解析JSON
  let newConfig;
  try {
    // 首先尝试直接解析
    newConfig = JSON.parse(newConfigData);
    console.log('✅ JSON解析成功');
  } catch (error) {
    console.log('JSON解析失败，尝试修复格式...');
    
    // 尝试修复常见的JSON格式问题
    // 1. 清理可能的Markdown格式
    let cleanedData = newConfigData
      .replace(/```json/gi, '')
      .replace(/```/g, '')
      .trim();
    
    // 2. 单引号转双引号
    cleanedData = cleanedData.replace(/'/g, '"');
    
    // 3. 修复未加引号的属性名
    cleanedData = cleanedData.replace(/([{,]\s*)([a-zA-Z_][a-zA-Z0-9_]*)(\s*:)/g, '$1"$2"$3');
    
    console.log('清理后数据前200字符:', cleanedData.substring(0, 200));
    
    try {
      newConfig = JSON.parse(cleanedData);
      console.log('✅ 清理后解析成功');
    } catch (secondError) {
      console.error('❌ 二次解析失败:', secondError.message);
      
      // 尝试提取第一个完整的JSON对象
      const startIdx = cleanedData.indexOf('{');
      const endIdx = cleanedData.lastIndexOf('}');
      
      if (startIdx !== -1 && endIdx !== -1 && endIdx > startIdx) {
        const jsonStr = cleanedData.substring(startIdx, endIdx + 1);
        try {
          newConfig = JSON.parse(jsonStr);
          console.log('✅ 提取部分JSON成功');
        } catch (e) {
          throw new Error('无法从数据中提取有效的JSON: ' + e.message);
        }
      } else {
        throw new Error('无法从数据中提取有效的JSON');
      }
    }
  }
  
  // 获取商家ID和配置
  const shopIds = Object.keys(newConfig);
  const shopId = shopIds[0];
  const shopConfig = newConfig[shopId];
  
  console.log('商家ID:', shopId);
  console.log('商家名称:', shopConfig.name);
  console.log('菜品数量:', shopConfig.dishes ? shopConfig.dishes.length : 0);
  
  // 读取现有的config.js
  const configFile = path.join(__dirname, 'config.js');
  let content = fs.readFileSync(configFile, 'utf8');
  
  // 检查是否为有效的JavaScript文件
  if (!content.includes('window.shopConfigs')) {
    throw new Error('config.js文件格式不正确：找不到window.shopConfigs');
  }
  
  // 准备新的商家配置字符串 - 使用与现有配置相同的格式
  const dishesStr = JSON.stringify(shopConfig.dishes || [], null, 4)
    .replace(/\n/g, '\n        ');
  
  // 注意：我们使用双引号格式，与现有config.js保持一致
  const newShopConfigStr = "'" + shopId + "': " + JSON.stringify({
    name: shopConfig.name,
    themeColor: shopConfig.themeColor || '#E63946',
    logo: shopConfig.logo || 'images/logo.png',
    qrcode: shopConfig.qrcode || 'images/qrcode.jpg',
    dishes: shopConfig.dishes || []
  }, null, 4);
  
  console.log('新商家配置预览:', newShopConfigStr.substring(0, 200));
  
  // 查找window.shopConfigs对象
  const configMatch = content.match(/window\.shopConfigs\s*=\s*(\{[\s\S]*?\};)/);
  
  if (!configMatch) {
    throw new Error('在config.js中找不到window.shopConfigs对象');
  }
  
  console.log('找到shopConfigs对象');
  
  // 检查是否已存在该商家
  if (content.includes("'" + shopId + "':")) {
    console.log('更新现有商家配置:', shopId);
    
    // 查找并替换现有配置
    // 创建匹配模式：'商家ID': { ... } (跨多行)
    const existingPattern = new RegExp("'" + shopId + "'\\s*:\\s*\\{[^}]+\\}", 's');
    
    if (content.match(existingPattern)) {
      content = content.replace(existingPattern, newShopConfigStr);
      console.log('已更新商家:', shopId);
    } else {
      // 如果模式不匹配，尝试更宽松的匹配
      const loosePattern = new RegExp("'" + shopId + "'[\\s\\S]*?\\n\\s*\\}", 'm');
      content = content.replace(loosePattern, newShopConfigStr);
      console.log('使用宽松模式更新商家:', shopId);
    }
  } else {
    console.log('添加新商家配置:', shopId);
    
    // 找到最后一个商家配置后添加
    // 查找模式：'商家ID': { ... },\n    };\n
    const lastEntryPattern = /('([^']+)':\s*\{[^}]+\},?\s*)(\n\s*)(\};)/s;
    
    if (content.match(lastEntryPattern)) {
      console.log('在最后一个商家后添加新配置');
      content = content.replace(lastEntryPattern, '$1,\n    ' + newShopConfigStr + '$3$4');
    } else {
      // 如果上面的模式不匹配，尝试在window.shopConfigs = {后添加
      console.log('在shopConfigs对象开头添加新配置');
      content = content.replace(
        /(window\.shopConfigs\s*=\s*\{)/,
        '$1\n    ' + newShopConfigStr + ','
      );
    }
  }
  
  // 保存更新
  fs.writeFileSync(configFile, content);
  console.log('✅ config.js已成功更新！');
  
  // 验证更新
  console.log('\n验证更新:');
  const updatedContent = fs.readFileSync(configFile, 'utf8');
  if (updatedContent.includes("'" + shopId + "':")) {
    console.log('✅ 商家', shopId, '已成功添加到config.js');
  } else {
    console.log('⚠️ 警告: 商家', shopId, '可能未正确添加');
  }
  
} catch (error) {
  console.error('❌ 更新config.js失败:', error.message);
  console.error(error.stack);
  process.exit(1);
}
JAVASCRIPT
        
        # 运行更新脚本
        node update_script.js
        echo "✅ config.js更新完成"

    - name: Commit and push changes
      run: |
        echo "📝 提交更改..."
        
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        
        # 检查是否有更改
        if git diff --quiet config.js; then
          echo "⚠️ 没有检测到config.js的更改"
          echo "可能的原因:"
          echo "1. 商家配置已存在且内容相同"
          echo "2. 更新过程中出现错误"
          echo "3. config.js文件格式不匹配"
          
          # 显示diff以帮助调试
          echo "显示差异:"
          git diff config.js || true
        else
          echo "✅ 检测到config.js的更改"
          git add config.js
          git commit -m "更新商家配置: ${{ steps.extract-config.outputs.shop_id }} [自动更新]"
          git push
          echo "✅ 更改已提交并推送"
        fi

    - name: Comment on issue
      if: success()
      uses: actions/github-script@v6
      with:
        script: |
          const issueNumber = context.issue.number;
          const shopId = '${{ steps.extract-config.outputs.shop_id }}';
          
          console.log(`在Issue #${issueNumber}上添加评论，商家ID: ${shopId}`);
          
          try {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `✅ 配置已自动更新！\n\n商家 **${shopId}** 的配置已成功添加到config.js文件中。\n\n您可以立即访问：\n- 顾客端: index.html?shop=${shopId}\n- 管理端: admin.html?shop=${shopId}\n\n此Issue将在10秒后自动关闭。`
            });
            
            console.log('评论已添加');
            
            // 关闭Issue
            setTimeout(async () => {
              try {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  state: 'closed'
                });
                console.log(`Issue #${issueNumber} 已关闭`);
              } catch (closeError) {
                console.error(`关闭Issue失败: ${closeError.message}`);
              }
            }, 10000);
            
          } catch (error) {
            console.error(`添加评论失败: ${error.message}`);
          }

    - name: Update issue labels
      if: success()
      uses: actions/github-script@v6
      with:
        script: |
          const issueNumber = context.issue.number;
          
          console.log(`更新Issue #${issueNumber}的标签`);
          
          try {
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['auto-updated', 'config-complete']
            });
            console.log('标签已更新');
          } catch (error) {
            console.error(`更新标签失败: ${error.message}`);
          }

    - name: Success message
      if: success()
      run: |
        echo "🎉 工作流执行成功！"
        echo "商家ID: ${{ steps.extract-config.outputs.shop_id }}"
        echo "配置已成功更新到config.js文件"
        echo "您可以在仓库中查看更新后的config.js文件"

    - name: Failure message
      if: failure()
      run: |
        echo "❌ 工作流执行失败"
        echo "请检查以下可能的问题:"
        echo "1. Issue中是否包含有效的JSON配置"
        echo "2. config.js文件是否存在"
        echo "3. JSON格式是否正确"
        echo "4. Git推送权限是否足够"
        echo ""
        echo "详细错误信息请查看上面的步骤日志"
