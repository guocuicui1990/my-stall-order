name: Update Config from Issue

on:
  issues:
    types: [opened, edited, labeled]

jobs:
  update-config:
    if: contains(github.event.issue.labels.*.name, 'config-update')
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      issues: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Debug - Show event info
      run: |
        echo "🎯 工作流被触发"
        echo "事件名称: ${{ github.event_name }}"
        echo "事件类型: ${{ github.event.action }}"
        echo "仓库: ${{ github.repository }}"
        echo "Issue编号: ${{ github.event.issue.number }}"
        echo "Issue标题: ${{ github.event.issue.title }}"
        echo "Issue标签: ${{ toJson(github.event.issue.labels) }}"
        echo ""
        echo "=== Issue完整内容 ==="
        cat << 'EOF'
        ${{ github.event.issue.body }}
        EOF
        echo "===================="

    - name: Extract config from issue
      id: extract-config
      run: |
        echo "🔍 开始从Issue中提取JSON配置..."
        
        # 保存Issue内容到文件
        cat > issue_content.txt << 'EOF'
        ${{ github.event.issue.body }}
        EOF
        
        echo "📄 Issue内容已保存，大小: $(wc -c < issue_content.txt) 字节"
        
        # 使用Python提取JSON
        cat > extract_json.py << 'PYTHON'
import re
import json
import sys

try:
    with open('issue_content.txt', 'r', encoding='utf-8') as f:
        content = f.read()
    
    print(f"📊 原始内容长度: {len(content)} 字符")
    
    json_str = None
    
    # 方法1: 提取```json代码块
    match = re.search(r'```json\s*([\s\S]*?)\s*```', content, re.MULTILINE)
    if match:
        json_str = match.group(1).strip()
        print("✅ 从```json代码块提取成功")
    
    # 方法2: 提取普通```代码块
    if not json_str:
        match = re.search(r'```\s*([\s\S]*?)\s*```', content, re.MULTILINE)
        if match:
            json_str = match.group(1).strip()
            print("✅ 从普通代码块提取成功")
    
    # 方法3: 直接查找JSON对象
    if not json_str:
        start = content.find('{')
        if start != -1:
            depth = 0
            for i in range(start, len(content)):
                if content[i] == '{':
                    depth += 1
                elif content[i] == '}':
                    depth -= 1
                    if depth == 0:
                        json_str = content[start:i+1]
                        print(f"✅ 直接提取JSON对象成功 (位置 {start}:{i+1})")
                        break
    
    if not json_str:
        raise ValueError("❌ 未找到JSON配置")
    
    print(f"📏 提取的JSON长度: {len(json_str)} 字符")
    print(f"🔤 前100字符: {json_str[:100]}")
    
    # 尝试解析JSON
    try:
        config = json.loads(json_str)
        print("✅ JSON解析成功")
    except json.JSONDecodeError as e:
        print(f"⚠️ 初次解析失败: {e}")
        print("🔧 尝试修复JSON格式...")
        
        # 修复常见问题
        json_str = json_str.replace('\ufeff', '')  # 移除BOM
        json_str = re.sub(r"'([^']*?)'(\s*):", r'"\1"\2:', json_str)  # 替换属性名的单引号
        
        config = json.loads(json_str)
        print("✅ 修复后解析成功")
    
    # 提取商家ID
    shop_id = list(config.keys())[0]
    print(f"✅ 商家ID: {shop_id}")
    print(f"✅ 商家名称: {config[shop_id].get('name', 'N/A')}")
    
    # 保存结果
    with open('new_config.json', 'w', encoding='utf-8') as f:
        json.dump(config, f, ensure_ascii=False, indent=2)
    
    with open('shop_id.txt', 'w') as f:
        f.write(shop_id)
    
    print("✅ 配置提取完成")
    
except Exception as e:
    print(f"❌ 错误: {e}")
    import traceback
    traceback.print_exc()
    sys.exit(1)
PYTHON
        
        # 执行Python脚本
        python3 extract_json.py
        
        # 读取结果
        if [ ! -f "shop_id.txt" ]; then
          echo "❌ 提取失败：未生成shop_id.txt"
          exit 1
        fi
        
        SHOP_ID=$(cat shop_id.txt)
        echo "shop_id=$SHOP_ID" >> $GITHUB_OUTPUT
        echo "✅ 最终商家ID: $SHOP_ID"

    - name: Verify extracted config
      run: |
        echo "🔍 验证提取的配置..."
        if [ -f "new_config.json" ]; then
          echo "✅ new_config.json 存在"
          echo "内容预览:"
          cat new_config.json | head -20
        else
          echo "❌ new_config.json 不存在"
          exit 1
        fi

    - name: Check update_config.js exists
      run: |
        if [ -f "update_config.js" ]; then
          echo "✅ update_config.js 存在"
          chmod +x update_config.js
        else
          echo "⚠️ update_config.js 不存在，将使用内联脚本"
        fi

    - name: Update config.js
      run: |
        SHOP_ID="${{ steps.extract-config.outputs.shop_id }}"
        echo "🔄 更新config.js，商家ID: $SHOP_ID"
        
        # 检查是否有update_config.js
        if [ -f "update_config.js" ]; then
          echo "使用 update_config.js 脚本"
          node update_config.js new_config.json
        else
          echo "使用内联更新脚本"
          
          # 创建临时更新脚本
          cat > temp_update.js << 'JAVASCRIPT'
const fs = require('fs');

try {
  const newConfig = JSON.parse(fs.readFileSync('new_config.json', 'utf8'));
  const shopId = Object.keys(newConfig)[0];
  const shopConfig = newConfig[shopId];
  
  console.log('商家ID:', shopId);
  console.log('商家名称:', shopConfig.name);
  
  let content = fs.readFileSync('config.js', 'utf8');
  
  const newShopConfigStr = `'${shopId}': ${JSON.stringify(shopConfig, null, 4)}`;
  
  // 检查商家是否已存在
  if (content.includes(`'${shopId}':`)) {
    console.log('更新现有商家');
    const pattern = new RegExp(`'${shopId.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}'\\s*:\\s*\\{[\\s\\S]*?\\n\\s*\\}`, 'm');
    content = content.replace(pattern, newShopConfigStr);
  } else {
    console.log('添加新商家');
    const match = content.match(/(\};)$/m);
    if (match) {
      const pos = content.lastIndexOf('};');
      content = content.substring(0, pos) + ',\n    ' + newShopConfigStr + '\n' + content.substring(pos);
    }
  }
  
  fs.writeFileSync('config.js', content);
  console.log('✅ 更新成功');
} catch (error) {
  console.error('❌ 错误:', error.message);
  process.exit(1);
}
JAVASCRIPT
          
          node temp_update.js
        fi

    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        git add config.js
        
        if git diff --staged --quiet; then
          echo "⚠️ 没有变更"
        else
          git commit -m "🔧 更新商家配置: ${{ steps.extract-config.outputs.shop_id }}"
          git push
          echo "✅ 已推送"
        fi

    - name: Comment on issue
      if: success()
      uses: actions/github-script@v7
      with:
        script: |
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: `✅ **配置已自动更新！**\n\n商家ID: \`${{ steps.extract-config.outputs.shop_id }}\`\n\n访问链接：\n- 顾客端: index.html?shop=${{ steps.extract-config.outputs.shop_id }}\n- 管理端: admin.html?shop=${{ steps.extract-config.outputs.shop_id }}`
          });
          
          await github.rest.issues.update({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            state: 'closed'
          });

    - name: Failure notification
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: `❌ 配置更新失败\n\n请查看 [Actions日志](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`
          });
