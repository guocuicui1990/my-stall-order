name: Update Config
on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue编号'
        required: true
jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'config-update')
    runs-on: ubuntu-latest
    
    steps:
    - name: 触发确认
      run: |
        echo "工作流触发成功"
        echo "触发方式: ${{ github.event_name }}"
    
    - name: Checkout
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    - name: Setup Node
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    - name: 获取Issue内容
      id: issue
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          NUM="${{ github.event.inputs.issue_number }}"
          BODY=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/issues/$NUM | jq -r '.body')
        else
          NUM="${{ github.event.issue.number }}"
          BODY='${{ github.event.issue.body }}'
        fi
        
        echo "issue_number=$NUM" >> $GITHUB_OUTPUT
        echo "issue_body<<EOF" >> $GITHUB_OUTPUT
        echo "$BODY" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
    - name: 提取配置
      id: config
      run: |
        cat > issue.txt << 'EOF'
        ${{ steps.issue.outputs.issue_body }}
        EOF
        
        python3 << 'PY'
import re, json, sys
content = open('issue.txt').read()
m = re.search(r'```json\s*([\s\S]*?)\s*```', content) or re.search(r'```\s*([\s\S]*?)\s*```', content)
if m:
    js = m.group(1)
else:
    s = content.find('{')
    d = 0
    for i in range(s, len(content)):
        if content[i] == '{': d += 1
        elif content[i] == '}':
            d -= 1
            if d == 0:
                js = content[s:i+1]
                break
cfg = json.loads(js)
sid = list(cfg.keys())[0]
print(f"商家ID: {sid}")
with open('new.json', 'w') as f:
    json.dump(cfg, f, ensure_ascii=False, indent=2)
with open('sid.txt', 'w') as f:
    f.write(sid)
        PY
        
        SID=$(cat sid.txt)
        echo "shop_id=$SID" >> $GITHUB_OUTPUT
    - name: 更新config.js
      run: |
        node << 'JS'
const fs = require('fs');
const cfg = JSON.parse(fs.readFileSync('new.json', 'utf8'));
const sid = Object.keys(cfg)[0];
const sc = cfg[sid];
let txt = fs.readFileSync('config.js', 'utf8');
const ns = `'${sid}': ${JSON.stringify(sc, null, 4)}`;
if (txt.includes(`'${sid}':`)) {
  txt = txt.replace(new RegExp(`'${sid.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}'\\s*:\\s*\\{[\\s\\S]*?\\n\\s*\\}`, 'm'), ns);
} else {
  const p = txt.lastIndexOf('};');
  txt = txt.substring(0, p) + ',\n    ' + ns + '\n' + txt.substring(p);
}
fs.writeFileSync('config.js', txt);
console.log('更新成功');
        JS
    - name: 提交
      run: |
        git config user.name "Actions"
        git config user.email "actions@github.com"
        git add config.js
        git diff --staged --quiet || (git commit -m "更新配置: ${{ steps.config.outputs.shop_id }}" && git push)
    - name: 评论
      if: success()
      uses: actions/github-script@v7
      with:
        script: |
          const n = ${{ steps.issue.outputs.issue_number }};
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: n,
            body: '✅ 配置已更新！商家ID: `${{ steps.config.outputs.shop_id }}`'
          });
          await github.rest.issues.update({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: n,
            state: 'closed'
          });
