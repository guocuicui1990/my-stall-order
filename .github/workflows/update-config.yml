name: Update Config from Issue
on:
  issues:
    types: [opened, labeled]
jobs:
  update-config:
    if: contains(github.event.issue.labels.*.name, 'config-update')
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GH_TOKEN }}
        fetch-depth: 0
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    - name: Debug - Show event info
      run: |
        echo "🎯 工作流被触发"
        echo "事件名称: ${{ github.event_name }}"
        echo "仓库: ${{ github.repository }}"
        echo "Issue编号: ${{ github.event.issue.number }}"
        echo "Issue标题: ${{ github.event.issue.title }}"
        echo "Issue标签: ${{ toJson(github.event.issue.labels) }}"
    - name: Extract config from issue
      id: extract-config
      run: |
        echo "🔍 开始从Issue中提取JSON配置..."
        
        # 保存Issue内容
        cat > issue_body.txt << 'ISSUE_EOF'
        ${{ github.event.issue.body }}
        ISSUE_EOF
        
        echo "📄 Issue内容已保存"
        
        # 使用Python提取JSON
        python3 << 'PYTHON_EOF'
import re
import json
import sys
try:
    with open('issue_body.txt', 'r', encoding='utf-8') as f:
        content = f.read()
    
    print(f"原始内容长度: {len(content)} 字符")
    
    # 方法1: 提取```json代码块
    match = re.search(r'```json\s*([\s\S]*?)\s*```', content)
    if match:
        json_str = match.group(1).strip()
        print("✅ 从```json代码块提取")
    else:
        # 方法2: 提取普通代码块
        match = re.search(r'```\s*([\s\S]*?)\s*```', content)
        if match:
            json_str = match.group(1).strip()
            print("✅ 从普通代码块提取")
        else:
            # 方法3: 智能提取JSON对象
            start = content.find('{')
            if start != -1:
                depth = 0
                for i in range(start, len(content)):
                    if content[i] == '{':
                        depth += 1
                    elif content[i] == '}':
                        depth -= 1
                        if depth == 0:
                            json_str = content[start:i+1]
                            print(f"✅ 提取JSON对象 [{start}:{i+1}]")
                            break
                else:
                    raise ValueError("未找到完整的JSON对象")
            else:
                raise ValueError("未找到JSON内容")
    
    # 解析JSON
    config = json.loads(json_str)
    shop_id = list(config.keys())[0]
    
    print(f"✅ 商家ID: {shop_id}")
    
    # 保存结果
    with open('new_config.json', 'w', encoding='utf-8') as f:
        json.dump(config, f, ensure_ascii=False, indent=2)
    
    with open('shop_id.txt', 'w') as f:
        f.write(shop_id)
    
    print("✅ 提取完成")
except Exception as e:
    print(f"❌ 错误: {e}")
    import traceback
    traceback.print_exc()
    sys.exit(1)
        PYTHON_EOF
        
        # 读取商家ID
        SHOP_ID=$(cat shop_id.txt)
        echo "shop_id=$SHOP_ID" >> $GITHUB_OUTPUT
        echo "✅ 商家ID: $SHOP_ID"
    - name: Update config.js
      run: |
        echo "🔄 更新config.js..."
        
        # 检查update_config.js是否存在
        if [ -f "update_config.js" ]; then
          echo "使用项目的update_config.js"
          node update_config.js new_config.json
        else
          echo "使用内联更新脚本"
          node << 'NODE_EOF'
const fs = require('fs');
try {
  const newConfig = JSON.parse(fs.readFileSync('new_config.json', 'utf8'));
  const shopId = Object.keys(newConfig)[0];
  const shopConfig = newConfig[shopId];
  
  console.log('商家ID:', shopId);
  console.log('商家名称:', shopConfig.name);
  
  let content = fs.readFileSync('config.js', 'utf8');
  
  const newShopConfigStr = `'${shopId}': ${JSON.stringify(shopConfig, null, 4)}`;
  
  // 检查商家是否已存在
  if (content.includes(`'${shopId}':`)) {
    console.log('更新现有商家');
    const pattern = new RegExp(`'${shopId.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}'\\s*:\\s*\\{[\\s\\S]*?\\n\\s*\\}`, 'm');
    content = content.replace(pattern, newShopConfigStr);
  } else {
    console.log('添加新商家');
    const pos = content.lastIndexOf('};');
    if (pos !== -1) {
      content = content.substring(0, pos) + ',\n    ' + newShopConfigStr + '\n' + content.substring(pos);
    }
  }
  
  fs.writeFileSync('config.js', content);
  console.log('✅ 更新成功');
} catch (error) {
  console.error('❌ 错误:', error.message);
  process.exit(1);
}
NODE_EOF
        fi
    - name: Commit and push changes
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        
        git add config.js
        
        if git diff --staged --quiet; then
          echo "⚠️ 没有变更"
        else
          git commit -m "更新商家配置: ${{ steps.extract-config.outputs.shop_id }}"
          git push
          echo "✅ 已推送"
        fi
    - name: Comment on issue
      if: success()
      uses: actions/github-script@v6
      with:
        script: |
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: `✅ 配置已自动更新！\n\n商家ID: \`${{ steps.extract-config.outputs.shop_id }}\``
          });
          
          await github.rest.issues.update({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            state: 'closed'
          });
