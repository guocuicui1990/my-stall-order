name: Update Config
on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue编号'
        required: true
jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'config-update'))
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    - uses: actions/setup-node@v3
      with:
        node-version: '18'
    - name: 获取Issue
      id: get-issue
      uses: actions/github-script@v7
      with:
        script: |
          let issue;
          if (context.eventName === 'workflow_dispatch') {
            const num = ${{ github.event.inputs.issue_number }};
            const res = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: num
            });
            issue = res.data;
          } else {
            issue = context.payload.issue;
          }
          
          core.setOutput('number', issue.number);
          core.setOutput('body', issue.body);
          
          return issue.number;
    - name: 保存Issue内容
      run: |
        cat > issue.txt << 'EOF'
        ${{ steps.get-issue.outputs.body }}
        EOF
    - name: 提取配置
      id: extract
      run: |
        python3 -c '
import re, json, sys
content = open("issue.txt").read()
print(f"内容长度: {len(content)}")
m = re.search(r"```json\s*([\s\S]*?)\s*```", content) or re.search(r"```\s*([\s\S]*?)\s*```", content)
if m:
    js = m.group(1)
else:
    s = content.find("{")
    d = 0
    for i in range(s, len(content)):
        if content[i] == "{": d += 1
        elif content[i] == "}":
            d -= 1
            if d == 0:
                js = content[s:i+1]
                break
cfg = json.loads(js)
sid = list(cfg.keys())[0]
print(f"商家ID: {sid}")
with open("new.json", "w") as f:
    json.dump(cfg, f, ensure_ascii=False, indent=2)
with open("sid.txt", "w") as f:
    f.write(sid)
        '
        
        SID=$(cat sid.txt)
        echo "shop_id=$SID" >> $GITHUB_OUTPUT
    - name: 更新config.js
      run: |
        node -e '
const fs = require("fs");
const cfg = JSON.parse(fs.readFileSync("new.json", "utf8"));
const sid = Object.keys(cfg)[0];
const sc = cfg[sid];
let txt = fs.readFileSync("config.js", "utf8");
const ns = `'"'"'${sid}'"'"': ${JSON.stringify(sc, null, 4)}`;
if (txt.includes(`'"'"'${sid}'"'"':`)) {
  const re = new RegExp(`'"'"'${sid.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}'"'"'\\s*:\\s*\\{[\\s\\S]*?\\n\\s*\\}`, "m");
  txt = txt.replace(re, ns);
  console.log("更新现有");
} else {
  const p = txt.lastIndexOf("};");
  txt = txt.substring(0, p) + `,\n    ${ns}\n` + txt.substring(p);
  console.log("添加新");
}
fs.writeFileSync("config.js", txt);
console.log("成功");
        '
    - name: 提交
      run: |
        git config user.name "Actions"
        git config user.email "actions@github.com"
        git add config.js
        git diff --staged --quiet || (git commit -m "更新: ${{ steps.extract.outputs.shop_id }}" && git push)
    - name: 完成
      if: success()
      uses: actions/github-script@v7
      with:
        script: |
          const n = ${{ steps.get-issue.outputs.number }};
          const s = '${{ steps.extract.outputs.shop_id }}';
          
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: n,
            body: `✅ 已更新！商家ID: \`${s}\``
          });
          
          await github.rest.issues.update({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: n,
            state: 'closed'
          });
