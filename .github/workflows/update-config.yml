name: Update Config from Issue
on:
  issues:
    types: [opened, labeled]
jobs:
  update-config:
    # 只有当Issue包含config-update标签时才运行
    if: contains(github.event.issue.labels.*.name, 'config-update')
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GH_TOKEN }}
        fetch-depth: 0
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    - name: Debug - Show event info
      run: |
        echo "🎯 工作流被触发"
        echo "事件名称: ${{ github.event_name }}"
        echo "仓库: ${{ github.repository }}"
        echo "Issue编号: ${{ github.event.issue.number }}"
        echo "Issue标题: ${{ github.event.issue.title }}"
    - name: Extract config from issue
      id: extract-config
      run: |
        echo "🔍 开始从Issue中提取JSON配置..."
        
        # 使用heredoc安全地保存Issue内容（避免shell解析问题）
        cat > issue_content.txt << 'ISSUE_BODY_EOF'
        ${{ github.event.issue.body }}
        ISSUE_BODY_EOF
        
        echo "📄 Issue内容已保存到 issue_content.txt"
        echo "内容长度: $(wc -c < issue_content.txt) 字节"
        
        # 使用Python提取JSON（更安全可靠）
        python3 << 'PYTHON_SCRIPT_EOF'
import re
import json
import sys
try:
    with open('issue_content.txt', 'r', encoding='utf-8') as f:
        content = f.read()
    
    print(f"📊 原始内容: {len(content)} 字符")
    
    # 方法1: 提取```json代码块
    match = re.search(r'```json\s*([\s\S]*?)\s*```', content)
    if match:
        json_str = match.group(1).strip()
        print("✅ 从```json代码块提取")
    else:
        # 方法2: 提取普通```代码块
        match = re.search(r'```\s*([\s\S]*?)\s*```', content)
        if match:
            json_str = match.group(1).strip()
            print("✅ 从普通代码块提取")
        else:
            # 方法3: 智能提取JSON对象（匹配括号）
            start = content.find('{')
            if start != -1:
                depth = 0
                for i in range(start, len(content)):
                    if content[i] == '{':
                        depth += 1
                    elif content[i] == '}':
                        depth -= 1
                        if depth == 0:
                            json_str = content[start:i+1]
                            print(f"✅ 提取JSON对象 [{start}:{i+1}]")
                            break
                else:
                    raise ValueError("未找到完整的JSON对象")
            else:
                raise ValueError("未找到JSON内容")
    
    print(f"JSON长度: {len(json_str)} 字符")
    print(f"JSON前100字符: {json_str[:100]}")
    
    # 解析JSON
    try:
        config = json.loads(json_str)
        print("✅ JSON解析成功")
    except json.JSONDecodeError as e:
        print(f"⚠️ JSON解析失败: {e}")
        print("尝试修复格式...")
        json_str = json_str.replace('\ufeff', '')  # 移除BOM
        config = json.loads(json_str)
        print("✅ 修复后解析成功")
    
    # 提取商家ID
    shop_id = list(config.keys())[0]
    shop_config = config[shop_id]
    
    print(f"✅ 商家ID: {shop_id}")
    print(f"✅ 商家名称: {shop_config.get('name', 'N/A')}")
    print(f"✅ 菜品数量: {len(shop_config.get('dishes', []))}")
    
    # 保存结果
    with open('new_config.json', 'w', encoding='utf-8') as f:
        json.dump(config, f, ensure_ascii=False, indent=2)
    
    with open('shop_id.txt', 'w') as f:
        f.write(shop_id)
    
    print("✅ 配置提取完成")
except Exception as e:
    print(f"❌ 错误: {e}")
    import traceback
    traceback.print_exc()
    sys.exit(1)
        PYTHON_SCRIPT_EOF
        
        # 读取商家ID
        if [ ! -f "shop_id.txt" ]; then
          echo "❌ 提取失败：未生成shop_id.txt"
          exit 1
        fi
        
        SHOP_ID=$(cat shop_id.txt)
        echo "shop_id=$SHOP_ID" >> $GITHUB_OUTPUT
        echo "✅ 最终商家ID: $SHOP_ID"
    - name: Check config.js file
      run: |
        echo "📄 检查config.js文件..."
        
        if [ -f "config.js" ]; then
          echo "✅ config.js文件存在"
          echo "文件大小: $(wc -l < config.js) 行"
        else
          echo "❌ 错误: config.js文件不存在"
          exit 1
        fi
    - name: Update config.js with extracted config
      run: |
        SHOP_ID="${{ steps.extract-config.outputs.shop_id }}"
        
        echo "🔄 开始更新config.js，商家ID: $SHOP_ID"
        
        # 检查是否有update_config.js
        if [ -f "update_config.js" ]; then
          echo "使用 update_config.js 脚本"
          node update_config.js new_config.json
        else
          echo "使用内联更新脚本"
          
          # 创建临时更新脚本
          cat > temp_update.js << 'JAVASCRIPT_EOF'
const fs = require('fs');
try {
  const newConfig = JSON.parse(fs.readFileSync('new_config.json', 'utf8'));
  const shopId = Object.keys(newConfig)[0];
  const shopConfig = newConfig[shopId];
  
  console.log('商家ID:', shopId);
  console.log('商家名称:', shopConfig.name);
  console.log('菜品数量:', shopConfig.dishes ? shopConfig.dishes.length : 0);
  
  let content = fs.readFileSync('config.js', 'utf8');
  
  const newShopConfigStr = `'${shopId}': ${JSON.stringify(shopConfig, null, 4)}`;
  
  // 检查商家是否已存在
  if (content.includes(`'${shopId}':`)) {
    console.log('更新现有商家配置:', shopId);
    const pattern = new RegExp(`'${shopId.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}'\\s*:\\s*\\{[\\s\\S]*?\\n\\s*\\}`, 'm');
    content = content.replace(pattern, newShopConfigStr);
  } else {
    console.log('添加新商家配置:', shopId);
    const pos = content.lastIndexOf('};');
    if (pos !== -1) {
      content = content.substring(0, pos) + ',\n    ' + newShopConfigStr + '\n' + content.substring(pos);
    } else {
      throw new Error('未找到config.js结束位置');
    }
  }
  
  fs.writeFileSync('config.js', content);
  console.log('✅ config.js更新成功');
} catch (error) {
  console.error('❌ 错误:', error.message);
  process.exit(1);
}
JAVASCRIPT_EOF
          
          node temp_update.js
        fi
    - name: Commit and push changes
      run: |
        echo "📝 提交更改..."
        
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        
        git add config.js
        
        if git diff --staged --quiet; then
          echo "⚠️ 没有检测到config.js的更改"
        else
          git commit -m "更新商家配置: ${{ steps.extract-config.outputs.shop_id }} [自动更新]"
          git push
          echo "✅ 更改已提交并推送"
        fi
    - name: Comment on issue
      if: success()
      uses: actions/github-script@v6
      with:
        script: |
          const shopId = '${{ steps.extract-config.outputs.shop_id }}';
          
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: `✅ 配置已自动更新！\n\n商家 **${shopId}** 的配置已成功添加到config.js文件中。\n\n您可以立即访问：\n- 顾客端: index.html?shop=${shopId}\n- 管理端: admin.html?shop=${shopId}`
          });
          
          await github.rest.issues.addLabels({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            labels: ['auto-updated', 'config-complete']
          });
          
          await github.rest.issues.update({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            state: 'closed'
          });
    - name: Success message
      if: success()
      run: |
        echo "🎉 工作流执行成功！"
        echo "商家ID: ${{ steps.extract-config.outputs.shop_id }}"
        echo "配置已成功更新到config.js文件"
    - name: Failure message
      if: failure()
      run: |
        echo "❌ 工作流执行失败"
        echo "请检查以下可能的问题:"
        echo "1. Issue中是否包含有效的JSON配置"
        echo "2. config.js文件是否存在"
        echo "3. JSON格式是否正确"
