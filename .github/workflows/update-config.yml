name: Update Config from Issue

on:
  issues:
    types: [opened, edited, labeled]

jobs:
  update-config:
    # 只有当Issue包含config-update标签时才运行
    if: |
      contains(github.event.issue.labels.*.name, 'config-update') &&
      github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Show event info
      run: |
        echo "🎯 工作流触发信息"
        echo "事件类型: ${{ github.event_name }}"
        echo "Issue编号: ${{ github.event.issue.number }}"
        echo "Issue标题: ${{ github.event.issue.title }}"
        echo "Issue状态: ${{ github.event.issue.state }}"
        echo "Issue标签: ${{ join(github.event.issue.labels.*.name) }}"
        echo "触发者: ${{ github.event.issue.user.login }}"

    - name: Extract JSON from Issue
      id: extract-json
      run: |
        echo "🔍 从Issue中提取JSON配置..."
        
        # 保存Issue内容到文件
        echo "${{ github.event.issue.body }}" > issue_body.txt
        
        echo "Issue内容预览:"
        head -10 issue_body.txt
        
        # 简单方法：提取第一个JSON对象
        # 使用jq工具来提取和验证JSON
        if ! command -v jq &> /dev/null; then
          sudo apt-get install -y jq
        fi
        
        # 提取JSON内容（处理```json代码块）
        JSON_CONTENT=$(grep -A 100 '```json' issue_body.txt | grep -v '```json' | grep -B 100 '```' | grep -v '```' || true)
        
        if [ -z "$JSON_CONTENT" ]; then
          # 如果没有代码块，尝试提取整个JSON对象
          JSON_CONTENT=$(grep -o '{.*}' issue_body.txt | head -1 || true)
        fi
        
        if [ -z "$JSON_CONTENT" ]; then
          echo "❌ 错误: 未找到JSON配置"
          exit 1
        fi
        
        echo "提取到的JSON:"
        echo "$JSON_CONTENT"
        
        # 保存JSON到文件
        echo "$JSON_CONTENT" > new_config.json
        
        # 验证JSON格式
        if ! jq empty new_config.json 2>/dev/null; then
          echo "⚠️ JSON格式需要修复..."
          
          # 尝试修复常见的JSON问题
          # 1. 替换单引号为双引号
          sed -i "s/'/\"/g" new_config.json
          
          # 2. 修复未加引号的属性名
          python3 -c "
import re
with open('new_config.json', 'r') as f:
    content = f.read()
# 匹配 属性名: 的模式
content = re.sub(r'([a-zA-Z_][a-zA-Z0-9_]*):', r'"\1":', content)
with open('new_config.json', 'w') as f:
    f.write(content)
"
          
          # 再次验证
          if ! jq empty new_config.json 2>/dev/null; then
            echo "❌ 无法修复JSON格式"
            exit 1
          fi
        fi
        
        echo "✅ JSON格式验证通过"
        
        # 提取商家ID
        SHOP_ID=$(jq -r 'keys[0]' new_config.json 2>/dev/null || echo "")
        
        if [ -z "$SHOP_ID" ]; then
          # 从Issue标题中提取
          SHOP_ID=$(echo "${{ github.event.issue.title }}" | grep -o 'l_ml[a-z0-9_]*' | head -1)
        fi
        
        if [ -z "$SHOP_ID" ]; then
          SHOP_ID="shop_${{ github.event.issue.number }}"
        fi
        
        echo "✅ 商家ID: $SHOP_ID"
        echo "shop_id=$SHOP_ID" >> $GITHUB_OUTPUT

    - name: Verify config.js exists
      run: |
        echo "📄 检查config.js文件..."
        
        if [ -f "config.js" ]; then
          echo "✅ config.js文件存在"
          echo "文件大小: $(wc -l < config.js) 行"
        else
          echo "❌ 错误: config.js文件不存在"
          exit 1
        fi

    - name: Update config.js
      run: |
        SHOP_ID="${{ steps.extract-json.outputs.shop_id }}"
        
        echo "🔄 更新config.js，商家ID: $SHOP_ID"
        
        # 读取新配置
        NEW_CONFIG=$(cat new_config.json)
        SHOP_CONFIG=$(echo "$NEW_CONFIG" | jq ".[\"$SHOP_ID\"]")
        
        echo "商家名称: $(echo "$SHOP_CONFIG" | jq -r '.name')"
        echo "菜品数量: $(echo "$SHOP_CONFIG" | jq '.dishes | length')"
        
        # 创建更新脚本
        cat > update_config.py << 'EOF'
import json
import re

def update_config():
    try:
        # 读取新配置
        with open('new_config.json', 'r', encoding='utf-8') as f:
            new_config = json.load(f)
        
        shop_id = list(new_config.keys())[0]
        shop_config = new_config[shop_id]
        
        print(f"处理商家: {shop_id}")
        print(f"商家名称: {shop_config.get('name')}")
        
        # 读取现有的config.js
        with open('config.js', 'r', encoding='utf-8') as f:
            content = f.read()
        
        # 查找 window.shopConfigs 对象
        pattern = r'window\.shopConfigs\s*=\s*(\{[\s\S]*?\});'
        match = re.search(pattern, content)
        
        if not match:
            print("❌ 错误: 找不到 window.shopConfigs 对象")
            return False
        
        config_str = match.group(1)
        config_start = match.start(1)
        config_end = match.end(1)
        
        # 构建新的商家配置
        dishes_str = json.dumps(shop_config.get('dishes', []), indent=4, ensure_ascii=False)
        dishes_str = dishes_str.replace('\n', '\n        ')
        
        new_shop_config = f"""'{shop_id}': {{
    "name": "{shop_config.get('name', '').replace('"', '\\"')}",
    "themeColor": "{shop_config.get('themeColor', '#E63946')}",
    "logo": "{shop_config.get('logo', 'images/logo.png')}",
    "qrcode": "{shop_config.get('qrcode', 'images/qrcode.jpg')}",
    "dishes": {dishes_str}
}}"""
        
        # 检查是否已存在
        if f"'{shop_id}':" in config_str:
            print(f"🔄 更新现有商家: {shop_id}")
            # 查找并替换现有配置
            shop_pattern = f"'{shop_id}':\\s*\\{{[^}}]+\\}}"
            new_config_str = re.sub(shop_pattern, new_shop_config, config_str, flags=re.DOTALL)
        else:
            print(f"➕ 添加新商家: {shop_id}")
            # 在最后一个商家后添加
            # 找到最后一个配置的结束位置
            last_comma = config_str.rfind(',')
            last_brace = config_str.rfind('}')
            
            if last_comma > last_brace:
                # 在逗号后添加
                insert_pos = last_comma + 1
                new_config_str = config_str[:insert_pos] + '\n    ' + new_shop_config + config_str[insert_pos:]
            else:
                # 在最后一个配置前添加
                insert_pos = last_brace
                new_config_str = config_str[:insert_pos] + ',\n    ' + new_shop_config + config_str[insert_pos:]
        
        # 构建新的内容
        new_content = content[:config_start] + new_config_str + content[config_end:]
        
        # 写回文件
        with open('config.js', 'w', encoding='utf-8') as f:
            f.write(new_content)
        
        print("✅ config.js 更新成功")
        return True
        
    except Exception as e:
        print(f"❌ 更新失败: {str(e)}")
        import traceback
        traceback.print_exc()
        return False

if __name__ == '__main__':
    success = update_config()
    exit(0 if success else 1)
EOF
        
        # 运行更新脚本
        python3 update_config.py
        
        echo "✅ config.js 更新完成"

    - name: Commit changes
      run: |
        echo "📝 提交更改..."
        
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        
        # 检查是否有更改
        if git diff --quiet config.js; then
          echo "⚠️ 没有检测到更改"
          echo "可能配置已存在或无变化"
        else
          echo "✅ 检测到更改，准备提交"
          git add config.js
          git commit -m "自动更新: 添加商家 ${{ steps.extract-json.outputs.shop_id }} [Issue #${{ github.event.issue.number }}]"
          git push
          echo "✅ 更改已提交"
        fi

    - name: Update Issue
      if: success()
      uses: actions/github-script@v7
      with:
        script: |
          const { issue } = context;
          const shopId = '${{ steps.extract-json.outputs.shop_id }}';
          
          console.log(`更新Issue #${issue.number}，商家ID: ${shopId}`);
          
          try {
            // 添加评论
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `✅ **配置更新成功！**\n\n商家 **${shopId}** 的配置已成功添加到 \`config.js\` 文件中。\n\n### 访问链接：\n- **顾客点餐**：\`index.html?shop=${shopId}\`\n- **商家后台**：\`admin.html?shop=${shopId}\`\n\n### 下一步：\n1. 系统已自动更新配置文件\n2. 您可以立即使用上面的链接访问\n3. 此Issue将在30秒后自动关闭`
            });
            
            // 添加标签
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: ['auto-updated', 'config-complete']
            });
            
            console.log('✅ Issue已更新');
            
            // 等待片刻后关闭Issue
            setTimeout(async () => {
              try {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed'
                });
                console.log(`✅ Issue #${issue.number} 已关闭`);
              } catch (closeError) {
                console.error(`关闭Issue失败: ${closeError.message}`);
              }
            }, 30000);
            
          } catch (error) {
            console.error(`更新Issue失败: ${error.message}`);
          }

    - name: Failure notification
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          const { issue } = context;
          
          console.log(`工作流失败，通知Issue #${issue.number}`);
          
          try {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `❌ **配置更新失败**\n\n自动更新配置文件时遇到错误。\n\n### 可能的原因：\n1. JSON格式不正确\n2. 配置文件解析失败\n3. Git推送失败\n\n请检查Issue中的JSON格式是否正确，或联系管理员处理。\n\n**错误详情请查看Actions日志**。`
            });
            
            // 添加错误标签
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: ['error', 'need-fix']
            });
            
          } catch (error) {
            console.error(`发送失败通知失败: ${error.message}`);
          }

    - name: Success summary
      if: success()
      run: |
        echo "🎉 工作流执行完成！"
        echo "商家ID: ${{ steps.extract-json.outputs.shop_id }}"
        echo "Issue编号: ${{ github.event.issue.number }}"
        echo "配置文件已更新，商家可以正常访问"
        echo ""
        echo "访问链接："
        echo "- 顾客端: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/index.html?shop=${{ steps.extract-json.outputs.shop_id }}"
        echo "- 管理端: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/admin.html?shop=${{ steps.extract-json.outputs.shop_id }}"
