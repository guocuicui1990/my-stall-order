name: Update Config from Issue

on:
  issues:
    types: [opened, edited, labeled]

jobs:
  update-config:
    # 只有当Issue包含config-update标签时才运行
    if: contains(github.event.issue.labels.*.name, 'config-update')
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GH_TOKEN }}
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Debug - Show event info
      run: |
        echo "🎯 工作流被触发"
        echo "事件名称: ${{ github.event_name }}"
        echo "仓库: ${{ github.repository }}"
        echo "Issue编号: ${{ github.event.issue.number }}"
        echo "Issue标题: ${{ github.event.issue.title }}"
        echo "Issue标签: ${{ toJson(github.event.issue.labels) }}"

    - name: Extract config from issue
      id: extract-config
      run: |
        echo "🔍 开始从Issue中提取JSON配置..."
        
        # 获取Issue内容并保存
        cat > issue_content.txt << 'EOF'
        ${{ github.event.issue.body }}
        EOF
        
        echo "📄 Issue内容已保存"
        
        # 创建Python脚本来提取JSON
        cat > extract_json.py << 'PYTHON'
import re
import json
import sys

try:
    with open('issue_content.txt', 'r', encoding='utf-8') as f:
        content = f.read()
    
    print("原始内容长度:", len(content))
    
    # 方法1: 查找```json代码块
    code_block_pattern = r'```json\s*([\s\S]*?)\s*```'
    match = re.search(code_block_pattern, content)
    
    if match:
        json_str = match.group(1).strip()
        print("✅ 从代码块中提取到JSON")
    else:
        # 方法2: 查找普通代码块
        code_block_pattern2 = r'```\s*([\s\S]*?)\s*```'
        match = re.search(code_block_pattern2, content)
        
        if match:
            json_str = match.group(1).strip()
            print("✅ 从普通代码块中提取到JSON")
        else:
            # 方法3: 直接查找JSON对象 (从第一个{到最后一个})
            start = content.find('{')
            if start != -1:
                # 找到匹配的结束括号
                depth = 0
                end = start
                for i in range(start, len(content)):
                    if content[i] == '{':
                        depth += 1
                    elif content[i] == '}':
                        depth -= 1
                        if depth == 0:
                            end = i + 1
                            break
                
                if end > start:
                    json_str = content[start:end]
                    print("✅ 从文本中提取到JSON对象")
                else:
                    print("❌ 未找到完整的JSON对象")
                    sys.exit(1)
            else:
                print("❌ 未找到JSON内容")
                sys.exit(1)
    
    # 清理和验证JSON
    json_str = json_str.strip()
    
    # 尝试解析
    try:
        config = json.loads(json_str)
        print("✅ JSON解析成功")
    except json.JSONDecodeError as e:
        print(f"JSON解析失败，尝试修复: {e}")
        # 尝试修复常见问题
        # 1. 去除可能的BOM
        json_str = json_str.replace('\ufeff', '')
        # 2. 替换单引号为双引号
        json_str = re.sub(r"'", '"', json_str)
        # 3. 修复属性名没有引号的情况
        json_str = re.sub(r'([{,]\s*)([a-zA-Z_][a-zA-Z0-9_]*)(\s*):', r'\1"\2"\3:', json_str)
        
        config = json.loads(json_str)
        print("✅ 修复后JSON解析成功")
    
    # 保存清理后的JSON
    with open('new_config.json', 'w', encoding='utf-8') as f:
        json.dump(config, f, ensure_ascii=False, indent=2)
    
    # 提取商家ID
    shop_id = list(config.keys())[0]
    print(f"✅ 商家ID: {shop_id}")
    
    # 输出到GitHub Actions
    with open('shop_id.txt', 'w') as f:
        f.write(shop_id)
    
    print("✅ 配置提取完成")
    
except Exception as e:
    print(f"❌ 错误: {e}")
    import traceback
    traceback.print_exc()
    sys.exit(1)
PYTHON
        
        # 运行Python脚本
        python3 extract_json.py
        
        # 读取商家ID
        SHOP_ID=$(cat shop_id.txt)
        echo "shop_id=$SHOP_ID" >> $GITHUB_OUTPUT
        
        echo "✅ 提取完成，商家ID: $SHOP_ID"

    - name: Check config.js file
      run: |
        echo "📄 检查config.js文件..."
        
        if [ -f "config.js" ]; then
          echo "✅ config.js文件存在"
          echo "文件大小: $(wc -l < config.js) 行"
        else
          echo "❌ 错误: config.js文件不存在"
          exit 1
        fi

    - name: Update config.js with extracted config
      run: |
        SHOP_ID="${{ steps.extract-config.outputs.shop_id }}"
        
        echo "🔄 开始更新config.js，商家ID: $SHOP_ID"
        
        # 创建更新脚本
        cat > update_script.js << 'JAVASCRIPT'
const fs = require('fs');
const path = require('path');

console.log('开始更新config.js...');

try {
  // 读取新配置
  const newConfigPath = path.join(__dirname, 'new_config.json');
  const newConfig = JSON.parse(fs.readFileSync(newConfigPath, 'utf8'));
  
  // 获取商家ID和配置
  const shopIds = Object.keys(newConfig);
  const shopId = shopIds[0];
  const shopConfig = newConfig[shopId];
  
  console.log('商家ID:', shopId);
  console.log('商家名称:', shopConfig.name);
  console.log('菜品数量:', shopConfig.dishes ? shopConfig.dishes.length : 0);
  
  // 读取现有的config.js
  const configFile = path.join(__dirname, 'config.js');
  let content = fs.readFileSync(configFile, 'utf8');
  
  // 检查文件格式
  if (!content.includes('window.shopConfigs')) {
    throw new Error('config.js文件格式不正确：找不到window.shopConfigs');
  }
  
  // 准备新的商家配置字符串（格式化为4空格缩进）
  const configStr = JSON.stringify(shopConfig, null, 4)
    .split('\n')
    .map((line, idx) => idx === 0 ? line : '    ' + line)
    .join('\n');
  
  const newShopConfigStr = `'${shopId}': ${configStr}`;
  
  // 检查商家是否已存在
  const shopExists = content.includes(`'${shopId}':`);
  
  if (shopExists) {
    console.log('更新现有商家配置:', shopId);
    
    // 使用正则匹配并替换整个商家配置块
    const pattern = new RegExp(
      `'${shopId.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}'\\s*:\\s*\\{[\\s\\S]*?\\n\\s*\\}`,
      'g'
    );
    
    content = content.replace(pattern, newShopConfigStr);
    console.log('✅ 已更新商家配置');
  } else {
    console.log('添加新商家配置:', shopId);
    
    // 在最后一个商家配置后添加（在}; 之前）
    const closingPattern = /(\n\s*)\};/;
    
    if (content.match(closingPattern)) {
      content = content.replace(
        closingPattern,
        `,\n    ${newShopConfigStr}$1};`
      );
    } else {
      // 如果找不到结束符，在shopConfigs = { 后添加
      content = content.replace(
        /(window\.shopConfigs\s*=\s*\{\s*)/,
        `$1\n    ${newShopConfigStr},`
      );
    }
    console.log('✅ 已添加新商家配置');
  }
  
  // 保存更新
  fs.writeFileSync(configFile, content, 'utf8');
  console.log('✅ config.js已成功更新！');
  
  // 验证
  const updatedContent = fs.readFileSync(configFile, 'utf8');
  if (updatedContent.includes(`'${shopId}':`)) {
    console.log('✅ 验证成功：商家配置已添加');
  } else {
    throw new Error('验证失败：未找到商家配置');
  }
  
} catch (error) {
  console.error('❌ 更新失败:', error.message);
  console.error(error.stack);
  process.exit(1);
}
JAVASCRIPT
        
        # 运行更新脚本
        node update_script.js

    - name: Commit and push changes
      run: |
        echo "📝 提交更改..."
        
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        
        git add config.js
        
        if git diff --staged --quiet; then
          echo "⚠️ 没有更改需要提交（配置可能已存在）"
        else
          git commit -m "🔧 更新商家配置: ${{ steps.extract-config.outputs.shop_id }}"
          git push
          echo "✅ 更改已提交并推送"
        fi

    - name: Comment on issue
      if: success()
      uses: actions/github-script@v7
      with:
        script: |
          const shopId = '${{ steps.extract-config.outputs.shop_id }}';
          
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: `✅ **配置已自动更新成功！**
            
**商家信息**
- 商家ID: \`${shopId}\`
- 配置文件: config.js

**访问链接**
- 🛍️ 顾客端: \`index.html?shop=${shopId}\`
- 🔧 管理端: \`admin.html?shop=${shopId}\`

此Issue将自动关闭。`
          });
          
          // 添加标签
          await github.rest.issues.addLabels({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            labels: ['auto-updated', 'completed']
          });
          
          // 关闭Issue
          await github.rest.issues.update({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            state: 'closed'
          });

    - name: Failure notification
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: `❌ **配置更新失败**
            
请检查：
1. ✅ Issue中是否包含有效的JSON配置（可以用代码块包裹）
2. ✅ JSON格式是否正确
3. ✅ config.js文件是否存在
4. ✅ GitHub Token权限是否足够

请查看 [Actions日志](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) 了解详细错误信息。`
          });
