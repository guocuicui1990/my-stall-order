name: Update Config from Issue

on:
  # 监听所有Issue事件
  issues:
    types: [opened, edited, labeled]
  
  # 允许手动触发
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to process'
        required: true
        type: number

jobs:
  update-config:
    # 总是运行这个工作流（用于调试）
    runs-on: ubuntu-latest
    
    steps:
    - name: Debug - Show event info
      run: |
        echo "🎯 工作流被触发"
        echo "事件名称: ${{ github.event_name }}"
        echo "仓库: ${{ github.repository }}"
        echo "触发者: ${{ github.actor }}"
        echo "Issue编号: ${{ github.event.issue.number }}"
        echo "Issue标题: ${{ github.event.issue.title }}"
        echo "Issue标签: ${{ toJson(github.event.issue.labels) }}"
        echo "手动触发Issue号: ${{ github.event.inputs.issue_number }}"
        
        # 保存事件信息到文件，便于查看
        echo "Event: ${{ github.event_name }}" > event_info.txt
        echo "Issue #: ${{ github.event.issue.number }}" >> event_info.txt
        echo "Manual: ${{ github.event.inputs.issue_number }}" >> event_info.txt
        cat event_info.txt

    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GH_TOKEN }}
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Determine Issue number
      id: get-issue
      run: |
        ISSUE_NUMBER=""
        
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          ISSUE_NUMBER="${{ github.event.inputs.issue_number }}"
          echo "使用手动提供的Issue编号: ${ISSUE_NUMBER}"
        elif [ -n "${{ github.event.issue.number }}" ]; then
          ISSUE_NUMBER="${{ github.event.issue.number }}"
          echo "使用事件中的Issue编号: ${ISSUE_NUMBER}"
        else
          echo "❌ 错误: 没有找到Issue编号"
          echo "Event info:"
          echo "Event name: ${{ github.event_name }}"
          echo "Issue number from event: ${{ github.event.issue.number }}"
          exit 1
        fi
        
        echo "✅ 将要处理的Issue编号: ${ISSUE_NUMBER}"
        echo "issue_number=${ISSUE_NUMBER}" >> $GITHUB_OUTPUT

    - name: Get Issue content via API
      id: get-issue-content
      run: |
        ISSUE_NUMBER="${{ steps.get-issue.outputs.issue_number }}"
        
        echo "📋 获取Issue #${ISSUE_NUMBER}的内容..."
        
        # 使用GitHub API获取Issue
        API_URL="https://api.github.com/repos/${{ github.repository }}/issues/${ISSUE_NUMBER}"
        echo "API URL: ${API_URL}"
        
        ISSUE_DATA=$(curl -s \
          -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          -H "User-Agent: GitHub-Actions" \
          "${API_URL}")
        
        # 检查是否获取成功
        if echo "${ISSUE_DATA}" | grep -q "message"; then
          ERROR_MSG=$(echo "${ISSUE_DATA}" | jq -r '.message' 2>/dev/null || echo "${ISSUE_DATA}")
          echo "❌ API错误: ${ERROR_MSG}"
          exit 1
        fi
        
        # 提取数据
        ISSUE_TITLE=$(echo "${ISSUE_DATA}" | jq -r '.title')
        ISSUE_BODY=$(echo "${ISSUE_DATA}" | jq -r '.body')
        ISSUE_LABELS=$(echo "${ISSUE_DATA}" | jq -r '[.labels[].name] | join(",")')
        
        echo "✅ Issue标题: ${ISSUE_TITLE}"
        echo "✅ Issue标签: ${ISSUE_LABELS}"
        
        # 检查是否包含config-update标签
        if [[ "${ISSUE_LABELS}" != *"config-update"* ]]; then
          echo "⚠️ 警告: Issue没有'config-update'标签"
          echo "但我们会继续处理..."
        fi
        
        # 保存Issue内容
        echo "${ISSUE_BODY}" > issue_body.txt
        
        # 提取JSON配置（简化版）
        echo "🔍 尝试从Issue中提取JSON配置..."
        
        # 方法1: 提取```json和```之间的内容
        if echo "${ISSUE_BODY}" | grep -q '```json'; then
          echo "使用方法1: 提取```json标记的内容"
          CONFIG_CONTENT=$(echo "${ISSUE_BODY}" | awk '/```json/{flag=1; next} /```/{flag=0} flag')
        # 方法2: 直接提取JSON对象
        elif echo "${ISSUE_BODY}" | grep -q '{'; then
          echo "使用方法2: 直接提取JSON对象"
          # 提取第一个完整的JSON对象
          CONFIG_CONTENT=$(echo "${ISSUE_BODY}" | grep -o '{[^}]*}' | head -1)
        else
          echo "❌ 错误: 无法从Issue中找到JSON配置"
          echo "Issue内容预览（前500字符）:"
          echo "${ISSUE_BODY:0:500}"
          exit 1
        fi
        
        # 清理配置内容
        CONFIG_CONTENT=$(echo "${CONFIG_CONTENT}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
        
        if [ -z "${CONFIG_CONTENT}" ]; then
          echo "❌ 错误: 配置内容为空"
          exit 1
        fi
        
        echo "✅ 提取的配置内容:"
        echo "${CONFIG_CONTENT}"
        
        # 保存配置到文件
        echo "${CONFIG_CONTENT}" > new_shop_config.json
        
        # 解析商家ID
        SHOP_ID=$(echo "${CONFIG_CONTENT}" | grep -o '\"[^\"]*\"' | head -1 | tr -d '"' | tr -d ':')
        
        if [ -z "${SHOP_ID}" ]; then
          # 尝试其他方式
          SHOP_ID=$(echo "${CONFIG_CONTENT}" | grep -o "'[^']*'" | head -1 | tr -d "'")
        fi
        
        if [ -z "${SHOP_ID}" ]; then
          # 使用默认格式
          SHOP_ID="shop_${ISSUE_NUMBER}_$(date +%s)"
          echo "⚠️ 无法提取商家ID，使用默认: ${SHOP_ID}"
        fi
        
        echo "✅ 商家ID: ${SHOP_ID}"
        echo "shop_id=${SHOP_ID}" >> $GITHUB_OUTPUT

    - name: Check config.js file
      run: |
        echo "📄 检查config.js文件..."
        
        if [ -f "config.js" ]; then
          echo "✅ config.js文件存在"
          echo "文件大小: $(wc -l < config.js) 行"
          echo "前3行内容:"
          head -3 config.js
        else
          echo "❌ config.js文件不存在，创建基本配置..."
          
          # 创建基本配置文件
          cat > config.js << 'EOF'
// ============================================
// 商家配置文件 - 多商家支持
// ============================================

// 支持的商家列表
window.shopConfigs = {
  "default_shop": {
    "name": "我的摊位",
    "themeColor": "#E63946",
    "logo": "images/logo.png",
    "qrcode": "images/qrcode.jpg",
    "dishes": [
      {
        "id": 1,
        "name": "招牌炸酱面",
        "price": 15,
        "emoji": "🍜",
        "category": "主食",
        "tags": ["招牌"]
      },
      {
        "id": 2,
        "name": "麻辣烫套餐",
        "price": 18,
        "emoji": "🥘",
        "category": "热菜",
        "tags": ["套餐"]
      }
    ]
  }
};

// 获取当前商家ID
function getCurrentShopId() {
  const urlParams = new URLSearchParams(window.location.search);
  let shopId = urlParams.get('shop');
  
  if (!shopId || !window.shopConfigs[shopId]) {
    shopId = 'default_shop';
  }
  
  return shopId;
}

// 获取当前商家配置
function getCurrentShopConfig() {
  const shopId = getCurrentShopId();
  return window.shopConfigs[shopId] || window.shopConfigs['default_shop'];
}

console.log('✅ 商家配置加载完成');
EOF
          
          echo "✅ 已创建config.js文件"
        fi

    - name: Create update script
      run: |
        echo "📝 创建配置更新脚本..."
        
        cat > simple_update.js << 'EOF'
        const fs = require('fs');
        const path = require('path');
        
        console.log('🔄 开始更新config.js...');
        
        try {
          // 读取新配置
          const newConfigPath = path.join(__dirname, 'new_shop_config.json');
          const newConfigData = fs.readFileSync(newConfigPath, 'utf8');
          
          console.log('新配置数据:', newConfigData);
          
          let newConfig;
          try {
            newConfig = JSON.parse(newConfigData);
          } catch (error) {
            console.error('解析JSON失败:', error.message);
            // 尝试修复JSON格式
            const fixedData = newConfigData.replace(/'/g, '"').replace(/(\w+):/g, '"$1":');
            newConfig = JSON.parse(fixedData);
          }
          
          const shopId = Object.keys(newConfig)[0];
          const shopConfig = newConfig[shopId];
          
          console.log(`处理商家: ${shopId}`);
          console.log(`商家名称: ${shopConfig.name}`);
          
          // 读取现有配置
          const configFile = path.join(__dirname, 'config.js');
          let content = fs.readFileSync(configFile, 'utf8');
          
          // 准备新的商家配置字符串
          const newShopConfig = {
            name: shopConfig.name || '新商家',
            themeColor: shopConfig.themeColor || '#E63946',
            logo: shopConfig.logo || 'images/logo.png',
            qrcode: shopConfig.qrcode || 'images/qrcode.jpg',
            dishes: shopConfig.dishes || []
          };
          
          const newConfigStr = \`'\${shopId}': \${JSON.stringify(newShopConfig, null, 4)}\`;
          
          // 查找window.shopConfigs对象
          const configMatch = content.match(/window\\.shopConfigs\\s*=\\s*(\{[\\s\\S]*?\\};)/);
          
          if (!configMatch) {
            throw new Error('找不到window.shopConfigs对象');
          }
          
          const fullConfig = configMatch[0];
          
          // 检查是否已存在该商家
          if (content.includes(\`'\${shopId}':\`)) {
            console.log(\`更新现有商家: \${shopId}\`);
            // 替换现有配置
            const existingPattern = new RegExp(\`'\\\${shopId}'[\\s\\S]*?\\n\\s*\\}\`, 'm');
            content = content.replace(existingPattern, newConfigStr);
          } else {
            console.log(\`添加新商家: \${shopId}\`);
            // 在最后一个商家后添加
            const lastEntryMatch = content.match(/(\\}\\s*,?\\s*\\n\\s*)(\\}\\);)/);
            if (lastEntryMatch) {
              content = content.replace(lastEntryMatch[0], \`\${newConfigStr},\\n\\}\\n\`);
            } else {
              // 简单方法：在倒数第二行前插入
              const lines = content.split('\\n');
              lines.splice(lines.length - 2, 0, \`    \${newConfigStr},\`);
              content = lines.join('\\n');
            }
          }
          
          // 保存更新
          fs.writeFileSync(configFile, content);
          console.log('✅ config.js更新成功！');
          
          // 显示更新后的部分
          const updatedMatch = content.match(new RegExp(\`'\\\${shopId}'[\\s\\S]*?\\n\\s*\\}\`, 'm'));
          if (updatedMatch) {
            console.log('更新后的配置:');
            console.log(updatedMatch[0]);
          }
          
        } catch (error) {
          console.error('❌ 更新失败:', error.message);
          console.error(error.stack);
          process.exit(1);
        }
        EOF
        
        echo "✅ 更新脚本创建完成"

    - name: Update config.js
      run: |
        SHOP_ID="${{ steps.get-issue-content.outputs.shop_id }}"
        echo "🔄 更新config.js，商家ID: ${SHOP_ID}"
        
        # 运行更新脚本
        node simple_update.js
        
        echo "✅ config.js更新完成"
        echo "更新后的文件预览:"
        grep -n "${SHOP_ID}" config.js || echo "未找到商家ID，但更新可能成功"

    - name: Commit changes
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        
        echo "🔍 检查更改..."
        git status
        
        if git diff --quiet config.js; then
          echo "⚠️ 没有检测到config.js的更改"
        else
          echo "✅ 检测到config.js的更改"
          git add config.js
          git commit -m "更新商家配置: ${{ steps.get-issue-content.outputs.shop_id }} [自动更新]"
          echo "✅ 更改已提交"
        fi

    - name: Push changes
      run: |
        echo "🚀 推送更改到仓库..."
        git push
        echo "✅ 更改已推送"

    - name: Success message
      run: |
        echo "🎉 工作流执行完成！"
        echo "商家ID: ${{ steps.get-issue-content.outputs.shop_id }}"
        echo "配置已更新到config.js文件"
