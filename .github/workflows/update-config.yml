name: Update Config from Issue

# 简化触发条件，确保能触发
on:
  issues:
    types: [opened, labeled]

# 添加工单级别的权限
permissions:
  contents: write
  issues: write

jobs:
  update-config:
    # 简化条件判断
    if: |
      github.event_name == 'issues' &&
      (github.event.action == 'opened' || github.event.action == 'labeled')
    runs-on: ubuntu-latest
    
    steps:
    - name: 显示事件信息（调试）
      run: |
        echo "=== 调试信息 ==="
        echo "事件类型: ${{ github.event_name }}"
        echo "事件动作: ${{ github.event.action }}"
        echo "Issue编号: ${{ github.event.issue.number }}"
        echo "Issue标题: ${{ github.event.issue.title }}"
        echo "Issue标签: ${{ join(github.event.issue.labels.*.name, ', ') }}"
        echo "Issue状态: ${{ github.event.issue.state }}"
        echo ""
        echo "Issue内容前100字符:"
        echo "${{ github.event.issue.body }}" | head -c 100

    - name: 检查是否有 config-update 标签
      id: check-label
      run: |
        echo "检查标签..."
        
        # 简单方法：检查标签名
        LABELS='${{ join(github.event.issue.labels.*.name, ', ') }}'
        echo "所有标签: $LABELS"
        
        if echo "$LABELS" | grep -q "config-update"; then
          echo "✅ 找到 config-update 标签"
          echo "has_label=true" >> $GITHUB_OUTPUT
        elif [[ "${{ github.event.action }}" == "labeled" && "${{ github.event.label.name }}" == "config-update" ]]; then
          echo "✅ 刚刚添加了 config-update 标签"
          echo "has_label=true" >> $GITHUB_OUTPUT
        else
          echo "❌ 没有 config-update 标签，跳过工作流"
          echo "has_label=false" >> $GITHUB_OUTPUT
        fi

    - name: 检出代码
      if: steps.check-label.outputs.has_label == 'true'
      uses: actions/checkout@v4

    - name: 设置 Node.js
      if: steps.check-label.outputs.has_label == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: 从 Issue 中提取 JSON 配置
      if: steps.check-label.outputs.has_label == 'true'
      id: extract-json
      run: |
        echo "📋 开始提取 JSON 配置..."
        
        # 保存 Issue 内容到文件
        echo "${{ github.event.issue.body }}" > issue_body.txt
        echo "Issue 内容已保存，长度: $(wc -c < issue_body.txt) 字节"
        
        # 显示内容前 200 字符用于调试
        echo "=== Issue 内容预览 ==="
        head -c 200 issue_body.txt
        echo ""
        echo "=== 结束预览 ==="
        
        # 安装 jq 用于处理 JSON
        sudo apt-get update
        sudo apt-get install -y jq
        
        # 方法1：尝试提取 ```json 代码块
        echo "尝试提取 ```json 代码块..."
        if grep -q '```json' issue_body.txt; then
          # 提取 json 代码块内容
          awk '/```json/,/```/' issue_body.txt | sed '/```json/d; /```/d' > extracted.json
          echo "✅ 从代码块中提取了 JSON"
        else
          echo "没有找到 ```json 代码块"
          # 方法2：尝试提取整个 JSON 对象
          grep -o '{.*}' issue_body.txt | head -1 > extracted.json
        fi
        
        # 检查是否提取到内容
        if [ ! -s extracted.json ]; then
          echo "❌ 错误：没有提取到 JSON 内容"
          exit 1
        fi
        
        echo "提取到的 JSON 内容:"
        cat extracted.json
        echo ""
        
        # 验证和清理 JSON
        if ! jq empty extracted.json 2>/dev/null; then
          echo "⚠️ JSON 格式需要修复..."
          
          # 尝试修复常见问题
          # 1. 替换单引号为双引号
          sed -i "s/'/\"/g" extracted.json
          
          # 2. 修复未加引号的属性名
          python3 -c "
import re
with open('extracted.json', 'r') as f:
    content = f.read()
# 匹配属性名: 值，给属性名加双引号
pattern = r'([a-zA-Z_][a-zA-Z0-9_]*)\s*:'
def replace(match):
    return '\"' + match.group(1) + '\":'
content = re.sub(pattern, replace, content)
with open('extracted.json', 'w') as f:
    f.write(content)
"
          
          # 再次验证
          if ! jq empty extracted.json 2>/dev/null; then
            echo "❌ 无法修复 JSON 格式"
            exit 1
          fi
        fi
        
        echo "✅ JSON 格式验证通过"
        
        # 提取商家 ID
        SHOP_ID=$(jq -r 'keys[0]' extracted.json 2>/dev/null || echo "")
        
        if [ -z "$SHOP_ID" ]; then
          # 从 Issue 标题中提取
          SHOP_ID=$(echo "${{ github.event.issue.title }}" | grep -o 'l_ml[a-z0-9_]*' | head -1)
        fi
        
        if [ -z "$SHOP_ID" ]; then
          SHOP_ID="shop_${{ github.event.issue.number }}"
        fi
        
        echo "✅ 商家ID: $SHOP_ID"
        
        # 复制为工作流需要的文件
        cp extracted.json new_config.json
        
        # 输出变量
        echo "shop_id=$SHOP_ID" >> $GITHUB_OUTPUT

    - name: 检查 config.js 文件
      if: steps.check-label.outputs.has_label == 'true'
      run: |
        echo "📄 检查 config.js 文件..."
        
        if [ -f "config.js" ]; then
          echo "✅ config.js 文件存在"
          echo "文件大小: $(wc -l < config.js) 行"
          echo "前 3 行:"
          head -3 config.js
        else
          echo "❌ 错误: config.js 文件不存在"
          exit 1
        fi

    - name: 创建更新脚本
      if: steps.check-label.outputs.has_label == 'true'
      run: |
        echo "📝 创建更新脚本..."
        
        cat > update_script.js << 'EOF'
const fs = require('fs');
const path = require('path');

console.log('开始更新 config.js...');

try {
  // 读取新配置
  const newConfigPath = path.join(__dirname, 'new_config.json');
  const newConfigData = fs.readFileSync(newConfigPath, 'utf8');
  
  console.log('新配置数据长度:', newConfigData.length);
  console.log('新配置预览:', newConfigData.substring(0, 100));
  
  const newConfig = JSON.parse(newConfigData);
  const shopId = Object.keys(newConfig)[0];
  const shopConfig = newConfig[shopId];
  
  console.log('处理商家:', shopId);
  console.log('商家名称:', shopConfig.name);
  
  // 读取现有的 config.js
  const configContent = fs.readFileSync('config.js', 'utf8');
  
  // 查找 window.shopConfigs 对象
  const shopConfigsMatch = configContent.match(/window\.shopConfigs\s*=\s*(\{[\s\S]*?\});/);
  
  if (!shopConfigsMatch) {
    throw new Error('找不到 window.shopConfigs 对象');
  }
  
  const fullConfig = shopConfigsMatch[0];
  const configObject = shopConfigsMatch[1];
  
  console.log('找到 window.shopConfigs 配置');
  
  // 构建新商家配置字符串
  const dishesStr = JSON.stringify(shopConfig.dishes || [], null, 4)
    .replace(/\n/g, '\n        ');
  
  const newShopConfig = `'${shopId}': {
    "name": "${shopConfig.name.replace(/"/g, '\\"')}",
    "themeColor": "${shopConfig.themeColor || '#E63946'}",
    "logo": "${shopConfig.logo || 'images/logo.png'}",
    "qrcode": "${shopConfig.qrcode || 'images/qrcode.jpg'}",
    "dishes": ${dishesStr}
}`;
  
  console.log('新商家配置预览:', newShopConfig.substring(0, 100));
  
  let updatedContent = configContent;
  
  // 检查是否已存在该商家
  if (configContent.includes(`'${shopId}':`)) {
    console.log('更新现有商家配置...');
    
    // 查找并替换现有配置
    const pattern = new RegExp(`'${shopId}'[\\s\\S]*?\\n\\s*},?`, 'm');
    updatedContent = configContent.replace(pattern, newShopConfig + ',');
  } else {
    console.log('添加新商家配置...');
    
    // 在最后一个商家后添加
    // 查找 window.shopConfigs = { 后面所有商家的位置
    const configStart = configContent.indexOf('window.shopConfigs = {');
    if (configStart === -1) {
      throw new Error('找不到配置开始位置');
    }
    
    // 找到配置对象的结束位置
    let braceCount = 0;
    let configEnd = -1;
    
    for (let i = configStart; i < configContent.length; i++) {
      if (configContent[i] === '{') braceCount++;
      if (configContent[i] === '}') {
        braceCount--;
        if (braceCount === 0) {
          configEnd = i;
          break;
        }
      }
    }
    
    if (configEnd === -1) {
      throw new Error('找不到配置结束位置');
    }
    
    const beforeConfig = configContent.substring(0, configStart);
    const configText = configContent.substring(configStart, configEnd);
    const afterConfig = configContent.substring(configEnd);
    
    // 在最后一个商家后添加新配置
    const lastShopIndex = configText.lastIndexOf('},');
    if (lastShopIndex !== -1) {
      // 在最后一个商家后添加
      const newConfigText = configText.substring(0, lastShopIndex + 2) + 
        '\n    ' + newShopConfig + ',' +
        configText.substring(lastShopIndex + 2);
      updatedContent = beforeConfig + newConfigText + afterConfig;
    } else {
      // 直接添加到对象中
      const insertPos = configText.lastIndexOf('\n');
      const newConfigText = configText.substring(0, insertPos) + 
        ',\n    ' + newShopConfig +
        configText.substring(insertPos);
      updatedContent = beforeConfig + newConfigText + afterConfig;
    }
  }
  
  // 写入文件
  fs.writeFileSync('config.js', updatedContent);
  console.log('✅ config.js 更新成功！');
  
} catch (error) {
  console.error('❌ 更新失败:', error.message);
  process.exit(1);
}
EOF
        
        echo "✅ 更新脚本创建完成"

    - name: 运行更新脚本
      if: steps.check-label.outputs.has_label == 'true'
      run: |
        echo "🚀 运行更新脚本..."
        node update_script.js

    - name: 提交更改
      if: steps.check-label.outputs.has_label == 'true'
      run: |
        echo "📝 准备提交更改..."
        
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # 检查是否有更改
        if git diff --quiet config.js; then
          echo "⚠️ 没有检测到 config.js 的更改"
          echo "可能的原因:"
          echo "1. 商家配置已存在且相同"
          echo "2. 更新过程中出现错误"
        else
          echo "✅ 检测到更改，正在提交..."
          git add config.js
          git commit -m "自动更新: 添加商家 ${{ steps.extract-json.outputs.shop_id }} [Issue #${{ github.event.issue.number }}]"
          git push
          echo "✅ 更改已提交到仓库"
        fi

    - name: 在 Issue 上添加评论
      if: steps.check-label.outputs.has_label == 'true' && success()
      uses: actions/github-script@v7
      with:
        script: |
          const issueNumber = context.issue.number;
          const shopId = '${{ steps.extract-json.outputs.shop_id }}';
          
          console.log(`在 Issue #${issueNumber} 上添加评论，商家ID: ${shopId}`);
          
          try {
            // 添加成功评论
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `🎉 **配置更新成功！**\n\n商家 **${shopId}** 的配置已成功添加到系统中。\n\n### 访问链接：\n- 👨‍🍳 顾客点餐：\`index.html?shop=${shopId}\`\n- 📊 商家后台：\`admin.html?shop=${shopId}\`\n\n### 状态：\n✅ 配置文件已自动更新\n✅ 更改已提交到仓库\n\n此 Issue 将在 1 分钟后自动关闭。`
            });
            
            // 添加成功标签
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['auto-updated', 'completed']
            });
            
            console.log('✅ 评论和标签已添加');
            
            // 延迟后关闭 Issue
            setTimeout(async () => {
              try {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  state: 'closed'
                });
                console.log(`✅ Issue #${issueNumber} 已关闭`);
              } catch (error) {
                console.error('关闭 Issue 失败:', error.message);
              }
            }, 60000);
            
          } catch (error) {
            console.error('添加评论失败:', error.message);
          }

    - name: 工作流成功总结
      if: steps.check-label.outputs.has_label == 'true' && success()
      run: |
        echo "🎉 工作流执行成功！"
        echo ""
        echo "=== 执行结果 ==="
        echo "商家ID: ${{ steps.extract-json.outputs.shop_id }}"
        echo "Issue编号: #${{ github.event.issue.number }}"
        echo "配置文件: config.js 已更新"
        echo "状态: 商家配置已添加到系统"
        echo ""
        echo "=== 访问链接 ==="
        echo "顾客端: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/index.html?shop=${{ steps.extract-json.outputs.shop_id }}"
        echo "管理端: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/admin.html?shop=${{ steps.extract-json.outputs.shop_id }}"

    - name: 工作流失败通知
      if: failure() && steps.check-label.outputs.has_label == 'true'
      uses: actions/github-script@v7
      with:
        script: |
          const issueNumber = context.issue.number;
          
          console.log(`工作流失败，通知 Issue #${issueNumber}`);
          
          try {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `❌ **配置更新失败**\n\n自动更新配置文件时遇到错误。\n\n### 可能原因：\n1. JSON 格式不正确\n2. 配置文件解析失败\n3. Git 推送失败\n\n请检查 Issue 中的 JSON 格式是否正确，或联系管理员处理。\n\n**详细错误请查看 Actions 日志。**`
            });
            
            // 添加错误标签
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['error', 'need-fix']
            });
            
          } catch (error) {
            console.error(`发送失败通知失败: ${error.message}`);
          }

    - name: 没有标签时的跳过通知
      if: steps.check-label.outputs.has_label == 'false'
      run: |
        echo "⏭️ 跳过工作流：没有 config-update 标签"
        echo "如果需要触发此工作流，请为 Issue 添加 'config-update' 标签"
