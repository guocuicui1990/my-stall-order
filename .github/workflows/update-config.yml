name: Update Config
on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue编号'
        required: true
jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'config-update'))
    runs-on: ubuntu-latest
    
    steps:
    - name: 触发确认
      run: echo "工作流触发成功，触发方式=${{ github.event_name }}"
    
    - name: Checkout
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    - name: Setup Node
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    - name: 获取Issue内容
      id: issue
      shell: bash
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          NUM="${{ github.event.inputs.issue_number }}"
          BODY=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/issues/$NUM | jq -r '.body')
        else
          NUM="${{ github.event.issue.number }}"
          BODY=$(cat << 'ISSUE_EOF'
        ${{ github.event.issue.body }}
        ISSUE_EOF
        )
        fi
        
        echo "issue_number=$NUM" >> $GITHUB_OUTPUT
        
        {
          echo "issue_body<<BODY_EOF"
          echo "$BODY"
          echo "BODY_EOF"
        } >> $GITHUB_OUTPUT
    - name: 提取配置
      id: config
      shell: bash
      run: |
        cat > issue.txt << 'CONTENT_EOF'
        ${{ steps.issue.outputs.issue_body }}
        CONTENT_EOF
        
        python3 << 'PYTHON_EOF'
import re, json, sys
try:
    content = open('issue.txt', 'r', encoding='utf-8').read()
    print(f"内容长度: {len(content)}")
    
    # 尝试提取JSON
    m = re.search(r'```json\s*([\s\S]*?)\s*```', content)
    if not m:
        m = re.search(r'```\s*([\s\S]*?)\s*```', content)
    
    if m:
        js = m.group(1).strip()
        print("从代码块提取")
    else:
        s = content.find('{')
        if s == -1:
            raise ValueError("未找到JSON")
        d = 0
        e = -1
        for i in range(s, len(content)):
            if content[i] == '{':
                d += 1
            elif content[i] == '}':
                d -= 1
                if d == 0:
                    e = i + 1
                    break
        if e == -1:
            raise ValueError("JSON不完整")
        js = content[s:e]
        print("直接提取JSON对象")
    
    cfg = json.loads(js)
    sid = list(cfg.keys())[0]
    print(f"商家ID: {sid}")
    
    with open('new.json', 'w', encoding='utf-8') as f:
        json.dump(cfg, f, ensure_ascii=False, indent=2)
    
    with open('sid.txt', 'w') as f:
        f.write(sid)
    
    print("提取成功")
except Exception as e:
    print(f"错误: {e}")
    import traceback
    traceback.print_exc()
    sys.exit(1)
        PYTHON_EOF
        
        if [ ! -f "sid.txt" ]; then
          echo "提取失败"
          exit 1
        fi
        
        SID=$(cat sid.txt)
        echo "shop_id=$SID" >> $GITHUB_OUTPUT
        echo "商家ID: $SID"
    - name: 更新config.js
      shell: bash
      run: |
        node << 'JAVASCRIPT_EOF'
const fs = require('fs');
try {
  const cfg = JSON.parse(fs.readFileSync('new.json', 'utf8'));
  const sid = Object.keys(cfg)[0];
  const sc = cfg[sid];
  
  console.log('商家ID:', sid);
  console.log('商家名称:', sc.name);
  
  let txt = fs.readFileSync('config.js', 'utf8');
  const ns = "'" + sid + "': " + JSON.stringify(sc, null, 4);
  
  if (txt.includes("'" + sid + "':")) {
    const regex = new RegExp("'" + sid.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + "'\\s*:\\s*\\{[\\s\\S]*?\\n\\s*\\}", 'm');
    txt = txt.replace(regex, ns);
    console.log('更新现有商家');
  } else {
    const p = txt.lastIndexOf('};');
    if (p === -1) {
      throw new Error('未找到config.js结束位置');
    }
    txt = txt.substring(0, p) + ',\n    ' + ns + '\n' + txt.substring(p);
    console.log('添加新商家');
  }
  
  fs.writeFileSync('config.js', txt);
  console.log('更新成功');
} catch (error) {
  console.error('错误:', error.message);
  process.exit(1);
}
        JAVASCRIPT_EOF
    - name: 提交
      shell: bash
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add config.js
        
        if git diff --staged --quiet; then
          echo "无变更"
        else
          git commit -m "更新配置: ${{ steps.config.outputs.shop_id }}"
          git push
          echo "已提交"
        fi
    - name: 评论
      if: success()
      uses: actions/github-script@v7
      with:
        script: |
          const n = ${{ steps.issue.outputs.issue_number }};
          const sid = '${{ steps.config.outputs.shop_id }}';
          
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: n,
            body: `✅ 配置已更新！\n\n商家ID: \`${sid}\``
          });
          
          await github.rest.issues.update({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: n,
            state: 'closed'
          });
