name: Update Config from Issue

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to process'
        required: true
        type: string

jobs:
  update-config:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        # 移除token参数，使用默认的GITHUB_TOKEN
        fetch-depth: 0

    - name: Debug info
      run: |
        echo "✅ 工作流开始运行"
        echo "Issue编号: ${{ github.event.inputs.issue_number }}"
        echo "仓库: ${{ github.repository }}"
        echo "触发者: ${{ github.actor }}"

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Create simple test file
      run: |
        echo "🔄 创建测试文件..."
        
        # 创建一个简单的测试，确保工作流能运行
        cat > test_output.txt << 'EOF'
        GitHub Actions 测试运行
        时间: $(date)
        仓库: ${{ github.repository }}
        Issue编号: ${{ github.event.inputs.issue_number }}
        EOF
        
        echo "✅ 测试文件已创建"
        
        # 显示当前目录内容
        echo "📁 当前目录内容:"
        ls -la

    - name: Check config.js
      run: |
        echo "🔍 检查config.js..."
        
        if [ -f "config.js" ]; then
          echo "✅ config.js 存在"
          echo "文件大小: $(wc -l < config.js) 行"
        else
          echo "⚠️ config.js 不存在，创建基础版本"
          
          cat > config.js << 'EOF'
// 基础配置文件
window.shopConfigs = {
  "default_shop": {
    "name": "默认商家",
    "themeColor": "#E63946",
    "logo": "images/logo.png",
    "qrcode": "images/qrcode.jpg",
    "dishes": []
  }
};

function getCurrentShopId() {
  const urlParams = new URLSearchParams(window.location.search);
  let shopId = urlParams.get('shop');
  if (!shopId || !window.shopConfigs[shopId]) {
    shopId = 'default_shop';
  }
  return shopId;
}

function getCurrentShopConfig() {
  const shopId = getCurrentShopId();
  return window.shopConfigs[shopId] || window.shopConfigs['default_shop'];
}

console.log('配置加载完成');
EOF
        fi

    - name: Create test commit
      run: |
        echo "📝 创建测试提交..."
        
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        
        # 检查是否有更改
        if git status --porcelain | grep -q "config.js\|test_output.txt"; then
          echo "检测到更改，准备提交..."
          git add .
          git commit -m "测试工作流运行 - $(date)"
          git push
          echo "✅ 提交并推送成功"
        else
          echo "没有检测到更改"
        fi

    - name: Success message
      run: |
        echo "🎉 工作流成功完成！"
        echo "下一步：在register.html中手动添加商家配置"
        echo "或者使用GitHub Issues手动更新"
