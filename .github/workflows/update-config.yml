name: Update Config from Issue
on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:  # 添加这一行，支持手动触发
    inputs:
      issue_number:
        description: 'Issue编号'
        required: true
        type: number
jobs:
  update-config:
    runs-on: ubuntu-latest
    
    steps:
    - name: 检查触发
      run: |
        echo "======================================"
        echo "🎯 工作流已触发！"
        echo "======================================"
        # 如果是手动触发
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "手动触发模式"
          echo "Issue编号: ${{ github.event.inputs.issue_number }}"
        else
          echo "Issue编号: ${{ github.event.issue.number }}"
          echo "Issue标题: ${{ github.event.issue.title }}"
        fi
        echo "======================================"
