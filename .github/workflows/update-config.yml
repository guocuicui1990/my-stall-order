name: Update Config from Issue

on:
  # 监听Issue的创建和标签添加
  issues:
    types: [opened, labeled]
  
  # 允许手动触发
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to process'
        required: true
        type: number

jobs:
  update-config:
    # 简化条件，确保工作流会运行
    if: |
      github.event_name == 'issues' ||
      github.event_name == 'workflow_dispatch'
    
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GH_TOKEN }}
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Debug - Show event info
      run: |
        echo "Event name: ${{ github.event_name }}"
        echo "Repository: ${{ github.repository }}"
        echo "Event action: ${{ github.event.action }}"
        echo "Issue number: ${{ github.event.issue.number }}"
        echo "Issue title: ${{ github.event.issue.title }}"
        echo "Issue labels: ${{ toJson(github.event.issue.labels) }}"
        echo "Manual trigger issue number: ${{ github.event.inputs.issue_number }}"

    - name: Determine Issue number
      id: get-issue
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          ISSUE_NUMBER="${{ github.event.inputs.issue_number }}"
          echo "Using manually provided issue number: ${ISSUE_NUMBER}"
        else
          ISSUE_NUMBER="${{ github.event.issue.number }}"
          echo "Using event issue number: ${ISSUE_NUMBER}"
        fi
        
        if [ -z "${ISSUE_NUMBER}" ]; then
          echo "ERROR: No issue number found"
          exit 1
        fi
        
        echo "issue_number=${ISSUE_NUMBER}" >> $GITHUB_OUTPUT
        echo "Will process issue #${ISSUE_NUMBER}"

    - name: Get Issue content
      id: get-issue-content
      run: |
        ISSUE_NUMBER="${{ steps.get-issue.outputs.issue_number }}"
        
        echo "Fetching issue #${ISSUE_NUMBER}..."
        
        # 使用GitHub API获取Issue内容
        ISSUE_DATA=$(curl -s \
          -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          "https://api.github.com/repos/${{ github.repository }}/issues/${ISSUE_NUMBER}")
        
        # 提取Issue信息
        ISSUE_TITLE=$(echo "${ISSUE_DATA}" | jq -r '.title')
        ISSUE_BODY=$(echo "${ISSUE_DATA}" | jq -r '.body')
        ISSUE_LABELS=$(echo "${ISSUE_DATA}" | jq -r '[.labels[].name] | join(",")')
        
        echo "Issue Title: ${ISSUE_TITLE}"
        echo "Issue Labels: ${ISSUE_LABELS}"
        
        # 检查是否包含config-update标签
        if [[ "${ISSUE_LABELS}" != *"config-update"* ]]; then
          echo "WARNING: Issue does not have 'config-update' label"
          echo "But we'll still try to process it..."
        fi
        
        # 保存Issue内容用于调试
        echo "${ISSUE_BODY}" > issue_body.txt
        
        # 提取JSON配置部分
        if echo "${ISSUE_BODY}" | grep -q '```json'; then
          # 提取```json和```之间的内容
          CONFIG_CONTENT=$(echo "${ISSUE_BODY}" | awk '/```json/,/```/' | sed '1d;$d')
        elif echo "${ISSUE_BODY}" | grep -q '{'; then
          # 尝试直接提取第一个JSON对象
          CONFIG_CONTENT=$(echo "${ISSUE_BODY}" | grep -o '{.*}' | head -1)
        else
          echo "ERROR: Could not find JSON config in issue body"
          echo "Issue body preview:"
          echo "${ISSUE_BODY}" | head -20
          exit 1
        fi
        
        if [ -z "${CONFIG_CONTENT}" ]; then
          echo "ERROR: No config content found"
          exit 1
        fi
        
        echo "Found config content:"
        echo "${CONFIG_CONTENT}"
        
        # 保存配置到文件
        echo "${CONFIG_CONTENT}" > new_shop_config.json
        
        # 解析商家ID
        SHOP_ID=$(echo "${CONFIG_CONTENT}" | grep -o '"\([^"]*\)":' | head -1 | sed 's/"//g' | sed 's/://')
        
        if [ -z "${SHOP_ID}" ]; then
          # 尝试其他方式提取ID
          SHOP_ID=$(echo "${CONFIG_CONTENT}" | grep -o '\w\+_ml[^"]*' | head -1 || true)
        fi
        
        if [ -z "${SHOP_ID}" ]; then
          echo "ERROR: Could not extract shop ID from config"
          echo "Config content:"
          echo "${CONFIG_CONTENT}"
          exit 1
        fi
        
        echo "Extracted Shop ID: ${SHOP_ID}"
        echo "shop_id=${SHOP_ID}" >> $GITHUB_OUTPUT

    - name: Check if config.js exists
      run: |
        if [ -f "config.js" ]; then
          echo "✅ config.js exists"
          echo "First few lines of config.js:"
          head -20 config.js
        else
          echo "❌ config.js does not exist!"
          echo "Creating a basic config.js file..."
          
          # 创建基本的config.js文件
          cat > config.js << 'EOF'
// ============================================
// 商家配置文件 - 多商家支持
// ============================================

// 支持的商家列表
window.shopConfigs = {
  "default_shop": {
    "name": "我的摊位",
    "themeColor": "#E63946",
    "logo": "images/logo.png",
    "qrcode": "images/qrcode.jpg",
    "dishes": [
      {
        "id": 1,
        "name": "招牌炸酱面",
        "price": 15,
        "emoji": "🍜",
        "category": "主食",
        "tags": ["招牌"]
      },
      {
        "id": 2,
        "name": "麻辣烫套餐",
        "price": 18,
        "emoji": "🥘",
        "category": "热菜",
        "tags": ["套餐"]
      }
    ]
  }
};

// 获取当前商家ID
function getCurrentShopId() {
  const urlParams = new URLSearchParams(window.location.search);
  let shopId = urlParams.get('shop');
  
  if (!shopId || !window.shopConfigs[shopId]) {
    shopId = 'default_shop';
  }
  
  return shopId;
}

// 获取当前商家配置
function getCurrentShopConfig() {
  const shopId = getCurrentShopId();
  return window.shopConfigs[shopId] || window.shopConfigs['default_shop'];
}

console.log('✅ 商家配置加载完成');
EOF
          
          echo "Created basic config.js file"
        fi

    - name: Update config.js with new shop
      run: |
        SHOP_ID="${{ steps.get-issue-content.outputs.shop_id }}"
        CONFIG_FILE="config.js"
        
        echo "Updating ${CONFIG_FILE} with shop: ${SHOP_ID}"
        
        # 创建更新脚本
        cat > update_config.js << 'EOF'
        const fs = require('fs');
        const path = require('path');
        
        // 读取新配置
        const newConfigPath = path.join(__dirname, 'new_shop_config.json');
        const newConfigData = fs.readFileSync(newConfigPath, 'utf8');
        let newConfig;
        
        try {
          newConfig = JSON.parse(newConfigData);
        } catch (error) {
          console.error('Error parsing new config:', error.message);
          console.error('Config data:', newConfigData);
          process.exit(1);
        }
        
        console.log('New config loaded:', Object.keys(newConfig));
        
        const shopId = Object.keys(newConfig)[0];
        const shopConfig = newConfig[shopId];
        
        console.log(`Processing shop: ${shopId}`);
        console.log('Shop name:', shopConfig.name);
        
        // 读取现有的config.js
        const configFile = path.join(__dirname, 'config.js');
        let content = fs.readFileSync(configFile, 'utf8');
        
        // 准备新的商家配置字符串
        const newShopConfigStr = \`'\${shopId}': {
    name: '\${shopConfig.name}',
    themeColor: '\${shopConfig.themeColor || '#E63946'}',
    logo: '\${shopConfig.logo || 'images/logo.png'}',
    qrcode: '\${shopConfig.qrcode || 'images/qrcode.jpg'}',
    dishes: \${JSON.stringify(shopConfig.dishes || [], null, 4)}
}\`;
        
        // 查找window.shopConfigs对象
        const configMatch = content.match(/window\\.shopConfigs\\s*=\\s*(\\{[\\s\\S]*?\\};)/);
        if (!configMatch) {
          console.error('Could not find window.shopConfigs object');
          process.exit(1);
        }
        
        const fullConfigMatch = configMatch[1];
        
        // 检查是否已存在该商家
        if (content.includes(\`'\${shopId}':\`)) {
          console.log(\`Updating existing shop: \${shopId}\`);
          
          // 创建正则表达式匹配现有配置
          const existingPattern = new RegExp(\`'\\\${shopId}'\\s*:\\s*\\{[^}]+\\}\`, 's');
          
          if (content.match(existingPattern)) {
            content = content.replace(existingPattern, newShopConfigStr);
            console.log(\`Updated shop \${shopId}\`);
          } else {
            console.error(\`Could not find existing shop pattern for \${shopId}\`);
            process.exit(1);
          }
        } else {
          console.log(\`Adding new shop: \${shopId}\`);
          
          // 找到最后一个商家配置后添加
          // 首先找到window.shopConfigs = { ... };中的内容
          const configStart = content.indexOf('window.shopConfigs = {');
          if (configStart === -1) {
            console.error('Could not find window.shopConfigs declaration');
            process.exit(1);
          }
          
          // 找到配置块的结束位置
          let braceCount = 0;
          let inConfig = false;
          let configEnd = -1;
          
          for (let i = configStart; i < content.length; i++) {
            if (content[i] === '{') {
              braceCount++;
              inConfig = true;
            } else if (content[i] === '}') {
              braceCount--;
              if (inConfig && braceCount === 0) {
                configEnd = i;
                break;
              }
            }
          }
          
          if (configEnd === -1) {
            console.error('Could not find end of shopConfigs object');
            process.exit(1);
          }
          
          // 在最后一个大括号前插入新配置
          const beforeConfig = content.substring(0, configEnd);
          const afterConfig = content.substring(configEnd);
          
          // 检查最后一个字符是否是逗号
          const lastChar = beforeConfig.trim().slice(-1);
          const needsComma = lastChar !== ',' && lastChar !== '{';
          
          content = beforeConfig + (needsComma ? ',' : '') + '\\n    ' + newShopConfigStr + afterConfig;
        }
        
        // 保存更新
        fs.writeFileSync(configFile, content);
        console.log('✅ config.js updated successfully');
        
        // 显示更新后的部分
        console.log('\\nUpdated section preview:');
        const updatedMatch = content.match(new RegExp(\`'\\\${shopId}'[\\s\\S]*?\\n\\s*}\\`, 'm'));
        if (updatedMatch) {
          console.log(updatedMatch[0]);
        }
        EOF
        
        # 运行更新脚本
        node update_config.js
        
        # 显示更新后的config.js片段
        echo "Updated config.js preview:"
        grep -A 10 "'${SHOP_ID}'" config.js || echo "Could not find shop ${SHOP_ID} in config.js"

    - name: Commit and push changes
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        
        # 检查是否有更改
        if git diff --quiet config.js; then
          echo "No changes to config.js"
        else
          echo "Changes detected in config.js"
          git add config.js
          git commit -m "Update config.js with shop: ${{ steps.get-issue-content.outputs.shop_id }} [Auto-update]"
          git push
          echo "✅ Changes pushed to repository"
        fi

    - name: Comment on issue
      if: success()
      uses: actions/github-script@v6
      with:
        script: |
          const issueNumber = '${{ steps.get-issue.outputs.issue_number }}';
          const shopId = '${{ steps.get-issue-content.outputs.shop_id }}';
          
          console.log(`Adding comment to issue #${issueNumber} for shop ${shopId}`);
          
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: issueNumber,
            body: `✅ 配置已自动更新！\n\n商家 **${shopId}** 的配置已成功添加到config.js文件中。\n\n您可以立即访问：\n- 顾客端: index.html?shop=${shopId}\n- 管理端: admin.html?shop=${shopId}\n\n此Issue将在10秒后自动关闭。`
          });
          
          // 关闭Issue
          setTimeout(async () => {
            try {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                state: 'closed'
              });
              console.log(`Issue #${issueNumber} closed successfully`);
            } catch (error) {
              console.error(`Failed to close issue #${issueNumber}:`, error.message);
            }
          }, 10000);

    - name: Add success labels
      if: success()
      uses: actions/github-script@v6
      with:
        script: |
          const issueNumber = '${{ steps.get-issue.outputs.issue_number }}';
          
          console.log(`Adding labels to issue #${issueNumber}`);
          
          await github.rest.issues.addLabels({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: issueNumber,
            labels: ['auto-updated', 'config-complete']
          });
