<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>数学飞车 · 赛博霓虹 (语音鼓励)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a; height: 100vh; display: flex; justify-content: center; align-items: center;
            font-family: 'Segoe UI', 'Arial', sans-serif; padding: 8px; user-select: none;
            touch-action: manipulation; overflow: hidden;
        }
        .game-container {
            width: 100%; max-width: 520px; height: 100%; max-height: 100vh;
            background: rgba(10,10,20,0.8); backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px); border-radius: 28px;
            border: 2px solid rgba(255,150,0,0.5);
            box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 30px #ff5500aa, inset 0 0 20px #ff660033;
            overflow: hidden; position: relative; padding: 12px;
            display: flex; flex-direction: column;
        }
        .game-container::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle at 30% 30%, rgba(255,120,0,0.15), transparent 50%);
            pointer-events: none;
        }
        .top-bar {
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(30,30,40,0.7); backdrop-filter: blur(10px);
            border-radius: 20px; padding: 8px 16px; margin-bottom: 10px;
            border: 1px solid rgba(255,180,0,0.4); color: #ffcc80; font-weight: 700; font-size: 14px;
            z-index: 5; flex-shrink: 0;
        }
        .streak-fire { display: flex; align-items: center; gap: 6px; }
        .streak-days {
            background: linear-gradient(135deg, #ff5500, #ffaa00);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            font-size: 20px; font-weight: 900;
        }
        .hint-badge {
            background: #3a2a40; padding: 4px 12px; border-radius: 30px; font-size: 12px;
            border: 1px solid #ff8800; animation: hintGlow 2s infinite;
        }
        @keyframes hintGlow {
            0%,100% { box-shadow: 0 0 5px #ff8800; }
            50% { box-shadow: 0 0 15px #ffaa00; }
        }
        .garage-btn-top {
            background: linear-gradient(135deg, #9b30ff, #6a0dad); border: none; color: white;
            padding: 6px 14px; border-radius: 30px; font-weight: bold; cursor: pointer;
            box-shadow: 0 0 10px #b366ff; transition: 0.1s; font-size: 13px;
        }
        .garage-btn-top:active { transform: scale(0.95); box-shadow: 0 0 20px #c285ff; }
        .problem-card {
            background: rgba(20,20,30,0.8); backdrop-filter: blur(12px); border-radius: 20px;
            padding: 12px 18px; margin-bottom: 10px; border: 1px solid #ff6600;
            box-shadow: 0 0 20px #ff4400aa; text-align: center; flex-shrink: 0;
        }
        .problem-label { font-size: 12px; color: #ffaa33; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 4px; }
        .problem-equation {
            font-size: 36px; font-weight: 900;
            background: linear-gradient(to right, #ffffff, #ffbb88);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px #ff7700;
        }
        .timer-bar { height: 4px; background: rgba(255,255,255,0.1); border-radius: 4px; margin-top: 8px; overflow: hidden; }
        .timer-fill {
            width: 100%; height: 100%; background: linear-gradient(90deg, #00ff88, #ffcc00, #ff3333);
            transition: width 0.1s linear; border-radius: 4px;
        }
        .score-row {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 10px; flex-shrink: 0;
        }
        .score-badge {
            background: rgba(0,0,0,0.6); border: 1px solid #ffaa00; border-radius: 20px;
            padding: 6px 16px; color: #ffbb33; font-weight: 800; font-size: 18px; backdrop-filter: blur(5px);
        }
        .speed-badge {
            background: #cc3333; color: white; padding: 5px 14px; border-radius: 20px;
            font-weight: 700; font-size: 14px; transition: 0.2s;
        }
        .speed-badge.boost {
            background: #00aa44; animation: boostPulse 0.3s infinite alternate;
        }
        @keyframes boostPulse {
            from { box-shadow: 0 0 5px #00ff88; }
            to { box-shadow: 0 0 25px #00ff88; }
        }
        .finish-btn {
            background: rgba(255,80,0,0.8); backdrop-filter: blur(5px); border: none; color: white;
            padding: 6px 16px; border-radius: 20px; font-weight: bold; font-size: 14px;
            cursor: pointer; transition: 0.1s;
        }
        .finish-btn:active { transform: scale(0.95); }
        .game-area {
            flex: 1; display: flex; flex-direction: column; min-height: 0;
            overflow-y: scroll; scrollbar-width: none; -ms-overflow-style: none;
        }
        .game-area::-webkit-scrollbar { display: none; }
        .canvas-box {
            position: relative; border-radius: 20px; overflow: hidden;
            box-shadow: 0 0 20px #ff4400; border: 2px solid #ff7700;
            margin-bottom: 8px; flex: 1; display: flex; align-items: center;
            justify-content: center; background: #0b0b15; min-height: 200px;
        }
        #gameCanvas {
            display: block; width: 100%; height: auto; max-height: 100%; object-fit: contain;
        }
        .answer-row {
            display: flex; justify-content: center; gap: 12px; padding: 0 4px; flex-shrink: 0;
        }
        .ans-btn {
            flex: 1; background: rgba(20,20,35,0.8); backdrop-filter: blur(8px);
            border: 2px solid #ff9900; border-radius: 16px; color: white;
            font-size: 26px; font-weight: 900; padding: 12px 0; text-align: center;
            cursor: pointer; transition: 0.1s; box-shadow: 0 0 12px #ff8800aa;
        }
        .ans-btn:active { transform: translateY(3px); box-shadow: 0 0 20px #ffaa00; }
        .ans-btn.correct { background: #00cc66; border-color: #00ff88; animation: popCorrect 0.4s; }
        .ans-btn.wrong { background: #ff3333; border-color: #ff8888; animation: shakeWrong 0.4s; }
        @keyframes popCorrect { 0%,100%{transform:scale(1)} 50%{transform:scale(1.2)} }
        @keyframes shakeWrong { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
        .select-screen, .result-screen {
            background: rgba(15,15,25,0.9); backdrop-filter: blur(15px); border-radius: 24px;
            padding: 20px; margin-bottom: 8px; border: 1px solid #ff9500;
            box-shadow: 0 0 30px #ff5500; flex-shrink: 0;
        }
        .bike-preview-large { text-align: center; margin-bottom: 12px; }
        .track-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
            justify-content: center; margin: 12px 0; max-height: 300px;
            overflow-y: auto; padding: 4px;
        }
        .track-item {
            width: 100%; aspect-ratio: 1.6/1; border-radius: 14px; border: 2px solid #444;
            cursor: pointer; transition: all 0.2s; overflow: hidden; position: relative;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5); display: flex; align-items: center;
            justify-content: center; background: #000;
        }
        .track-item canvas { max-width: 100%; max-height: 100%; object-fit: contain; }
        .track-item.selected { border-color: #ffaa00; box-shadow: 0 0 15px #ff7700, 0 0 25px #ff550066; }
        .track-name-overlay {
            position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); color: #fff; font-size: 10px; font-weight: 700;
            padding: 2px 8px; border-radius: 10px; white-space: nowrap; backdrop-filter: blur(4px);
        }
        .start-btn-big {
            width: 100%; padding: 14px; background: linear-gradient(135deg, #ff6600, #ff3300);
            border: none; border-radius: 30px; color: white; font-size: 20px; font-weight: 900;
            box-shadow: 0 0 25px #ff4400; cursor: pointer; letter-spacing: 2px; margin-top: 8px;
        }
        .start-btn-big:active { transform: scale(0.96); }
        .result-score-big {
            font-size: 64px; font-weight: 900;
            background: linear-gradient(to bottom, #ffcc00, #ff5500);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-align: center;
        }
        .modal-panel {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: center; z-index: 200;
        }
        .modal-inner {
            background: #1a1a2e; border: 1px solid #ffaa00; border-radius: 24px;
            padding: 20px; max-width: 420px; width: 90%; max-height: 85vh;
            overflow-y: auto; box-shadow: 0 0 40px #ff6600;
        }
        .hidden { display: none !important; }
        .combo-popup {
            position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%);
            font-size: 42px; font-weight: 900; color: #ffea00;
            text-shadow: 0 0 20px #ffaa00, 0 0 40px #ff6600;
            z-index: 300; pointer-events: none; animation: comboFly 0.8s forwards;
        }
        @keyframes comboFly {
            0%{opacity:0; transform:translate(-50%,0) scale(0.5)}
            40%{opacity:1; transform:translate(-50%,-30px) scale(1.2)}
            100%{opacity:0; transform:translate(-50%,-80px) scale(0.8)}
        }
    </style>
</head>
<body>
<div class="game-container" id="gameContainer">
    <div class="top-bar">
        <div class="streak-fire">🔥 <span class="streak-days" id="streakDays">0</span> 天</div>
        <div class="hint-badge" id="nextUnlockHint">再学3天解锁</div>
        <button class="garage-btn-top" id="garageBtn">🎨 车库</button>
    </div>
    <div class="problem-card" id="problemCard">
        <div class="problem-label">⚡ 当前题目</div>
        <div class="problem-equation" id="problemDisplay">准备出发</div>
        <div class="timer-bar"><div class="timer-fill" id="timerFill" style="width:100%"></div></div>
    </div>
    <div class="score-row">
        <div class="score-badge" id="scoreValue">🏆 0</div>
        <div class="speed-badge" id="speedIndicator">⚡ 60 km/h</div>

    </div>
    <div class="game-area" id="gameArea">
        <div class="canvas-box" id="canvasBox">
            <canvas id="gameCanvas" width="500" height="500"></canvas>
        </div>
        <div class="answer-row hidden" id="answerRow">
            <div class="ans-btn" id="ansBtn0"></div>

            <div class="ans-btn" id="ansBtn2"></div>
        </div>
        <div class="select-screen" id="selectScreen">
            <div class="bike-preview-large">
                <canvas id="pvCanvas" width="140" height="100"></canvas>
                <div style="font-weight: bold; color: #ffbb55;" id="bikeName">烈焰红</div>
            </div>
            <div style="text-align:center;color:#ffcc88; font-size: 16px; font-weight: bold; margin-bottom: 4px;">🛣️ 选择赛道 (30款)</div>
            <div class="track-grid" id="trackGrid"></div>

        </div>
        <div class="result-screen hidden" id="resultScreen">

            <div style="display:flex; justify-content:space-around; margin:16px 0; color:white;">
                <div>✅<span id="corr">0</span></div>
                <div>❌<span id="wro">0</span></div>
                <div>最高连击 <span id="maxComboVal">0</span></div>
                <div>正确率 <span id="acc">0</span>%</div>
            </div>
            <button class="start-btn-big" id="reportBtn">📊 学习报告</button>
            <button class="start-btn-big" style="background:#555; margin-top:8px;" id="playAgainBtn">🔄 再来一局</button>
        </div>
    </div>
</div>

<div class="modal-panel hidden" id="garageModal">
    <div class="modal-inner">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3 style="color:#ffaa00;">🏍️ 战车仓库</h3>
            <button id="closeGarage" style="background:red; border:none; color:white; padding:4px 12px; border-radius:20px;">✕</button>
        </div>
        <div id="garageGrid" style="display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; margin-top:12px;"></div>
    </div>
</div>

<div class="modal-panel hidden" id="reportModal">
    <div class="modal-inner">
        <div style="display:flex; justify-content:space-between;">
            <h3 style="color:#00ff88;">📚 学习报告</h3>
            <button id="closeReport" style="background:red; border:none; color:white; padding:4px 12px; border-radius:20px;">✕</button>
        </div>
        <div id="reportContent" style="color:white; margin:16px 0;"></div>
        <button class="start-btn-big" id="saveReport">📸 保存并分享</button>
    </div>
</div>

<canvas id="particleCanvas" style="position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:400;"></canvas>

<script>
(function() {
    const lighten = (hex, p) => {
        let num = parseInt(hex.slice(1),16), amt = Math.round(2.55 * p);
        return '#' + (0x1000000 + Math.min(255,(num>>16)+amt)*0x10000 + Math.min(255,((num>>8)&0xff)+amt)*0x100 + Math.min(255,(num&0xff)+amt)).toString(16).slice(1);
    };
    const darken = (hex, p) => {
        let num = parseInt(hex.slice(1),16), amt = Math.round(2.55 * p);
        return '#' + (0x1000000 + Math.max(0,(num>>16)-amt)*0x10000 + Math.max(0,((num>>8)&0xff)-amt)*0x100 + Math.max(0,(num&0xff)-amt)).toString(16).slice(1);
    };

    // 音频引擎
    let audioCtx, engineOsc, engineGain, engineOn = false;
    function initAudio() { if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }
    function startEngine() {
        if(!audioCtx) initAudio();
        if(!audioCtx||engineOn) return;
        if(audioCtx.state==='suspended') audioCtx.resume();
        engineOsc = audioCtx.createOscillator(); engineGain = audioCtx.createGain();
        engineOsc.type='sawtooth'; engineOsc.frequency.value=80; engineGain.gain.value=0.04;
        engineOsc.connect(engineGain); engineGain.connect(audioCtx.destination);
        engineOsc.start(); engineOn = true;
    }
    function updateEngine(speed) {
        if(!engineOsc) return;
        engineOsc.frequency.setTargetAtTime(70+speed*1.8,audioCtx.currentTime,0.1);
        engineGain.gain.setTargetAtTime(0.02+speed*0.002,audioCtx.currentTime,0.1);
    }
    function stopEngine() { if(engineOsc){ engineOsc.stop(); engineOsc.disconnect(); engineOsc=null; engineGain.disconnect(); engineGain=null; engineOn=false; } }
    function playSfx(type) {
        if(!audioCtx) return;
        if(audioCtx.state==='suspended') audioCtx.resume();
        let o=audioCtx.createOscillator(), g=audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination);
        if(type==='correct'){ o.frequency.value=1200; g.gain.setValueAtTime(0.2,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.12); }
        else if(type==='wrong'){ o.frequency.value=250; g.gain.setValueAtTime(0.25,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.2); }
        o.start(); o.stop(audioCtx.currentTime+0.2);
    }

    // 语音播报（使用 Web Speech API）
    function speak(text) {
        if (!window.speechSynthesis) return;
        // 取消之前未播放的语音，避免堆积
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-CN';
        utterance.rate = 0.9;   // 语速稍慢，更清晰
        utterance.pitch = 1.1;
        utterance.volume = 1;
        window.speechSynthesis.speak(utterance);
    }

    // 粒子系统
    const particleCanvas = document.getElementById('particleCanvas'), pctx = particleCanvas.getContext('2d');
    function resizePCanvas() { particleCanvas.width = window.innerWidth; particleCanvas.height = window.innerHeight; }
    window.addEventListener('resize', resizePCanvas); resizePCanvas();
    let particles = [];
    function spawnParticles(x,y,count,color) {
        for(let i=0;i<count;i++) particles.push({x,y,vx:(Math.random()-0.5)*8, vy:(Math.random()-0.5)*8-2, life:1, decay:0.02+Math.random()*0.04, size:2+Math.random()*4, color});
    }
    function updateParticles() {
        pctx.clearRect(0,0,particleCanvas.width,particleCanvas.height);
        for(let i=particles.length-1;i>=0;i--) {
            let p=particles[i]; p.x+=p.vx; p.y+=p.vy; p.life-=p.decay;
            if(p.life<=0){ particles.splice(i,1); continue; }
            pctx.globalAlpha=p.life; pctx.fillStyle=p.color;
            pctx.beginPath(); pctx.arc(p.x,p.y,p.size,0,Math.PI*2); pctx.fill();
        }
        pctx.globalAlpha=1;
        requestAnimationFrame(updateParticles);
    }
    updateParticles();

    function showComboPopup(text) {
        let el=document.createElement('div'); el.className='combo-popup'; el.textContent=text;
        document.body.appendChild(el); setTimeout(()=>el.remove(), 800);
    }

    // 车辆皮肤数据
    const BIKE_SKINS = [
        { id:0, name:'烈焰红', color:'#ff3333', accent:'#cc0000', unlocked:true },
        { id:1, name:'闪电蓝', color:'#3399ff', accent:'#0055cc', unlocked:true },
        { id:2, name:'丛林绿', color:'#33cc33', accent:'#228822', unlocked:true },
        ...Array.from({length:27}, (_,i)=>{
            let cols = ['#ff8800','#aa44ff','#00dddd','#ffcc00','#ff2266','#44aaff','#cc66ff','#ff5500','#44dd44','#ffee00','#555577','#ff66aa'];
            let names = ['极速','风暴','幻影','雷霆','暗夜','星光','狂野','冰霜','熔岩','黄金','黑武士','樱花'];
            return { id:i+3, name:names[i%12]+(Math.floor(i/12)+1), color:cols[i%cols.length], accent:darken(cols[i%cols.length],30), unlocked:false };
        })
    ];
    // 30款赛道数据
    const TRACKS = [
        { id:0, name:'城市', road:'#3a3a4a', line:'#00ffff', curb1:'#ff00ff', curb2:'#cc00cc', bg:'#0a0a1a', bgDetail:'#1a1a2e' },
        { id:1, name:'沙漠', road:'#8B7355', line:'#FFD700', curb1:'#e67e22', curb2:'#d35400', bg:'#D2A645', bgDetail:'#c49535' },
        { id:2, name:'海洋', road:'#2F4F4F', line:'#00ccff', curb1:'#3498db', curb2:'#2980b9', bg:'#1a3a5c', bgDetail:'#0d2847' },
        { id:3, name:'雪山', road:'#8899aa', line:'#ffffff', curb1:'#aaccff', curb2:'#8899cc', bg:'#d0d8e0', bgDetail:'#b0c0d0' },
        { id:4, name:'森林', road:'#2a3a1a', line:'#88dd44', curb1:'#228822', curb2:'#1a6b1a', bg:'#0a1a0a', bgDetail:'#1a3a1a' },
        { id:5, name:'赛博', road:'#1a1a2e', line:'#ff00ff', curb1:'#00ffff', curb2:'#ff00aa', bg:'#050515', bgDetail:'#0a0a1a' },
        { id:6, name:'火山', road:'#3a1a0a', line:'#ff5500', curb1:'#ff0000', curb2:'#cc0000', bg:'#2a0a0a', bgDetail:'#3a1a1a' },
        { id:7, name:'星空', road:'#1a1a3e', line:'#FFD700', curb1:'#9b59b6', curb2:'#3498db', bg:'#06061a', bgDetail:'#0a0a2a' },
        { id:8, name:'糖果', road:'#ff85a2', line:'#ffffff', curb1:'#ff6b9d', curb2:'#ff477e', bg:'#ffc8dd', bgDetail:'#ffb3c6' },
        { id:9, name:'霓虹', road:'#2a2a4a', line:'#ff88ff', curb1:'#ff4444', curb2:'#ff8844', bg:'#0f0f2a', bgDetail:'#1a1a3a' },
        { id:10, name:'地狱', road:'#4a1a1a', line:'#ff3333', curb1:'#ff6600', curb2:'#ff0000', bg:'#1a0000', bgDetail:'#2a0000' },
        { id:11, name:'极光', road:'#1a3a4a', line:'#00ffaa', curb1:'#33ffcc', curb2:'#00aaaa', bg:'#051a2a', bgDetail:'#0a2a3a' },
        { id:12, name:'水晶', road:'#4a3a5a', line:'#ffccff', curb1:'#cc88ff', curb2:'#aa44ff', bg:'#1a0a2a', bgDetail:'#2a1a3a' },
        { id:13, name:'火焰', road:'#5a2a0a', line:'#ffaa00', curb1:'#ff5500', curb2:'#ff0000', bg:'#1a0a00', bgDetail:'#2a1a0a' },
        { id:14, name:'翡翠', road:'#1a4a3a', line:'#88ff88', curb1:'#22cc66', curb2:'#118844', bg:'#0a1a0a', bgDetail:'#0a2a1a' },
        { id:15, name:'紫晶', road:'#3a2a5a', line:'#dd88ff', curb1:'#aa44ff', curb2:'#8822cc', bg:'#1a0a2a', bgDetail:'#2a1a3a' },
        { id:16, name:'机械', road:'#3a3a3a', line:'#aaaaaa', curb1:'#666666', curb2:'#999999', bg:'#1a1a1a', bgDetail:'#2a2a2a' },
        { id:17, name:'蒸汽', road:'#5a4a3a', line:'#ccaa88', curb1:'#aa8855', curb2:'#886644', bg:'#2a1a0a', bgDetail:'#3a2a1a' },
        { id:18, name:'海底', road:'#1a3a4a', line:'#44ddff', curb1:'#2288cc', curb2:'#1166aa', bg:'#051a2a', bgDetail:'#0a2a3a' },
        { id:19, name:'云端', road:'#aaccdd', line:'#ffffff', curb1:'#88bbcc', curb2:'#aaddff', bg:'#d0e0f0', bgDetail:'#c0d0e0' },
        { id:20, name:'糖果乐园', road:'#ffaacc', line:'#ffddff', curb1:'#ff88bb', curb2:'#ff66aa', bg:'#ffd0e0', bgDetail:'#ffc0d0' },
        { id:21, name:'次元', road:'#3a3a6a', line:'#ff88ff', curb1:'#aa44ff', curb2:'#6600cc', bg:'#1a1a3a', bgDetail:'#2a2a4a' },
        { id:22, name:'落日', road:'#5a3a2a', line:'#ffaa44', curb1:'#ff6600', curb2:'#cc4400', bg:'#3a1a0a', bgDetail:'#4a2a1a' },
        { id:23, name:'夜幕', road:'#1a1a2a', line:'#4466ff', curb1:'#2244cc', curb2:'#1133aa', bg:'#0a0a1a', bgDetail:'#15152a' },
        { id:24, name:'晨曦', road:'#4a3a4a', line:'#ffaaff', curb1:'#ff88cc', curb2:'#cc66aa', bg:'#2a1a2a', bgDetail:'#3a2a3a' },
        { id:25, name:'风暴', road:'#3a4a4a', line:'#aaccff', curb1:'#6688cc', curb2:'#4466aa', bg:'#1a2a2a', bgDetail:'#2a3a3a' },
        { id:26, name:'樱花', road:'#ffaabb', line:'#ffccdd', curb1:'#ff8899', curb2:'#cc6677', bg:'#ffd0dd', bgDetail:'#ffc0cc' },
        { id:27, name:'像素', road:'#4a5a4a', line:'#88ff88', curb1:'#44cc44', curb2:'#228822', bg:'#1a2a1a', bgDetail:'#2a3a2a' },
        { id:28, name:'钻石', road:'#aaccdd', line:'#ffffff', curb1:'#eeeeff', curb2:'#ccccff', bg:'#e0e8f0', bgDetail:'#d0d8e0' },
        { id:29, name:'彩虹', road:'#ff8888', line:'#ffff88', curb1:'#88ff88', curb2:'#8888ff', bg:'#ffccff', bgDetail:'#ffaacc' }
    ];

    let streak = { days:0, lastDate:null };
    function loadStreak() {
        try{ let s=localStorage.getItem('mb_streak'); if(s) streak=JSON.parse(s); }catch(e){}
        let today=new Date().toDateString();
        if(streak.lastDate!==today){
            let last = streak.lastDate ? new Date(streak.lastDate) : null;
            if(last && (new Date()-last)/864e5>1) streak.days=0;
            streak.lastDate=today;
            localStorage.setItem('mb_streak', JSON.stringify(streak));
        }
        updateStreakUI(); applyStreakUnlocks();
    }
    function incStreak() {
        let today=new Date().toDateString();
        if(streak.lastDate!==today){
            let last=streak.lastDate?new Date(streak.lastDate):null;
            if(last&&(new Date()-last)/864e5<2) streak.days++; else streak.days=1;
            streak.lastDate=today;
            localStorage.setItem('mb_streak', JSON.stringify(streak));
            applyStreakUnlocks();
        }
        updateStreakUI();
    }
    function updateStreakUI() {
        document.getElementById('streakDays').textContent = streak.days;
        let d=streak.days, hint = d<3?`再学${3-d}天解锁`: d<7?`再学${7-d}天解锁更多`:'已解锁大量皮肤';
        document.getElementById('nextUnlockHint').textContent = hint;
    }
    function applyStreakUnlocks() {
        let d=streak.days, unlock=0;
        if(d>=3) unlock=5; if(d>=7) unlock=15; if(d>=14) unlock=27;
        let cnt=0;
        BIKE_SKINS.forEach(s=>{ if(s.id>=3&&!s.unlocked&&cnt<unlock){ s.unlocked=true; cnt++; } });
        if(cnt>0) saveUnlocks();
    }
    function saveUnlocks() {
        let ids=BIKE_SKINS.filter(s=>s.unlocked).map(s=>s.id);
        localStorage.setItem('mb_unlocked', JSON.stringify(ids));
    }
    function loadUnlocks() {
        try{
            let ids=JSON.parse(localStorage.getItem('mb_unlocked'));
            if(!Array.isArray(ids)) ids=[];
            [0,1,2].forEach(id=>{ if(!ids.includes(id)) ids.push(id); });
            BIKE_SKINS.forEach(s=>s.unlocked=ids.includes(s.id));
        }catch(e){ BIKE_SKINS.forEach(s=>s.unlocked=s.id<3); }
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const CW = 500, CH = 500;
    let gameActive=false, currentBike=0, currentTrack=0;
    let score=0, correct=0, wrong=0, combo=0, maxCombo=0;
    let playerSpeed=60, boostTimer=0, roadOffset=0;
    let problem=null, countdown=10;
    let racers=[], animFrame=null;

    const ROAD_L=110, ROAD_R=390, ROAD_W=280, LANE_W=ROAD_W/3;
    const LANE_C=[ROAD_L+LANE_W/2, ROAD_L+1.5*LANE_W, ROAD_L+2.5*LANE_W];
    const PLAYER_Y = CH * 0.82;

    function drawCheeringFans() {
        const fanSpacing = 70, fanOffset = roadOffset % fanSpacing;
        const leftX = ROAD_L - 25, rightX = ROAD_R + 25;
        const swingAngle = Math.sin(Date.now() * 0.01) * 0.3;
        for (let y = -fanSpacing; y < CH + fanSpacing; y += fanSpacing) {
            drawFan(ctx, leftX, y + fanOffset, swingAngle, true);
            drawFan(ctx, rightX, y + fanOffset, swingAngle, false);
        }
    }
    function drawFan(ctx, x, y, angle, leftSide) {
        ctx.save(); ctx.translate(x, y);
        ctx.fillStyle = '#ffcc88'; ctx.fillRect(-4, 0, 8, 15);
        ctx.beginPath(); ctx.arc(0, -5, 6, 0, Math.PI * 2); ctx.fillStyle = '#ffddbb'; ctx.fill();
        ctx.fillStyle = '#e74c3c'; ctx.fillRect(-6, -12, 12, 4); ctx.fillRect(-4, -16, 8, 4);
        ctx.strokeStyle = '#8B4513'; ctx.lineWidth = 1.5;
        const flagX = leftSide ? 10 : -10;
        ctx.beginPath(); ctx.moveTo(4, -8); ctx.lineTo(flagX, -16); ctx.stroke();
        ctx.save(); ctx.translate(flagX, -16); ctx.rotate(leftSide ? angle : -angle);
        ctx.fillStyle = '#ff4444'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(12,-4); ctx.lineTo(12,4); ctx.closePath(); ctx.fill();
        ctx.restore();
        ctx.fillStyle = '#ffcc88'; ctx.fillRect(leftSide ? 6 : -10, -6, 4, 6);
        ctx.restore();
    }

    function genProblem() {
        let fns = [
            ()=>{ let a=10+Math.random()*90|0, b=Math.random()*(100-a)|0; return {q:`${a}+${b}=?`, a:a+b, w:[a+b+5, a+b-3]}; },
            ()=>{ let a=10+Math.random()*90|0, b=Math.random()*a|0; return {q:`${a}-${b}=?`, a:a-b, w:[a-b+4, a-b-2]}; },
            ()=>{ let a=2+Math.random()*8|0, b=2+Math.random()*8|0; return {q:`${a}×${b}=?`, a:a*b, w:[a*b+3, a*b-2]}; },
            ()=>{ let b=2+Math.random()*7|0, a=b*(2+Math.random()*8|0); return {q:`${a}÷${b}=?`, a:a/b, w:[a/b+2, a/b-1]}; }
        ];
        return fns[Math.random()*4|0]();
    }

    function drawBike(c, x, y, color, accent, scale, isPlayer, speed) {
        c.save(); c.translate(x,y); c.scale(scale,scale);
        let lc=lighten(color,30), dc=darken(color,30);
        if(isPlayer&&speed>50){
            c.fillStyle=`rgba(255,150,0,${0.2+speed/300})`;
            c.beginPath(); c.ellipse(-2,28,6,14+speed*0.2,0,0,Math.PI*2); c.fill();
        }
        let grad=c.createLinearGradient(-10,-18,10,18);
        grad.addColorStop(0,lc); grad.addColorStop(0.5,color); grad.addColorStop(1,dc);
        c.fillStyle=grad;
        c.beginPath(); c.moveTo(-7,-16); c.lineTo(7,-16); c.lineTo(11,0); c.lineTo(9,14); c.lineTo(-9,14); c.lineTo(-11,0); c.closePath(); c.fill();
        c.fillStyle='rgba(255,255,255,0.3)'; c.beginPath(); c.ellipse(-3,-6,4,8,-0.2,0,Math.PI*2); c.fill();
        c.fillStyle='#222'; c.beginPath(); c.ellipse(0,24,7,11,0,0,Math.PI*2); c.fill();
        c.fillStyle='#444'; c.beginPath(); c.ellipse(0,24,4,7,0,0,Math.PI*2); c.fill();
        c.fillStyle='#222'; c.beginPath(); c.ellipse(0,-24,7,11,0,0,Math.PI*2); c.fill();
        c.fillStyle='#444'; c.beginPath(); c.ellipse(0,-24,4,7,0,0,Math.PI*2); c.fill();
        c.strokeStyle='#aaa'; c.lineWidth=1.5;
        for(let i=0;i<4;i++){ let ang=(Date.now()*0.01+i*1.57); c.beginPath(); c.moveTo(0,24); c.lineTo(5*Math.cos(ang),24+5*Math.sin(ang)); c.stroke(); }
        c.strokeStyle=accent; c.lineWidth=2.5;
        c.beginPath(); c.moveTo(-4,-16); c.lineTo(-3,-26); c.stroke();
        c.beginPath(); c.moveTo(4,-16); c.lineTo(3,-26); c.stroke();
        if(isPlayer){ c.fillStyle='#ffdd00'; c.beginPath(); c.arc(0,-20,7,0,Math.PI*2); c.fill(); c.fillStyle='#222'; c.beginPath(); c.arc(0,-20,5,0,Math.PI*2); c.fill(); }
        c.restore();
    }

    function drawScene() {
        let t=TRACKS[currentTrack];
        ctx.fillStyle=t.bg; ctx.fillRect(0,0,CW,CH);
        ctx.fillStyle=t.bgDetail;
        ctx.beginPath(); ctx.moveTo(0,CH*0.6);
        for(let x=0;x<=CW;x+=40) ctx.lineTo(x, CH*0.55+Math.sin(x*0.02+roadOffset*0.05)*15);
        ctx.lineTo(CW,CH); ctx.lineTo(0,CH); ctx.closePath(); ctx.fill();
        for(let i=0;i<60;i++){
            let sx=(i*37+roadOffset*0.2)%CW, sy=(i*53+Date.now()*0.01)%CH;
            ctx.fillStyle=`rgba(255,255,255,${0.3+Math.sin(i+Date.now()*0.01)*0.2})`;
            ctx.beginPath(); ctx.arc(sx,sy,1,0,Math.PI*2); ctx.fill();
        }
        ctx.strokeStyle=t.line; ctx.lineWidth=1; ctx.setLineDash([20,40]); ctx.lineDashOffset=-roadOffset*2;
        ctx.beginPath(); ctx.moveTo(0,CH*0.5); ctx.lineTo(CW,CH*0.5); ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle=t.road; ctx.fillRect(ROAD_L,0,ROAD_W,CH);
        let bw=8, bh=18, off=roadOffset%(bh*2);
        for(let y=-bh;y<CH+bh;y+=bh){
            let idx=Math.floor((y+roadOffset)/bh)%2;
            ctx.fillStyle=idx===0?t.curb1:t.curb2;
            ctx.fillRect(ROAD_L-bw,y+off,bw,bh); ctx.fillRect(ROAD_R,y+off,bw,bh);
        }
        ctx.strokeStyle=t.line; ctx.lineWidth=2; ctx.setLineDash([25,20]); ctx.lineDashOffset=-roadOffset;
        ctx.beginPath(); ctx.moveTo(ROAD_L+LANE_W,0); ctx.lineTo(ROAD_L+LANE_W,CH); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(ROAD_L+2*LANE_W,0); ctx.lineTo(ROAD_L+2*LANE_W,CH); ctx.stroke();
        ctx.setLineDash([]);
        drawCheeringFans();
    }

    function drawRacersAll() {
        let sorted=[...racers].sort((a,b)=>a.screenY-b.screenY);
        sorted.forEach(r=>{
            let rel=r.progress-racers[0].progress, sy=PLAYER_Y-rel*100, sx=LANE_C[r.lane];
            r.screenY=sy; if(sy<-60||sy>CH+60) return;
            let s=0.55+Math.min(1,Math.max(0,(sy+60)/(CH+120)))*0.5;
            drawBike(ctx,sx,sy,BIKE_SKINS[r.skinId].color,BIKE_SKINS[r.skinId].accent,s,r.isPlayer,r.speed||0);
            let rank=[...racers].sort((a,b)=>b.progress-a.progress).findIndex(v=>v===r)+1;
            ctx.fillStyle=r.isPlayer?'#ffdd00':'#fff'; ctx.font='bold 12px sans-serif'; ctx.textAlign='center';
            ctx.fillText(`#${rank}`,sx,sy-28*s);
        });
    }

    function updateRacers() {
        if(!gameActive) return;
        if(boostTimer>0){ boostTimer--; playerSpeed=Math.min(playerSpeed+2,130); }
        else playerSpeed=Math.max(playerSpeed-1,40);
        updateEngine(playerSpeed);
        racers.forEach((r,i)=>{
            if(i===0){ r.speed=playerSpeed; r.progress+=r.speed*0.001; }
            else{
                r.aiTimer=(r.aiTimer||0)+1;
                if(r.aiTimer>60+i*20){ r.targetSpeed=50+Math.random()*40; r.aiTimer=0; }
                r.speed+=(r.targetSpeed-r.speed)*0.02;
                r.progress+=r.speed*0.001;
            }
            r.progress=Math.min(r.progress,100);
        });
        roadOffset=(roadOffset+playerSpeed*0.4)%40;
        if(racers.some(r=>r.progress>=100)) finishGame();
    }

    function gameLoop() {
        if(!gameActive) return;
        updateRacers();
        if(problem&&countdown>0){ countdown-=1/60; updateTimer(); if(countdown<=0){ wrong++; combo=0; nextProblem(); } }
        drawScene(); drawRacersAll();
        animFrame=requestAnimationFrame(gameLoop);
    }

    function updateTimer(){ document.getElementById('timerFill').style.width=Math.max(0,(countdown/10)*100)+'%'; }
    function nextProblem() {
        if(!gameActive) return;
        problem=genProblem(); countdown=10; updateTimer();
        document.getElementById('problemDisplay').textContent=problem.q;
        let arr=[problem.a,problem.w[0],problem.w[1]];
        for(let i=arr.length-1;i>0;i--){ let j=Math.random()*i|0; [arr[i],arr[j]]=[arr[j],arr[i]]; }
        for(let i=0;i<3;i++){ let btn=document.getElementById('ansBtn'+i); btn.textContent=arr[i]; btn.className='ans-btn'; }
        document.getElementById('answerRow').classList.remove('hidden');
    }

    function answerClick(idx) {
        if(!problem||!gameActive) return;
        let btn=document.getElementById('ansBtn'+idx), val=Number(btn.textContent), correctAns=val===problem.a;
        if(correctAns){
            btn.classList.add('correct'); playSfx('correct'); correct++; combo++;
            if(combo>maxCombo) maxCombo=combo; score+=10+combo*2; boostTimer=50;
            let rect=btn.getBoundingClientRect();
            spawnParticles(rect.left+rect.width/2,rect.top+rect.height/2,20,'#ffaa00');
            if(combo%5===0) showComboPopup(`🔥 ${combo}连击！`);
            // 正确语音鼓励
            speak('你真棒，真牛比');
        } else {
            btn.classList.add('wrong'); playSfx('wrong'); wrong++; combo=0;
            let rect=btn.getBoundingClientRect();
            spawnParticles(rect.left+rect.width/2,rect.top+rect.height/2,10,'#ff3333');
            // 错误语音提示
            speak('答错了，请加油');
        }
        updateScoreUI();
        setTimeout(()=>{ if(gameActive) nextProblem(); },350);
    }

    function updateScoreUI() {
        document.getElementById('scoreValue').textContent='🏆 '+score;
        document.getElementById('speedIndicator').textContent='⚡ '+Math.round(playerSpeed)+' km/h';
        let sp=document.getElementById('speedIndicator');
        if(boostTimer>0) sp.classList.add('boost'); else sp.classList.remove('boost');
    }

    function startGame() {
        gameActive=true; score=0; correct=0; wrong=0; combo=0; maxCombo=0; playerSpeed=60; boostTimer=0; roadOffset=0;
        incStreak(); initAudio(); startEngine();
        racers=[
            {lane:1, progress:0, speed:60, skinId:currentBike, isPlayer:true},
            {lane:0, progress:0, speed:35, skinId:1, isPlayer:false, targetSpeed:35, aiTimer:0},
            {lane:2, progress:0, speed:32, skinId:2, isPlayer:false, targetSpeed:32, aiTimer:0}
        ];
        document.getElementById('selectScreen').classList.add('hidden');
        document.getElementById('resultScreen').classList.add('hidden');
        document.getElementById('answerRow').classList.remove('hidden');
        updateScoreUI(); nextProblem(); gameLoop();
    }

    function finishGame() {
        gameActive=false; stopEngine(); cancelAnimationFrame(animFrame);
        document.getElementById('answerRow').classList.add('hidden');
        let total=correct+wrong, acc=total?Math.round(correct/total*100):0;
        let sorted=[...racers].sort((a,b)=>b.progress-a.progress);
        let rank=sorted.findIndex(r=>r.isPlayer)+1;
        document.getElementById('finalScore').textContent=score;
        document.getElementById('rankText').textContent=rank===1?'🏆 第一名！': rank===2?'🥈 第二名':'🥉 第三名';
        document.getElementById('corr').textContent=correct; document.getElementById('wro').textContent=wrong;
        document.getElementById('maxComboVal').textContent=maxCombo; document.getElementById('acc').textContent=acc;
        document.getElementById('resultScreen').classList.remove('hidden');
    }

    function renderGarage() {
        let grid=document.getElementById('garageGrid'); grid.innerHTML='';
        BIKE_SKINS.forEach(s=>{
            let d=document.createElement('div'); d.style.textAlign='center';
            let c=document.createElement('canvas'); c.width=70; c.height=50;
            let ctx2=c.getContext('2d'); drawBike(ctx2,35,25,s.color,s.accent,0.5,false,0);
            d.appendChild(c);
            let nm=document.createElement('div'); nm.textContent=s.name; nm.style.color='#ccc'; nm.style.fontSize='10px'; d.appendChild(nm);
            if(!s.unlocked){ d.style.opacity='0.4'; d.style.filter='grayscale(1)'; }
            if(s.id===currentBike) d.style.border='2px solid #ffaa00';
            d.onclick=()=>{
                if(!s.unlocked){ spawnParticles(window.innerWidth/2, window.innerHeight/2, 8, '#ff0000'); return; }
                currentBike=s.id; renderGarage(); updatePreview();
            };
            grid.appendChild(d);
        });
    }

    function updatePreview() {
        let c=document.getElementById('pvCanvas'), ctx2=c.getContext('2d');
        ctx2.clearRect(0,0,140,100);
        let s=BIKE_SKINS[currentBike]; drawBike(ctx2,70,50,s.color,s.accent,0.9,true,0);
        document.getElementById('bikeName').textContent=s.name;
    }

    function renderTracks() {
        let g=document.getElementById('trackGrid'); g.innerHTML='';
        TRACKS.forEach(t=>{
            let d=document.createElement('div'); d.className='track-item' + (t.id===currentTrack?' selected':'');
            let can=document.createElement('canvas'); can.width=70; can.height=44;
            let cc=can.getContext('2d');
            cc.fillStyle=t.bg; cc.fillRect(0,0,70,44);
            cc.fillStyle=t.bgDetail; cc.fillRect(0,25,70,19);
            cc.fillStyle=t.road; cc.fillRect(15,0,40,44);
            cc.fillStyle=t.curb1; cc.fillRect(10,0,5,44);
            cc.fillStyle=t.curb2; cc.fillRect(55,0,5,44);
            cc.strokeStyle=t.line; cc.lineWidth=1.5; cc.setLineDash([8,6]);
            cc.beginPath(); cc.moveTo(35,0); cc.lineTo(35,44); cc.stroke();
            cc.setLineDash([]);
            d.appendChild(can);
            let name=document.createElement('div'); name.className='track-name-overlay'; name.textContent=t.name;
            d.appendChild(name);
            d.onclick=()=>{ currentTrack=t.id; renderTracks(); };
            g.appendChild(d);
        });
    }

    document.getElementById('startBtn').onclick=startGame;
    document.getElementById('finishBtn').onclick=finishGame;
    document.getElementById('playAgainBtn').onclick=()=>{ document.getElementById('resultScreen').classList.add('hidden'); document.getElementById('selectScreen').classList.remove('hidden'); };
    document.getElementById('reportBtn').onclick=()=>{
        let total=correct+wrong, acc=total?Math.round(correct/total*100):0;
        document.getElementById('reportContent').innerHTML=`<p>总分: ${score}</p><p>正确: ${correct} | 错误: ${wrong}</p><p>正确率: ${acc}% | 最高连击: ${maxCombo}</p>`;
        document.getElementById('reportModal').classList.remove('hidden');
    };
    document.getElementById('closeReport').onclick=()=>document.getElementById('reportModal').classList.add('hidden');
    document.getElementById('saveReport').onclick=()=>{ spawnParticles(window.innerWidth/2,window.innerHeight/2,30,'#00ff88'); };
    document.getElementById('garageBtn').onclick=()=>{ renderGarage(); document.getElementById('garageModal').classList.remove('hidden'); };
    document.getElementById('closeGarage').onclick=()=>document.getElementById('garageModal').classList.add('hidden');
    for(let i=0;i<3;i++) document.getElementById('ansBtn'+i).onclick=()=>answerClick(i);

    window.onload=()=>{
        loadStreak(); loadUnlocks(); renderTracks(); updatePreview();
    };
})();
</script>
