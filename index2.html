<div id="app">
  <div class="container" style="text-align: center; padding-top: 100px;">

<script>
// ==================== 全局变量和工具函数 ====================
let supabaseClient = null;
let currentUserId = null;
let weightChartInstance = null;
function formatYMD(date) {
  const d = new Date(date);
  return d.toISOString().slice(0, 10);
}
function parseDateInput(str) {
  if (!str) return null;
  const cleaned = str.trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(cleaned)) return cleaned;
  const digits = cleaned.replace(/\D/g, '');
  if (digits.length === 8) return `${digits.slice(0,4)}-${digits.slice(4,6)}-${digits.slice(6,8)}`;
  return null;
}
function getDateRange(start, end) {
  const dates = [];
  let cur = new Date(start);
  const endDate = new Date(end);
  while (cur <= endDate) {
    dates.push(formatYMD(cur));
    cur.setDate(cur.getDate() + 1);
  }
  return dates;
}
// 绘制三个全身卡通小孩（体重异常弹窗用）
function drawFullBodyKids(ctx, canvasWidth, canvasHeight) {
  const baseY = 180;
  const heights = [60, 50, 40];
  const xPos = [canvasWidth/2 - 110, canvasWidth/2, canvasWidth/2 + 110];
  for (let i = 0; i < 3; i++) {
    const x = xPos[i];
    const yBodyTop = baseY - heights[i];
    const bodyHeight = heights[i];
    const gender = i === 0 ? 'girl' : (i === 1 ? 'boy' : 'girl');
    const headRadius = bodyHeight * 0.35;
    const headY = yBodyTop - headRadius;
    ctx.fillStyle = '#FDD7A4';
    ctx.beginPath(); ctx.rect(x - bodyHeight*0.25, yBodyTop, bodyHeight*0.5, bodyHeight); ctx.fill();
    ctx.strokeStyle = '#D6A57E'; ctx.stroke();
    ctx.beginPath(); ctx.arc(x, headY, headRadius, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#5C3E1F';
    ctx.beginPath(); ctx.ellipse(x - headRadius*0.35, headY - headRadius*0.2, headRadius*0.2, headRadius*0.1, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x + headRadius*0.35, headY - headRadius*0.2, headRadius*0.2, headRadius*0.1, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x, headY + headRadius*0.2, headRadius*0.3, 0.05, Math.PI - 0.05);
    ctx.strokeStyle = '#B95C2E'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#FFB7B2';
    ctx.beginPath(); ctx.arc(x - headRadius*0.5, headY + headRadius*0.1, headRadius*0.12, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + headRadius*0.5, headY + headRadius*0.1, headRadius*0.12, 0, Math.PI*2); ctx.fill();
    if (gender === 'girl') {
      ctx.fillStyle = '#FF69B4';
      ctx.beginPath();
      ctx.moveTo(x - headRadius*0.4, headY - headRadius*0.8);
      ctx.quadraticCurveTo(x, headY - headRadius*1.1, x + headRadius*0.4, headY - headRadius*0.8);
      ctx.fill();
      ctx.fillStyle = '#FFB6C1';
      ctx.beginPath();
      ctx.moveTo(x - bodyHeight*0.3, yBodyTop + bodyHeight*0.8);
      ctx.lineTo(x, yBodyTop + bodyHeight);
      ctx.lineTo(x + bodyHeight*0.3, yBodyTop + bodyHeight*0.8);
      ctx.fill();
    } else {
      ctx.fillStyle = '#5D4037';
      ctx.beginPath(); ctx.rect(x - headRadius*0.45, headY - headRadius*0.9, headRadius*0.9, headRadius*0.25); ctx.fill();
      ctx.fillStyle = '#8B4513';
      ctx.beginPath(); ctx.rect(x - bodyHeight*0.3, yBodyTop + bodyHeight*0.6, bodyHeight*0.6, bodyHeight*0.2); ctx.fill();
    }
    ctx.beginPath(); ctx.moveTo(x - bodyHeight*0.3, yBodyTop + bodyHeight*0.2); ctx.lineTo(x - bodyHeight*0.5, yBodyTop + bodyHeight*0.5); ctx.lineTo(x - bodyHeight*0.3, yBodyTop + bodyHeight*0.4); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x + bodyHeight*0.3, yBodyTop + bodyHeight*0.2); ctx.lineTo(x + bodyHeight*0.5, yBodyTop + bodyHeight*0.5); ctx.lineTo(x + bodyHeight*0.3, yBodyTop + bodyHeight*0.4); ctx.fill();
    ctx.fillStyle = '#FDD7A4';
    ctx.beginPath(); ctx.moveTo(x - bodyHeight*0.2, yBodyTop + bodyHeight); ctx.lineTo(x - bodyHeight*0.3, yBodyTop + bodyHeight + 15); ctx.lineTo(x, yBodyTop + bodyHeight); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x + bodyHeight*0.2, yBodyTop + bodyHeight); ctx.lineTo(x + bodyHeight*0.3, yBodyTop + bodyHeight + 15); ctx.lineTo(x, yBodyTop + bodyHeight); ctx.fill();
  }
}
function showWeightAnomalyModal() {
  const modalDiv = document.createElement('div');
  modalDiv.className = 'mask show';
  modalDiv.innerHTML = `
    <div class="panel" style="position: relative;">
      <button class="close-modal">&times;</button>
      <canvas id="animeCanvas" width="500" height="280" style="width:100%; height:auto; max-width:500px; aspect-ratio:500/280;"></canvas>
      <div class="modal-caption">🎈 你没瘦，又胖了，哈哈… 🎈</div>
      <button class="btn btn-primary" style="margin-top:20px;" id="closeAnimeModal">知道啦 😅</button>
    </div>
  `;
  document.body.appendChild(modalDiv);
  const canvas = modalDiv.querySelector('#animeCanvas');
  const ctx = canvas.getContext('2d');
  drawFullBodyKids(ctx, canvas.width, canvas.height);
  const closeBtn = modalDiv.querySelector('.close-modal');
  const closeBtn2 = modalDiv.querySelector('#closeAnimeModal');
  const closeModal = () => modalDiv.remove();
  closeBtn.onclick = closeModal;
  closeBtn2.onclick = closeModal;
  modalDiv.onclick = (e) => { if (e.target === modalDiv) closeModal(); };
}

// ==================== 增强版周期总结 ====================
function generateEnhancedSummary(plan, timeline) {
  const records = timeline.filter(t => t.weight !== null);
  if (records.length === 0) return null;
  
  const weights = records.map(r => r.weight);
  const dates = records.map(r => r.date);
  const firstWeight = weights[0];
  const lastWeight = weights[weights.length - 1];
  const totalChange = lastWeight - firstWeight;
  const avgWeight = weights.reduce((a,b) => a+b, 0) / weights.length;
  const minWeight = Math.min(...weights);
  const maxWeight = Math.max(...weights);
  
  // 反弹次数（较前一天增重）
  let reboundCount = 0;
  for (let i = 1; i < weights.length; i++) {
    if (weights[i] > weights[i-1]) reboundCount++;
  }
  
  // 连续下降最长天数
  let longestStreak = 0;
  let currentStreak = 0;
  for (let i = 1; i < weights.length; i++) {
    if (weights[i] < weights[i-1]) {
      currentStreak++;
      if (currentStreak > longestStreak) longestStreak = currentStreak;
    } else {
      currentStreak = 0;
    }
  }
  
  // 最大单日降幅
  let maxDrop = 0;
  for (let i = 1; i < weights.length; i++) {
    const drop = weights[i-1] - weights[i];
    if (drop > maxDrop) maxDrop = drop;
  }
  
  // 反弹最严重的区间（连续两次以上反弹）
  let reboundSegments = [];
  let segmentStart = -1;
  for (let i = 1; i < weights.length; i++) {
    if (weights[i] > weights[i-1]) {
      if (segmentStart === -1) segmentStart = i-1;
    } else {
      if (segmentStart !== -1 && i - segmentStart > 1) {
        reboundSegments.push({ start: segmentStart, end: i-1, dates: dates.slice(segmentStart, i) });
      }
      segmentStart = -1;
    }
  }
  if (segmentStart !== -1 && weights.length - segmentStart > 1) {
    reboundSegments.push({ start: segmentStart, end: weights.length-1, dates: dates.slice(segmentStart) });
  }
  const worstRebound = reboundSegments.length ? reboundSegments.reduce((a,b) => (a.end - a.start) > (b.end - b.start) ? a : b) : null;
  
  // 周平均减重速度（每周按7天，计算每周变化率）
  let weeklyRate = 0;
  if (records.length >= 2) {
    const daysDiff = (new Date(dates[dates.length-1]) - new Date(dates[0])) / (1000*3600*24);
    if (daysDiff > 0) weeklyRate = (totalChange / daysDiff) * 7;
  }
  
  // 标准差（波动）
  let variance = 0;
  weights.forEach(w => variance += Math.pow(w - avgWeight, 2));
  variance /= weights.length;
  const stdDev = Math.sqrt(variance);
  
  // 目标达成状态
  let goalStatus = '';
  let goalProgress = 0;
  if (plan.target_weight) {
    const initialDiff = firstWeight - plan.target_weight;
    if (initialDiff > 0) {
      const achieved = Math.max(0, firstWeight - lastWeight);
      goalProgress = (achieved / initialDiff) * 100;
      goalProgress = Math.min(100, Math.max(0, goalProgress));
    } else {
      goalProgress = lastWeight <= plan.target_weight ? 100 : 0;
    }
    if (lastWeight <= plan.target_weight) {
      goalStatus = '🎉 已达到目标体重！';
    } else {
      goalStatus = `⚠️ 距离目标还差 ${(lastWeight - plan.target_weight).toFixed(1)} kg (${Math.round(goalProgress)}%)`;
    }
  }
  
  // 个性化建议
  let suggestion = '';
  if (totalChange < 0) {
    suggestion = `恭喜！成功减重 ${Math.abs(totalChange).toFixed(1)} kg，平均每周减重 ${Math.abs(weeklyRate).toFixed(2)} kg。`;
    if (weeklyRate > 0.5) suggestion += ' 速度较快，请确保营养充足。';
    else if (weeklyRate < 0.2 && weeklyRate > 0) suggestion += ' 速度较慢，可适当增加运动量。';
  } else if (totalChange > 0) {
    suggestion = `体重上升了 ${totalChange.toFixed(1)} kg，建议增加运动，调整饮食。`;
    if (reboundCount > weights.length * 0.3) suggestion += ' 反弹频繁，建议保持稳定饮食节奏。';
  } else {
    suggestion = '体重无变化，可以尝试调整饮食结构或增加运动量。';
  }
  
  if (longestStreak > 3) {
    suggestion += ` 你曾连续下降 ${longestStreak} 天，说明有潜力，保持动力！`;
  }
  if (worstRebound && worstRebound.dates.length > 2) {
    suggestion += ` 注意：${worstRebound.dates[0]} 至 ${worstRebound.dates[worstRebound.dates.length-1]} 期间反弹明显，回顾饮食记录。`;
  }
  
  return {
    startWeight: firstWeight,
    endWeight: lastWeight,
    change: totalChange,
    changeAbs: Math.abs(totalChange).toFixed(1),
    avg: avgWeight.toFixed(1),
    min: minWeight,
    max: maxWeight,
    reboundCount,
    totalDays: records.length,
    goalStatus,
    goalProgress,
    suggestion,
    achievedGoal: plan.target_weight ? lastWeight <= plan.target_weight : false,
    longestStreak,
    maxDrop,
    weeklyRate: weeklyRate.toFixed(2),
    stdDev: stdDev.toFixed(2),
    worstReboundDates: worstRebound ? worstRebound.dates : null
  };
}

function drawMiniChart(ctx, timeline, width, height) {
  const valid = timeline.filter(t => t.weight !== null);
  if (valid.length < 2) return;
  const weights = valid.map(t => t.weight);
  const minW = Math.min(...weights);
  const maxW = Math.max(...weights);
  const range = maxW - minW || 1;
  const stepX = width / (valid.length - 1);
  
  ctx.clearRect(0, 0, width, height);
  ctx.beginPath();
  ctx.strokeStyle = '#2c5e2e';
  ctx.lineWidth = 2;
  for (let i = 0; i < valid.length; i++) {
    const x = i * stepX;
    const y = height - ((weights[i] - minW) / range) * height;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.stroke();
  
  // 添加点
  ctx.fillStyle = '#4c9e4e';
  for (let i = 0; i < valid.length; i++) {
    const x = i * stepX;
    const y = height - ((weights[i] - minW) / range) * height;
    ctx.beginPath();
    ctx.arc(x, y, 3, 0, Math.PI*2);
    ctx.fill();
  }
}

function drawRingChart(ctx, cx, cy, radius, progress, startAngle = -Math.PI/2) {
  const endAngle = startAngle + (Math.PI * 2 * progress / 100);
  ctx.clearRect(0, 0, radius*2+20, radius*2+20);
  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI*2);
  ctx.strokeStyle = '#e9ecef';
  ctx.lineWidth = 12;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(cx, cy, radius, startAngle, endAngle);
  ctx.strokeStyle = '#2c5e2e';
  ctx.stroke();
  ctx.fillStyle = '#2c5e2e';
  ctx.font = `bold ${radius * 0.5}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(`${Math.round(progress)}%`, cx, cy);
}

// ==================== 登录界面：SVG手臂捂眼系统 ====================
// 核心设计：每个角色有左右两条手臂，每条手臂由上臂+前臂+手掌三段组成
// 自然状态：手臂自然下垂在身体两侧
// 捂眼状态：手掌精确移动到对应眼睛位置，通过IK计算上臂/前臂弯曲角度
/**
 * 用SVG绘制一个角色的手臂系统
 * @param {SVGElement} svg - 角色专属SVG覆盖层
 * @param {object} cfg - 角色配置
 * @param {boolean} covering - 是否捂眼
 */
function buildArmSVG(svgEl, cfg, covering) {
  svgEl.innerHTML = '';
  const W            = cfg.bodyW;
  const skinColor    = cfg.skinColor;
  const upperArmLen  = cfg.upperArmLen;
  const foreArmLen   = cfg.foreArmLen;
  const armThick     = cfg.armThick;
  const palmW        = cfg.palmW;
  const palmH        = cfg.palmH;
  const leftShoulderX  = cfg.leftShoulderX;
  const rightShoulderX = cfg.rightShoulderX;
  const shoulderY      = cfg.shoulderY;
  const leftEyeCX      = cfg.leftEyeCX;
  const rightEyeCX     = cfg.rightEyeCX;
  const eyeCY          = cfg.eyeCY;
  // 颜色加深工具
  function shadeColor(hex, amount) {
    let r = parseInt(hex.slice(1,3),16);
    let g = parseInt(hex.slice(3,5),16);
    let b = parseInt(hex.slice(5,7),16);
    r = Math.max(0, Math.min(255, r + amount));
    g = Math.max(0, Math.min(255, g + amount));
    b = Math.max(0, Math.min(255, b + amount));
    return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
  }
  /**
   * IK 求解肘关节位置
   */
  function solveIK(sx, sy, tx, ty, L1, L2, side) {
    const dx = tx - sx, dy = ty - sy;
    let dist = Math.sqrt(dx*dx + dy*dy);
    dist = Math.min(dist, L1 + L2 - 0.1);
    dist = Math.max(dist, Math.abs(L1 - L2) + 0.1);
    const a  = (L1*L1 - L2*L2 + dist*dist) / (2 * dist);
    const h  = Math.sqrt(Math.max(0, L1*L1 - a*a));
    const midX = sx + a * dx / dist;
    const midY = sy + a * dy / dist;
    const ex = midX + side * h * dy / dist;
    const ey = midY - side * h * dx / dist;
    return { ex, ey };
  }
  /**
   * 绘制梯形截面肢体：起点端宽度 = r*1.3，终点端宽度 = r
   * 上端（靠近肩膀/肘）更宽，下端（靠近肘/手腕）更窄
   */
  function drawLimb(svg, x1, y1, x2, y2, r, color, isUpper) {
    const dx  = x2 - x1, dy = y2 - y1;
    const len = Math.sqrt(dx*dx + dy*dy);
    if (len < 0.1) return;
    const nx = -dy / len, ny = dx / len; // 法线方向
    // 上端宽，下端窄
    const r1 = isUpper ? r * 1.3 : r * 1.1; // 起点半径
    const r2 = isUpper ? r       : r * 0.85; // 终点半径
    // 四个顶点
    const p1x = x1 + nx * r1, p1y = y1 + ny * r1; // 起点左
    const p2x = x1 - nx * r1, p2y = y1 - ny * r1; // 起点右
    const p3x = x2 - nx * r2, p3y = y2 - ny * r2; // 终点右
    const p4x = x2 + nx * r2, p4y = y2 + ny * r2; // 终点左
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    const d = `M${p1x},${p1y} L${p2x},${p2y} L${p3x},${p3y} L${p4x},${p4y} Z`;
    path.setAttribute('d', d);
    path.setAttribute('fill', color);
    path.setAttribute('stroke', shadeColor(color, -25));
    path.setAttribute('stroke-width', '0.8');
    path.setAttribute('stroke-linejoin', 'round');
    svg.appendChild(path);
  }
  /**
   * 绘制手掌 + 5根明显参差不齐的手指
   * 左右手使用完全相同的尺寸参数，仅手指展开方向镜像
   */
  function drawPalm(svg, cx, cy, angle, pw, ph, r, color, isLeft) {
    const cos = Math.cos(angle);
    const sin = Math.sin(angle);
    // 手掌椭圆中心（沿手臂方向向前 ph*0.5）
    const palmCX = cx + cos * ph * 0.5;
    const palmCY = cy + sin * ph * 0.5;
    // 手掌指端（用于手指根部起点参考）
    const tipCX  = cx + cos * ph;
    const tipCY  = cy + sin * ph;
    // 手掌椭圆
    const palmEl = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
    palmEl.setAttribute('cx', palmCX);
    palmEl.setAttribute('cy', palmCY);
    palmEl.setAttribute('rx', ph * 0.52);
    palmEl.setAttribute('ry', pw * 0.48);
    palmEl.setAttribute('fill', color);
    palmEl.setAttribute('stroke', shadeColor(color, -25));
    palmEl.setAttribute('stroke-width', '0.8');
    const deg = angle * 180 / Math.PI;
    palmEl.setAttribute('transform', `rotate(${deg},${palmCX},${palmCY})`);
    svg.appendChild(palmEl);
    // ---- 5根手指：长度比例差异显著，符合真实手型 ----
    // 顺序：拇指、食指、中指、无名指、小指
    // 长度比例（中指最长，拇指最短且偏离）
    const fingerLenRatios  = [0.45, 0.82, 1.0, 0.88, 0.58];
    // 粗细比例（拇指最粗，小指最细）
    const fingerThickRatios = [0.52, 0.40, 0.38, 0.36, 0.28];
    const baseFingerLen    = ph * 0.75;
    const fingerBaseThick  = r * 0.42;
    // 扇形展开：5根手指均匀分布在一定角度范围内
    // isLeft:  手指从右往左展开（拇指在右侧）
    // !isLeft: 手指从左往右展开（拇指在左侧）
    const spreadTotal = 0.72; // 总扇形角度（弧度），约41度
    // 拇指偏角额外偏移（拇指与其他四指间距更大）
    const thumbExtra  = 0.18;
    // 各手指角度偏移（相对于手臂方向）
    // 正值 = 顺时针，负值 = 逆时针
    const fingerAngleOffsets = isLeft
      ? [ spreadTotal/2 + thumbExtra,   // 拇指：最右
          spreadTotal/4,                 // 食指
          0,                             // 中指：正中
         -spreadTotal/4,                 // 无名指
         -spreadTotal/2 ]                // 小指：最左
      : [ -spreadTotal/2 - thumbExtra,  // 拇指：最左
         -spreadTotal/4,                 // 食指
          0,                             // 中指：正中
          spreadTotal/4,                 // 无名指
          spreadTotal/2 ];               // 小指：最右
    // 手指根部在手掌指端附近，按手掌宽度方向分布
    const perpAngle = angle + Math.PI / 2; // 垂直于手臂方向
    const spreadStep = (pw * 0.72) / 4;    // 手指根部间距
    for (let i = 0; i < 5; i++) {
      const fLen   = baseFingerLen  * fingerLenRatios[i];
      const fThick = fingerBaseThick * fingerThickRatios[i];
      const fAngle = angle + fingerAngleOffsets[i];
      // 手指根部位置：沿手掌宽度方向均匀分布
      const offsetIdx = i - 2; // -2,-1,0,1,2
      const fRootX = tipCX + Math.cos(perpAngle) * spreadStep * (isLeft ? -offsetIdx : offsetIdx);
      const fRootY = tipCY + Math.sin(perpAngle) * spreadStep * (isLeft ? -offsetIdx : offsetIdx);
      // 手指末端
      const fTipX = fRootX + Math.cos(fAngle) * fLen;
      const fTipY = fRootY + Math.sin(fAngle) * fLen;
      // 手指用 drawLimb（上粗下细）
      drawLimb(svg, fRootX, fRootY, fTipX, fTipY, fThick, color, false);
      // 指甲（小椭圆，颜色略浅）
      const nailR = fThick * 0.55;
      const nail  = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      nail.setAttribute('cx', fTipX);
      nail.setAttribute('cy', fTipY);
      nail.setAttribute('r',  nailR);
      nail.setAttribute('fill', shadeColor(color, 15));
      nail.setAttribute('stroke', shadeColor(color, -8));
      nail.setAttribute('stroke-width', '0.5');
      svg.appendChild(nail);
    }
  }
  /**
   * 绘制完整手臂：肩→肘→手腕→手掌+手指
   */
  function drawArm(sx, sy, targetX, targetY, side, isLeft) {
    const { ex, ey } = solveIK(sx, sy, targetX, targetY, upperArmLen, foreArmLen, side);
    const wristAngle = Math.atan2(targetY - ey, targetX - ex);
    // 上臂（isUpper=true：起点更宽）
    drawLimb(svgEl, sx, sy, ex, ey, armThick, skinColor, true);
    // 前臂（isUpper=false）
    drawLimb(svgEl, ex, ey, targetX, targetY, armThick * 0.82, skinColor, true);
    // 手掌+手指
    drawPalm(svgEl, targetX, targetY, wristAngle, palmW, palmH, armThick * 0.72, skinColor, isLeft);
  }
  if (covering) {
    // 捂眼：左手→左眼中心，右手→右眼中心
    drawArm(leftShoulderX,  shoulderY, leftEyeCX,  eyeCY,  1,  true);
    drawArm(rightShoulderX, shoulderY, rightEyeCX, eyeCY, -1, false);
  } else {
    // 自然下垂
    const leftHangX  = leftShoulderX  - W * 0.18;
    const rightHangX = rightShoulderX + W * 0.18;
    const hangY      = shoulderY + upperArmLen + foreArmLen;
    drawArm(leftShoulderX,  shoulderY, leftHangX,  hangY,  1,  true);
    drawArm(rightShoulderX, shoulderY, rightHangX, hangY, -1, false);
  }
} // end buildArmSVG
// ==================== 创建角色DOM元素（含SVG手臂层） ====================
function createCharacter(cfg) {
  // 外层容器
  const wrap = document.createElement('div');
  wrap.style.cssText = `
    position: absolute;
    bottom: 0;
    left: ${cfg.left};
    width: ${cfg.bodyW}px;
    height: ${cfg.bodyH}px;
    z-index: ${cfg.zIndex};
    transition: transform 0.7s cubic-bezier(0.34,1.2,0.64,1);
    transform-origin: bottom center;
  `;
  wrap.dataset.type = cfg.type;
  // 身体
  const body = document.createElement('div');
  body.style.cssText = `
    position: absolute;
    bottom: 0;
    left: 0;
    width: ${cfg.bodyW}px;
    height: ${cfg.bodyH}px;
    background: ${cfg.bodyColor};
    border-radius: ${cfg.borderRadius};
  `;
  wrap.appendChild(body);
  // 眼睛容器
  const eyesDiv = document.createElement('div');
  eyesDiv.style.cssText = `
    position: absolute;
    display: flex;
    gap: ${cfg.eyeGap}px;
    left: ${cfg.eyesLeft}px;
    top: ${cfg.eyesTop}px;
    transition: left 0.4s ease, top 0.4s ease;
  `;
  function makeEye() {
    const white = document.createElement('div');
    white.className = 'eye-white';
    white.style.cssText = `
      width: ${cfg.eyeSize}px;
      height: ${cfg.eyeSize}px;
      background: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: height 0.1s ease;
    `;
    const pupil = document.createElement('div');
    pupil.className = 'pupil';
    pupil.style.cssText = `
      width: ${cfg.pupilSize}px;
      height: ${cfg.pupilSize}px;
      background: #2D2D2D;
      border-radius: 50%;
      transition: transform 0.1s ease-out;
    `;
    white.appendChild(pupil);
    return { white, pupil };
  }
  const leftEye  = makeEye();
  const rightEye = makeEye();
  eyesDiv.appendChild(leftEye.white);
  eyesDiv.appendChild(rightEye.white);
  wrap.appendChild(eyesDiv);
  // SVG 手臂层（覆盖在身体上方，尺寸比角色宽，以容纳侧伸手臂）
  const svgNS = 'http://www.w3.org/2000/svg';
  const svgEl = document.createElementNS(svgNS, 'svg');
  // SVG 比角色宽，向两侧各扩展 armOverflow，向上扩展，以便手臂有足够空间
  const armOverflow = cfg.bodyW * 0.7;
  const svgW = cfg.bodyW + armOverflow * 2;
  const svgH = cfg.bodyH + 20;
  svgEl.setAttribute('width',  svgW);
  svgEl.setAttribute('height', svgH);
  svgEl.setAttribute('viewBox', `0 0 ${svgW} ${svgH}`);
  svgEl.style.cssText = `
    position: absolute;
    left: ${-armOverflow}px;
    top: -10px;
    overflow: visible;
    pointer-events: none;
    z-index: 10;
  `;
  wrap.appendChild(svgEl);
  // 将配置中相对于角色div的坐标，转换到SVG坐标系（SVG原点在角色左上角左移armOverflow）
  // svgX = charX + armOverflow
  const ao = armOverflow;
  const svgCfg = Object.assign({}, cfg, {
    leftShoulderX:  cfg.leftShoulderX  + ao,
    rightShoulderX: cfg.rightShoulderX + ao,
    shoulderY:      cfg.shoulderY      + 10, // +10 是svgEl top:-10px 的偏移
    leftEyeCX:      cfg.leftEyeCX      + ao,
    rightEyeCX:     cfg.rightEyeCX     + ao,
    eyeCY:          cfg.eyeCY          + 10,
  });
  // 存引用
  wrap._svgEl    = svgEl;
  wrap._svgCfg   = svgCfg;
  wrap._eyesDiv  = eyesDiv;
  wrap._leftPupil  = leftEye.pupil;
  wrap._rightPupil = rightEye.pupil;
  wrap._leftEyeEl  = leftEye.white;
  wrap._rightEyeEl = rightEye.white;
  wrap._cfg = cfg;
  // 初始绘制（自然下垂）
  buildArmSVG(svgEl, svgCfg, false);
  return wrap;
}
// ==================== 更新瞳孔方向 ====================
function updatePupils(wrap, mouseX, mouseY, forceDX, forceDY) {
  const maxD = 4;
  function setP(pupil, eyeEl, fdx, fdy) {
    if (fdx !== undefined) {
      pupil.style.transform = `translate(${fdx}px,${fdy}px)`;
    } else {
      const r = eyeEl.getBoundingClientRect();
      const cx = r.left + r.width  / 2;
      const cy = r.top  + r.height / 2;
      const dx = mouseX - cx, dy = mouseY - cy;
      const dist = Math.min(Math.sqrt(dx*dx+dy*dy), maxD);
      const ang  = Math.atan2(dy, dx);
      pupil.style.transform = `translate(${Math.cos(ang)*dist}px,${Math.sin(ang)*dist}px)`;
    }
  }
  setP(wrap._leftPupil,  wrap._leftEyeEl,  forceDX, forceDY);
  setP(wrap._rightPupil, wrap._rightEyeEl, forceDX, forceDY);
}

            </div>
          </div>
        </div>
      </div>
    </div>
  `;
  const container = document.getElementById('charactersWrapper');
  // ---- 角色配置 ----

  // eyesLeft/eyesTop: 眼睛容器左上角
  // leftEyeCX/rightEyeCX/eyeCY: 左右眼中心（用于IK目标）
  // leftShoulderX/rightShoulderX/shoulderY: 肩膀位置
const charDefs = [
  {
    type: 'purple', left: '70px',
    bodyW: 180, bodyH: 400,
    bodyColor: '#6C3FF5', borderRadius: '10px 10px 0 0', zIndex: 1,
    eyesLeft: 52, eyesTop: 48, eyeGap: 28, eyeSize: 20, pupilSize: 8,
    leftEyeCX: 62, rightEyeCX: 110, eyeCY: 58,
    leftShoulderX: 22, rightShoulderX: 158, shoulderY: 160,
    upperArmLen: 52, foreArmLen: 44, armThick: 9,
    palmW: 22, palmH: 18,
    skinColor: '#6C3FF5',  // 与bodyColor完全一致
  },
  {
    type: 'black', left: '240px',
    bodyW: 120, bodyH: 310,
    bodyColor: '#2D2D2D', borderRadius: '8px 8px 0 0', zIndex: 2,
    eyesLeft: 30, eyesTop: 38, eyeGap: 22, eyeSize: 18, pupilSize: 8,
    leftEyeCX: 40, rightEyeCX: 80, eyeCY: 47,
    leftShoulderX: 12, rightShoulderX: 108, shoulderY: 120,
    upperArmLen: 40, foreArmLen: 34, armThick: 7,
    palmW: 17, palmH: 14,
    skinColor: '#2D2D2D',  // 与bodyColor完全一致
  },
  {
    type: 'orange', left: '0px',
    bodyW: 240, bodyH: 200,
    bodyColor: '#FF9B6B', borderRadius: '120px 120px 0 0', zIndex: 3,
    eyesLeft: 90, eyesTop: 98, eyeGap: 28, eyeSize: 20, pupilSize: 8,
    leftEyeCX: 100, rightEyeCX: 148, eyeCY: 108,
    leftShoulderX: 28, rightShoulderX: 212, shoulderY: 118,
    upperArmLen: 34, foreArmLen: 28, armThick: 8,
    palmW: 18, palmH: 15,
    skinColor: '#FF9B6B',  // 与bodyColor完全一致
  },
  {
    type: 'yellow', left: '310px',
    bodyW: 140, bodyH: 230,
    bodyColor: '#E8D754', borderRadius: '70px 70px 0 0', zIndex: 4,
    eyesLeft: 56, eyesTop: 46, eyeGap: 22, eyeSize: 16, pupilSize: 7,
    leftEyeCX: 64, rightEyeCX: 102, eyeCY: 54,
    leftShoulderX: 14, rightShoulderX: 126, shoulderY: 88,
    upperArmLen: 30, foreArmLen: 26, armThick: 7,
    palmW: 16, palmH: 13,
    skinColor: '#E8D754',  // 与bodyColor完全一致
  },
];
  const chars = charDefs.map(cfg => {
    const el = createCharacter(cfg);
    container.appendChild(el);
    return el;
  });
  // ---- 状态 ----
  let showPassword     = false;
  let mouseX = 0, mouseY = 0;
  let isTyping         = false;
  let typingTimer      = null;
  // 眨眼
  const blinkStates = chars.map(() => false);
  chars.forEach((ch, idx) => {
    function scheduleBlink() {
      const delay = Math.random() * 4000 + 2500;
      setTimeout(() => {
        blinkStates[idx] = true;
        applyBlink(ch, true);
        setTimeout(() => {
          blinkStates[idx] = false;
          applyBlink(ch, false);
          scheduleBlink();
        }, 140);
      }, delay);
    }
    scheduleBlink();
  });
  function applyBlink(ch, isBlinking) {
    [ch._leftEyeEl, ch._rightEyeEl].forEach(e => {
      e.style.height = isBlinking ? '2px' : `${ch._cfg.eyeSize}px`;
    });
  }
  // ---- 主更新 ----
  function updateAll() {
    chars.forEach((ch, idx) => {
      const cfg = ch._cfg;
      // 身体微微跟随鼠标倾斜
      const rect = ch.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const skew = Math.max(-5, Math.min(5, (mouseX - cx) / 80));
      ch.style.transform = `skewX(${-skew}deg)`;
      // 眼睛位置偏移（跟随输入/鼠标）
      let eyeOffX = 0, eyeOffY = 0;
      if (!showPassword && !isTyping) {
        const charCX = rect.left + rect.width  / 2;
        const charCY = rect.top  + rect.height / 3;
        eyeOffX = Math.max(-8, Math.min(8,  (mouseX - charCX) / 25));
        eyeOffY = Math.max(-5, Math.min(5,  (mouseY - charCY) / 40));
      }
      if (isTyping) { eyeOffX = 0; eyeOffY = 4; }
      ch._eyesDiv.style.left = `${cfg.eyesLeft + eyeOffX}px`;
      ch._eyesDiv.style.top  = `${cfg.eyesTop  + eyeOffY}px`;
      // 瞳孔
      if (showPassword) {
        // 捂眼时瞳孔往上偏（躲避）
        updatePupils(ch, mouseX, mouseY, -2, -3);
      } else if (isTyping) {
        updatePupils(ch, mouseX, mouseY, 0, 3);
      } else {
        updatePupils(ch, mouseX, mouseY, undefined, undefined);
      }
      // 手臂：捂眼时传入当前眼睛中心位置（含偏移）
      const svgCfg = Object.assign({}, ch._svgCfg);
      if (showPassword) {
        // 眼睛中心随eyeOff同步移动
        svgCfg.leftEyeCX  = ch._svgCfg.leftEyeCX  + eyeOffX;
        svgCfg.rightEyeCX = ch._svgCfg.rightEyeCX + eyeOffX;
        svgCfg.eyeCY      = ch._svgCfg.eyeCY       + eyeOffY;
      }
      buildArmSVG(ch._svgEl, svgCfg, showPassword);
    });
  }
  window.addEventListener('mousemove', e => {
    mouseX = e.clientX;
    mouseY = e.clientY;
    updateAll();
  });
  const emailInput = document.getElementById('loginEmail');
  const pwdInput   = document.getElementById('loginPassword');
  [emailInput, pwdInput].forEach(inp => {
    inp.addEventListener('input', () => {
      isTyping = true;
      clearTimeout(typingTimer);
      typingTimer = setTimeout(() => { isTyping = false; updateAll(); }, 900);
      updateAll();
    });
  });
  document.getElementById('togglePasswordBtn').addEventListener('click', () => {
    showPassword = !showPassword;
    pwdInput.type = showPassword ? 'text' : 'password';
    document.getElementById('togglePasswordBtn').textContent = showPassword ? '🙈' : '👁️';
    updateAll();
  });
  document.getElementById('loginBtn').onclick = async () => {
    const email = emailInput.value.trim();
    const pwd   = pwdInput.value.trim();
    const errDiv = document.getElementById('authError');
    errDiv.innerText = '';
    if (!email || !pwd) { errDiv.innerText = '请输入邮箱和密码'; return; }
    const { error } = await supabaseClient.auth.signInWithPassword({ email, password: pwd });
    if (error) errDiv.innerText = error.message;
    else window.location.hash = '#plans';
  };
  document.getElementById('registerBtn').onclick = async () => {
    const email = emailInput.value.trim();
    const pwd   = pwdInput.value.trim();
    const errDiv = document.getElementById('authError');
    if (!email || !pwd) { errDiv.innerText = '请输入邮箱和密码'; return; }
    if (pwd.length < 6) { errDiv.innerText = '密码至少6位'; return; }
    const { error } = await supabaseClient.auth.signUp({ email, password: pwd });
    if (error) errDiv.innerText = error.message;
    else alert('注册成功，请登录');
  };
  updateAll();
  setInterval(updateAll, 120);
} // end renderLogin

    document.getElementById('dailyModal').classList.remove('show');
  document.getElementById('dailyForm').onsubmit = async (e) => {
    e.preventDefault();
    const food   = document.querySelector('#dailyForm textarea[name="food_text"]').value;
    const weight = document.querySelector('#dailyForm input[name="weight_kg"]').value;
    const success = await saveDailyRecord(food, weight);
    if (success) {
      document.getElementById('dailyModal').classList.remove('show');
      await refreshDetail();
    }
  };
  document.getElementById('deleteDailyBtn').onclick = async () => {
    const ok = await deleteDailyRecord();
    if (ok) {
      document.getElementById('dailyModal').classList.remove('show');
      await refreshDetail();
    }
  };
  document.getElementById('quickAddTodayBtn').onclick = () => {
    const today = formatYMD(new Date());
    if (today >= plan.start_date && today <= plan.end_date) {
      openDailyModal(today, recordMap.get(today));
    } else {
      alert('今日不在当前减肥周期内，请选择周期内日期记录');
    }
  };
  // 使用增强版总结
  document.getElementById('summaryBtn').onclick = () => showEnhancedSummaryModal(plan, timeline);
  document.getElementById('logoutBtn').onclick   = () => logout();
  renderDailyList();
  initChart();
} // end renderPlanDetail

async function checkAuth() {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) { currentUserId = session.user.id; return true; }
  currentUserId = null;
  window.location.hash = '#login';
  return false;
}
// ==================== 路由 ====================
async function router() {
  const hash = window.location.hash.slice(1);
  if (hash === 'login')               await renderLogin();
  else if (hash === 'plans')          await renderPlans();
  else if (hash.startsWith('plan/'))  await renderPlanDetail(hash.split('/')[1]);
  else {
    const { data: { session } } = await supabaseClient.auth.getSession();
    window.location.hash = session ? '#plans' : '#login';
  }
}
